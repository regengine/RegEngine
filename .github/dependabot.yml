version: 2

updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    ignore:
      # Major framework upgrades handled manually via consolidated branches
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Majors that cannot go green on this toolchain yet. Remove an entry once
      # its blocker below clears, then let CI judge the upgrade on its own.
      #   eslint 10   — eslint-config-next 16.2.12 calls the pre-10 scope-manager
      #                 API (scopeManager.addGlobals); `eslint .` crashes outright.
      #   jsdom 30    — requires Node >=22.22.2; CI runs Node 20.
      #   jest-dom 7  — requires Node >=22 and a new @testing-library/dom peer.
      #   typescript 7 — typescript-eslint 8.x (via eslint-config-next) peers
      #                 typescript <6.1.0; `npm run lint` crashes in
      #                 typescript-estree ("reading 'Cjs'"). Backed out in
      #                 #3113 and #3145; the major group re-proposed it in #3157.
      #   @vitest/coverage-v8 5 — must share vitest's major, and vitest majors
      #                 are ignored above; a lone bump leaves the lock off
      #                 package.json's range and `npm ci` fails (#3138, #3157).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  # Python services — security-critical packages get solo PRs (no group entry
  # means Dependabot opens one PR per package). Dev/test tooling is grouped to
  # reduce noise. Everything else is grouped by category while the per-ecosystem
  # open PR limit keeps review volume bounded (#1178).
  #
  # Security-critical (solo PRs): cryptography, pyjwt, python-jose, sqlalchemy,
  # alembic, fastapi, starlette, stripe, httpx, opentelemetry-*

  # KNOWN LIMITATION — a root-pip PR from Dependabot is never mergeable as
  # opened. It edits requirements.in and leaves requirements.lock untouched,
  # so the "Verify requirements.lock freshness" gate in backend-ci.yml fails
  # until someone recompiles the lock into the PR branch by hand.
  #
  # This is a filename problem, not a Dependabot bug. The compiled output is
  # named requirements.lock; Dependabot's pip-compile support looks for the
  # conventional requirements.txt. #2780 shows both behaviours in one PR: it
  # updated cli/requirements.txt and did not update requirements.lock.
  # #2780-#2784 all landed this way, and #2787 had to resync afterwards.
  #
  # Handled automatically since 2026-09-28: .github/workflows/dependabot-lock-sync.yml
  # recompiles requirements.lock on the PR branch (pinning only the packages
  # whose new floor the old lock violates, at exactly Dependabot's version),
  # pushes it, and re-dispatches backend-ci + security. Wait for those runs to
  # go green before merging. The rename to requirements.txt remains the
  # longer-term alternative.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Separate major upgrades so routine minor/patch updates can land independently.
      root-backend-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "cryptography"
          - "pyjwt"
          - "python-jose"
          - "sqlalchemy"
          - "alembic"
          - "fastapi"
          - "starlette"
          - "stripe"
          - "httpx"
          - "opentelemetry-*"
        update-types: ["minor", "patch"]
      root-backend-major:
        patterns:
          - "*"
        exclude-patterns:
          - "cryptography"
          - "pyjwt"
          - "python-jose"
          - "sqlalchemy"
          - "alembic"
          - "fastapi"
          - "starlette"
          - "stripe"
          - "httpx"
          - "opentelemetry-*"
        update-types: ["major"]

  # Services directories no longer have their own requirements files;
  # all Python dependencies are managed at the repository root.
  # Removed stale /services/* pip entries that were causing
  # dependency_file_not_found failures.

  # GitHub Actions
  # Actions are pinned by SHA in privileged workflows. Keep Dependabot
  # responsible for proposing SHA refreshes instead of relying on mutable tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Separate major upgrades so routine minor/patch updates can land independently.
      all-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      actions-major:
        patterns:
          - "*"
        update-types: ["major"]
