version: 2

updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    ignore:
      # Major framework upgrades handled manually via consolidated branches
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Majors that cannot go green on this toolchain yet. Remove an entry once
      # its blocker below clears, then let CI judge the upgrade on its own.
      #   eslint 10   — eslint-config-next 16.2.12 calls the pre-10 scope-manager
      #                 API (scopeManager.addGlobals); `eslint .` crashes outright.
      #   jsdom 30    — requires Node >=22.22.2; CI runs Node 20.
      #   jest-dom 7  — requires Node >=22 and a new @testing-library/dom peer.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]

  # Python services — security-critical packages get solo PRs (no group entry
  # means Dependabot opens one PR per package). Dev/test tooling is grouped to
  # reduce noise. Everything else is grouped by category while the per-ecosystem
  # open PR limit keeps review volume bounded (#1178).
  #
  # Security-critical (solo PRs): cryptography, pyjwt, python-jose, sqlalchemy,
  # alembic, fastapi, starlette, stripe, httpx, opentelemetry-*

  # KNOWN LIMITATION — a root-pip PR from Dependabot is never mergeable as
  # opened. It edits requirements.in and leaves requirements.lock untouched,
  # so the "Verify requirements.lock freshness" gate in backend-ci.yml fails
  # until someone recompiles the lock into the PR branch by hand.
  #
  # This is a filename problem, not a Dependabot bug. The compiled output is
  # named requirements.lock; Dependabot's pip-compile support looks for the
  # conventional requirements.txt. #2780 shows both behaviours in one PR: it
  # updated cli/requirements.txt and did not update requirements.lock.
  # #2780-#2784 all landed this way, and #2787 had to resync afterwards.
  #
  # Durable fix is to rename requirements.lock -> requirements.txt, which
  # touches the Dockerfile and ten workflows and so wants its own PR. Until
  # then: expect the red gate, run the pip-compile command it prints, push.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      root-backend-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "cryptography"
          - "pyjwt"
          - "python-jose"
          - "sqlalchemy"
          - "alembic"
          - "fastapi"
          - "starlette"
          - "stripe"
          - "httpx"
          - "opentelemetry-*"

  - package-ecosystem: "pip"
    directory: "/services/admin"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      dev-test:
        # Dev/test tooling — low risk, grouped to reduce noise
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage*"
          - "hypothesis"
          - "freezegun"
          - "fakeredis"
      aws:
        # AWS SDK family
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      observability:
        # Non-security observability helpers
        patterns:
          - "sentry-sdk"
          - "structlog"
          - "prometheus-client"
      # Security-critical packages are intentionally NOT listed in any group.
      # Dependabot will open one PR per package for:
      #   cryptography, pyjwt, python-jose, sqlalchemy, alembic,
      #   fastapi, starlette, stripe, httpx, opentelemetry-*

  - package-ecosystem: "pip"
    directory: "/services/ingestion"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      dev-test:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage*"
          - "hypothesis"
          - "freezegun"
          - "fakeredis"
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      observability:
        patterns:
          - "sentry-sdk"
          - "structlog"
          - "prometheus-client"

  - package-ecosystem: "pip"
    directory: "/services/compliance"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      dev-test:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage*"
          - "hypothesis"
          - "freezegun"
          - "fakeredis"
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      observability:
        patterns:
          - "sentry-sdk"
          - "structlog"
          - "prometheus-client"

  - package-ecosystem: "pip"
    directory: "/services/graph"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      dev-test:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage*"
          - "hypothesis"
          - "freezegun"
          - "fakeredis"
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      observability:
        patterns:
          - "sentry-sdk"
          - "structlog"
          - "prometheus-client"
      neo4j:
        patterns:
          - "neo4j"
          - "neo4j-driver"

  - package-ecosystem: "pip"
    directory: "/services/nlp"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      dev-test:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage*"
          - "hypothesis"
          - "freezegun"
          - "fakeredis"
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      observability:
        patterns:
          - "sentry-sdk"
          - "structlog"
          - "prometheus-client"
      nlp-models:
        # NLP/ML libraries
        patterns:
          - "spacy*"
          - "transformers"
          - "torch"
          - "scikit-learn"

  - package-ecosystem: "pip"
    directory: "/services/scheduler"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      dev-test:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage*"
          - "hypothesis"
          - "freezegun"
          - "fakeredis"
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      observability:
        patterns:
          - "sentry-sdk"
          - "structlog"
          - "prometheus-client"

  # GitHub Actions
  # Actions are pinned by SHA in privileged workflows. Keep Dependabot
  # responsible for proposing SHA refreshes instead of relying on mutable tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown: wait before adopting brand-new releases
    # (dependabot security updates are not delayed by cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      all-actions:
        patterns:
          - "*"
