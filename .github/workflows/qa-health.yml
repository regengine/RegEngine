name: QA Health Summary

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: qa-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  summarize:
    name: Build QA health artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_VERSION: "24"
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        continue-on-error: true
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Run backend pytest
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          mkdir -p .qa-health
          python3 -m pytest --no-cov --junitxml=.qa-health/pytest.xml

      - name: Run npm ci
        id: npm_ci
        continue-on-error: true
        run: |
          cd frontend
          set +e
          npm ci
          status=$?
          set -e
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Diagnostic fallback frontend install
        if: always() && steps.npm_ci.outputs.exit_code != '0'
        continue-on-error: true
        run: |
          cd frontend
          npm install --no-save --no-audit --no-fund --ignore-scripts

      - name: Run frontend lint
        if: always()
        continue-on-error: true
        run: |
          cd frontend
          npm run lint -- --format json --output-file ../.qa-health/eslint.json

      - name: Run Vitest
        if: always()
        continue-on-error: true
        run: |
          cd frontend
          npm run test:run -- --reporter=junit --outputFile=../.qa-health/vitest.xml

      - name: Install Playwright Chromium
        if: always()
        continue-on-error: true
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        if: always()
        continue-on-error: true
        env:
          INGESTION_SERVICE_URL: https://regengine-production.up.railway.app
          COMPLIANCE_SERVICE_URL: https://regengine-production.up.railway.app
          ADMIN_SERVICE_URL: https://regengine-production.up.railway.app
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          JWT_PREVIOUS_KEY: ${{ secrets.JWT_PREVIOUS_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
        run: |
          cd frontend
          set +e
          playwright_timeout="30m"
          timeout "$playwright_timeout" npm run test:e2e -- --reporter=json > ../.qa-health/playwright.json &
          playwright_pid=$!
          while kill -0 "$playwright_pid" 2>/dev/null; do
            echo "Playwright E2E still running at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            sleep 30
          done
          wait "$playwright_pid"
          playwright_status=$?
          if [[ "$playwright_status" -eq 124 ]]; then
            cat > ../.qa-health/playwright.json <<JSON
          {
            "errors": [
              {
                "message": "Playwright E2E timed out after ${playwright_timeout} in QA Health"
              }
            ],
            "suites": []
          }
          JSON
          fi
          set -e
          exit "$playwright_status"

      - name: Build normalized QA health summary
        if: always()
        run: |
          python3 scripts/qa_health_summary.py \
            --out .qa-health/qa-health-summary.json \
            --pytest-xml .qa-health/pytest.xml \
            --eslint-json .qa-health/eslint.json \
            --vitest-junit .qa-health/vitest.xml \
            --playwright-json .qa-health/playwright.json \
            --npm-ci-exit-code "${{ steps.npm_ci.outputs.exit_code || '-1' }}"

      - name: Upload QA health summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: qa-health-summary
          path: |
            .qa-health/qa-health-summary.json
            .qa-health/pytest.xml
            .qa-health/eslint.json
            .qa-health/vitest.xml
            .qa-health/playwright.json
          retention-days: 14
          if-no-files-found: warn
