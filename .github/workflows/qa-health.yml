# DASHBOARD ARTIFACT BUILDER — NOT A MERGE GATE.
#
# Every test/install step here is `continue-on-error: true` by design: this job
# builds a redacted QA-health JSON artifact for the sysadmin dashboard
# (consumed by services/admin/app/qa_health.py via GET /v1/system/qa-health),
# not a pass/fail gate. It cannot fail on a test regression and must not be
# added to branch protection's required checks. main deliberately carries an
# honest-red rollup when suites are failing (#2614).
#
# The real merge/deploy gates live elsewhere: "Backend CI Status Gate"
# (backend-ci.yml) and "Frontend CI Status Gate" (frontend-ci.yml), surfaced to
# branch protection via the always-on "PR Gate: *" checks in pr-gate.yml. The
# repo already answered the "qa-health doesn't gate" gap by building those
# separate real gates rather than making this one blocking (#2502).
name: QA Health Summary

# Deliberately NOT run on pull_request. This job is a dashboard artifact
# builder, not a gate (see the header above), so a per-PR run bought no
# signal that the real "PR Gate: *" checks do not already provide — while
# being one of the most expensive jobs in the repo. Its full-suite cost on
# every PR push was a material contributor to exhausting the org's Actions
# budget on 2026-08-03. The artifact tracks default-branch health.
#
# It does NOT reach the dashboard. This job uploads a GitHub Actions artifact;
# nothing downloads it at runtime. `services/admin/app/qa_health.py` reads
# `qa/qa-health/latest.json`, a file checked into the repo and baked into the
# image by `Dockerfile`, which no workflow writes — and `qa/**` is not in
# `deploy.yml`'s path filter, so even committing a refresh by hand ships no
# redeploy. An earlier version of this comment claimed the artifact was "what
# the sysadmin dashboard actually reports"; it never was.
#
# Production consequently served a snapshot frozen at 2026-07-23 labelled
# "Latest CI artifact". The loader now refuses to present an artifact older
# than QA_HEALTH_MAX_AGE_DAYS as current, so the stale file reads as
# `unavailable` rather than as month-old results stated with confidence.
# Closing the loop properly means publishing this artifact somewhere the
# service can read at runtime.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]

concurrency:
  group: qa-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  summarize:
    name: Build QA health artifact
    runs-on: ubuntu-latest
    # Was 60. Every step below now carries its own bound, so the job ceiling
    # is a backstop rather than the thing that actually stops a runaway run —
    # two observed runs burned 57 and 72 minutes and produced no artifact at
    # all because the job timeout was the only limit in play.
    # The job ceiling is a pure backstop and must sit above the sum of the
    # step bounds (15 + 28 + 5 = 48, plus setup overhead) — a ceiling below
    # that sum can only ever cancel healthy runs, never catch a runaway
    # before a step bound does (runs 30973063688/30979898499 proved it).
    timeout-minutes: 55
    env:
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        continue-on-error: true
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Run backend pytest
        timeout-minutes: 15
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          mkdir -p .qa-health
          python3 -m pytest --no-cov --junitxml=.qa-health/pytest.xml

      - name: Run npm ci
        id: npm_ci
        continue-on-error: true
        run: |
          cd frontend
          set +e
          npm ci
          status=$?
          set -e
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Diagnostic fallback frontend install
        if: always() && steps.npm_ci.outputs.exit_code != '0'
        continue-on-error: true
        run: |
          cd frontend
          npm install --no-save --no-audit --no-fund --ignore-scripts

      - name: Run frontend lint
        if: always()
        continue-on-error: true
        run: |
          cd frontend
          npm run lint -- --format json --output-file ../.qa-health/eslint.json

      - name: Run Vitest
        if: always()
        continue-on-error: true
        run: |
          cd frontend
          npm run test:run -- --reporter=junit --outputFile=../.qa-health/vitest.xml

      - name: Install Playwright Chromium
        if: always()
        continue-on-error: true
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      # Runs against the local stack, NOT production. playwright.config.ts
      # takes its self-hosted branch whenever PLAYWRIGHT_BASE_URL is unset:
      # it starts the backend (scripts/start-e2e-backend.sh on :8000) and a
      # Next server on :3001, and deliberately overrides any inherited
      # service URLs "so CI cannot accidentally mutate production".
      #
      # This previously pointed at regengine-production.up.railway.app, which
      # made production latency into billable CI minutes — a slow or
      # unreachable backend meant this step burned its entire timeout every
      # run. The real gate (frontend-ci.yml) has always used local mode with
      # these same fixed test keys; this only brings qa-health in line.
      - name: Run Playwright E2E
        if: always()
        continue-on-error: true
        # 28, not 22: the suite ran ~20m before the inflow-lab tour spec added
        # six geometry tests (~2m of real coverage). 22m left no headroom and
        # would cancel healthy runs — the same trap the job ceiling fell into.
        # (Correction: that "~20m" was not the suite finishing — it was the
        # inner `timeout "$playwright_timeout"` below firing at its 20m cap;
        # see the comment on playwright_timeout. 28 remains correct as the
        # OUTER bound: it must exceed the inner cap by enough for the
        # exit-124 fallback to write the timeout marker into the report.)
        timeout-minutes: 28
        env:
          AUTH_SECRET_KEY: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
          JWT_SIGNING_KEY: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
          AUTH_OTP_HMAC_SECRET: playwright-local-otp-hmac-secret-2026-minimum-32-bytes # pragma: allowlist secret
          CSRF_SECRET: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
          ADMIN_MASTER_KEY: playwright-local-admin-master-key-2026
          API_KEY: playwright-local-regengine-api-key-2026 # pragma: allowlist secret
          REGENGINE_API_KEY: playwright-local-regengine-api-key-2026 # pragma: allowlist secret
          REGENGINE_E2E_EMAIL_OUTBOX: /tmp/regengine-playwright-email-outbox.jsonl
        run: |
          cd frontend
          set +e
          # 24m, up from 20m — and 20m was never the suite's honest runtime.
          # Three consecutive main runs (08-06, 08-11, 08-15) ended this step
          # at exactly 20m00–20m01s: the signature of `timeout` firing, not a
          # suite landing on a round number, and job cleanup logged orphaned
          # next-server/npm-dev/backend processes each time. Since #2748 cut
          # this cap from 30m to 20m the suite has NOT ONCE been observed to
          # complete; every run took the exit-124 path below, which replaces
          # the report with "suites": [] — so the dashboard has been reading
          # zero E2E coverage while continue-on-error kept the step green.
          # #2766 then raised the step bound 22m->28m to chase that "~20m
          # runtime", which changed nothing because THIS value is the actual
          # limiter. The two must move together: keep this a few minutes
          # under timeout-minutes above so the fallback write still runs.
          # If the suite hits 24m too, treat it as a hang to profile — do
          # not raise this again on the assumption the suite is just slow.
          playwright_timeout="24m"
          timeout "$playwright_timeout" npm run test:e2e -- --reporter=json > ../.qa-health/playwright.json &
          playwright_pid=$!
          while kill -0 "$playwright_pid" 2>/dev/null; do
            echo "Playwright E2E still running at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            sleep 30
          done
          wait "$playwright_pid"
          playwright_status=$?
          if [[ "$playwright_status" -eq 124 ]]; then
            cat > ../.qa-health/playwright.json <<JSON
          {
            "errors": [
              {
                "message": "Playwright E2E timed out after ${playwright_timeout} in QA Health"
              }
            ],
            "suites": []
          }
          JSON
          fi
          set -e
          exit "$playwright_status"

      # This is the step that actually stalled: in run 30802416703 it sat
      # in_progress for 21 minutes until the job timeout killed it, so the
      # artifact was never uploaded. The script itself does no I/O that can
      # block, so the stall came from the environment around it (orphaned
      # Playwright/webServer processes still holding the step's output
      # pipe). A bound turns that into a fast, legible failure.
      - name: Build normalized QA health summary
        if: always()
        timeout-minutes: 5
        run: |
          python3 scripts/qa_health_summary.py \
            --out .qa-health/qa-health-summary.json \
            --pytest-xml .qa-health/pytest.xml \
            --eslint-json .qa-health/eslint.json \
            --vitest-junit .qa-health/vitest.xml \
            --playwright-json .qa-health/playwright.json \
            --npm-ci-exit-code "${{ steps.npm_ci.outputs.exit_code || '-1' }}"

      - name: Upload QA health summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: qa-health-summary
          path: |
            .qa-health/qa-health-summary.json
            .qa-health/pytest.xml
            .qa-health/eslint.json
            .qa-health/vitest.xml
            .qa-health/playwright.json
          retention-days: 14
          if-no-files-found: warn
