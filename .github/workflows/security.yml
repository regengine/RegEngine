name: security

# The always-on PR Gate scans secrets on PRs to main, and
# pr-secrets-non-main.yml covers other PRs, including docs-only changes.
# This workflow skips docs-only PRs and keeps the full scans on main,
# schedule, and workflow_dispatch.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 06:00 UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Security path changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sast: ${{ steps.filter.outputs.sast }}
      deps: ${{ steps.filter.outputs.deps }}
      tenant: ${{ steps.filter.outputs.tenant }}
      frontend: ${{ steps.filter.outputs.frontend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: filter
        with:
          filters: |
            sast:
              - '**/*.py'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.mts'
              - '**/*.tsx'
              - '**/*.sh'
              - '**/*.sql'
              - '**/*.cypher'
              - '**/*.tf'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.toml'
              - '.semgrep/**'
              - 'data-schemas/**'
              - '.github/workflows/**'
              - 'Dockerfile*'
            deps:
              - '**/requirements*'
              - '**/package*.json'
              - 'pyproject.toml'
              - 'Dockerfile*'
              - '.trivyignore'
              - 'scripts/check_trivyignore_sync.py'
              - '.github/workflows/security.yml'
            tenant:
              - 'alembic/**'
              - 'alembic.ini'
              - 'server/**'
              - 'services/**'
              - 'shared/**'
              - 'kernel/**'
              - 'regengine/**'
              - 'packages/**'
              - 'audit/**'
              - 'security/**'
              - 'sql/**'
              - 'data-schemas/**'
              - 'plugins/fsma/**'
              - 'scripts/**'
              - 'tests/**'
              - '**/requirements*'
              - 'pyproject.toml'
              - 'Dockerfile*'
              - '.github/workflows/security.yml'
            frontend:
              - 'frontend/**'
              - 'scripts/security/scan_browser_storage_pii.py'
              - '.github/workflows/security.yml'
            app:
              - 'server/**'
              - 'services/**'
              - 'shared/**'
              - 'kernel/**'
              - 'plugins/**'
              - 'frontend/**'
              - 'Dockerfile*'
              - '**/requirements*'
              - 'scripts/security/zap_baseline.sh'
              - '.github/workflows/security.yml'

  # ──────────────────────────────────────────────
  # 0. Privileged Workflow Tool Pinning
  # ──────────────────────────────────────────────
  workflow-tool-pinning:
    name: Privileged Workflow Tool Pinning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Reject mutable action refs and privileged tool installs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Cover EVERY workflow, not just deploy.yml/security.yml. Scoping the
          # gate to two files is what let sentinel.yml drift to a mutable ref
          # unnoticed (#2562 fixed that instance; this closes the class). Any
          # new or edited workflow is now held to the SHA-pin / install-pin
          # policy automatically.
          workflow_dir = Path(".github/workflows")
          files = sorted(workflow_dir.glob("*.yml")) + sorted(workflow_dir.glob("*.yaml"))
          action_ref = re.compile("uses:" + r"\s*([^@\s#]+)@([^\s#]+)")
          pinned_sha = re.compile(r"^[0-9a-f]{40}$")
          install_patterns = [
              re.compile(r"npm\s+install\s+-g\s+@railway/cli(?!@)"),
              # Issue #2812: sentinel.yml installs this CLI in a job holding
              # issues:write + pull-requests:write on untrusted PR head code.
              re.compile(r"npm\s+install\s+-g\s+\"?@anthropic-ai/claude-code(?!@)"),
              re.compile(r"pip\s+install(?:\s+[^\n#]*)?\s+semgrep(?!==)"),
              re.compile(r"pip\s+install(?:\s+[^\n#]*)?\s+pip-audit(?!==)"),
              re.compile(r"python\s+-m\s+pip\s+install(?:\s+[^\n#]*)?\s+semgrep(?!==)"),
              re.compile(r"python\s+-m\s+pip\s+install(?:\s+[^\n#]*)?\s+pip-audit(?!==)"),
          ]

          failures = []
          for path in files:
              for lineno, line in enumerate(path.read_text().splitlines(), start=1):
                  match = action_ref.search(line)
                  if match and not pinned_sha.match(match.group(2)):
                      failures.append(f"{path}:{lineno}: action ref is not pinned to a 40-char SHA: {match.group(0)}")

                  for pattern in install_patterns:
                      if pattern.search(line):
                          failures.append(f"{path}:{lineno}: privileged tool install is not version-pinned: {line.strip()}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print("Privileged workflow tooling is pinned")
          PY

  # ──────────────────────────────────────────────
  # 1. Secrets Scan (gitleaks)
  # ──────────────────────────────────────────────
  secrets:
    name: Secrets Scan (gitleaks)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: v8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  # pragma: allowlist secret
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          # On pull_request, gate only the commits in the PR so historical
          # findings (tracked in #3080) do not block unrelated changes.
          # On push/schedule, scan the full history to catch regressions.
          LOG_OPTS=""
          if [ -n "$BASE_SHA" ]; then
            LOG_OPTS="--log-opts=${BASE_SHA}..HEAD"
          fi
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            $LOG_OPTS

  # ──────────────────────────────────────────────
  # 1b. Secrets Audit (detect-secrets) — #1173
  # ──────────────────────────────────────────────
  # Complements gitleaks (#1). gitleaks is a broad regex scanner with an
  # allowlist; detect-secrets is the same scanner we run in pre-commit and
  # produces a "new vs baseline" diff against `.secrets.baseline`. Running
  # it here enforces the tighter-signal tool in CI instead of trusting that
  # every contributor has `pre-commit install` wired up locally.
  detect-secrets:
    name: Secrets Audit (detect-secrets)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        # Pin matches .pre-commit-config.yaml (rev v1.5.0) so CI enforces
        # the same rules developers see locally.
        run: pip install detect-secrets==1.5.0

      - name: Scan for new secrets (fail on findings not in baseline)
        # The pre-commit hook uses the same baseline/exclude list; mirror it
        # here so pre-commit and CI agree on which files are in scope.
        # `detect-secrets-hook` is the CLI the pre-commit hook invokes — it
        # exits non-zero when it finds a potential secret that isn't already
        # captured in `.secrets.baseline`.
        run: |
          # shellcheck disable=SC2046
          detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-files '.*\.lock$' \
            --exclude-files '.*package-lock\.json$' \
            --exclude-files '\.secrets\.baseline$' \
            $(git ls-files)

      - name: Baseline report (informational)
        # Prints the current baseline contents as a JSON report so reviewers
        # can see what's been accepted as a known false positive. Purely
        # informational — does not gate the build.
        run: detect-secrets audit --report .secrets.baseline || true

  # ──────────────────────────────────────────────
  # 1c. Browser Storage PII Guard
  # ──────────────────────────────────────────────
  browser-storage-pii:
    name: Browser Storage PII Guard
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Block sensitive browser persistence
        run: python3 scripts/security/scan_browser_storage_pii.py frontend/src

  # ──────────────────────────────────────────────
  # 2. SAST (Semgrep — CLI, not deprecated action)
  # ──────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.sast == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Keep full history available for Semgrep and other security checks
          # that may need repository context.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.161.0

      - name: Semgrep OWASP hard gate (fail on any finding)
        # Original behavior: --error with no severity filter. Do not add
        # --severity ERROR here; that would silently relax the OWASP gate.
        run: |
          semgrep \
            --config p/owasp-top-ten \
            --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text \
            --exclude-rule python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
            --json --output semgrep-owasp-results.json \
            --error .
          # --error causes semgrep to exit non-zero if any OWASP findings are
          # found. This preserves the previous blocking behavior while removing
          # the separate artifact-only OWASP/security-audit scan.
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # Gate: ERROR-level findings fail CI. See issue #1157.
      # p/security-audit findings were previously uploaded as an artifact only
      # (silently ignored on PRs). This step gates the build on ERROR severity
      # findings from that ruleset. WARNING-level findings are informational
      # and do not block CI, keeping the gate signal-to-noise ratio manageable.
      - name: Semgrep security-audit gate (fail on ERROR severity -- #1157)
        run: |
          semgrep --config=p/security-audit \
            --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text \
            --exclude-rule python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
            --severity ERROR \
            --json --output semgrep-security-audit-results.json \
            --error .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Semgrep repo-local rules gate (tenant-trust + FDA export + user shape + webhook signature)
        run: |
          # No grandfathered tenant-trust findings. Tenant authority must come
          # from authenticated principal state; see services/shared/tenant_context.py.
          #
          # Issue #2813: every semgrep call passes an explicit --config, which
          # disables auto-discovery of the root .semgrep.yml. Its ERROR rule
          # (fda-export-writer-requires-safe-cell, the FDA CSV-injection guard)
          # and .semgrep/current-user-shape.yaml therefore never ran. Both are
          # loaded explicitly here alongside tenant-trust.
          semgrep --config=.semgrep/tenant-trust.yaml \
            --config=.semgrep.yml \
            --config=.semgrep/current-user-shape.yaml \
            --config=.semgrep/webhook-signature.yaml \
            --error \
            --json --output semgrep-tenant-trust.json \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Tenant-scope query gate (Pattern 3, fails on new violations)
        # Required check. The scanner flags Cypher MATCH/MERGE on tenant
        # data and SQL on fsma tenant tables without a tenant predicate,
        # plus the $tenant_id IS NULL OR fail-open shim. Sites that are
        # scoped at runtime (dynamic WHERE builders, global-DB reads,
        # control-plane ops) are baselined in
        # .semgrep/tenant-scope-allowlist.yml with a reason each; anything
        # else fails the build. The semgrep rules in
        # .semgrep/tenant-query-scope.yaml cover the same ground for
        # editors and ad-hoc runs; they stay out of the blocking gate
        # until the baselined sites are fixed in product code, because
        # semgrep cannot consume the allowlist and would fail on them.
        run: |
          python -m pip install "pyyaml==6.0.3"
          python3 scripts/security/scan_tenant_scope.py

      - name: Upload EPIC-A Semgrep results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: semgrep-tenant-trust
          path: semgrep-tenant-trust.json
          retention-days: 90

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: semgrep-results
          path: |
            semgrep-owasp-results.json
            semgrep-security-audit-results.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # 3. Dependency Audit (pip-audit / npm audit)
  # ──────────────────────────────────────────────
  deps:
    name: Dependency Audit
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      # ---- Node (frontend/) ----
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm audit --omit=dev --audit-level=high --json > ../npm-audit-results.json || true
            npm audit --omit=dev --audit-level=high
            cd ..
          else
            echo "No Node project detected."
            echo '{"info": "no node project"}' > npm-audit-results.json
          fi

      # ---- Python (if present) ----
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.0
          # Temporary documented ignores:
          # - PYSEC-2025-183 / PyJWT: no fixed version is published; RegEngine
          #   signs HS256 session JWTs with generated high-entropy AUTH_SECRET_KEY.
          # - PYSEC-2024-278 / langchain-community: pip-audit flags current
          #   0.4.1 even though advisory metadata says fixed in 0.0.27.
          # - PYSEC-2026-161 / starlette: Host header path poisoning (BadHost).
          #   Fix is starlette 1.0.1, blocked because prometheus-fastapi-
          #   instrumentator 7.1.0 (latest) pins starlette<1.0.0. Mitigated at
          #   the app layer: every FastAPI service validates the Host header via
          #   TrustedHostMiddleware (shared add_trusted_host / add_security),
          #   rejecting the forged Host headers this advisory relies on. Revisit
          #   when prometheus-fastapi-instrumentator supports starlette 1.x.
          # - CVE-2026-48818 / starlette: Windows-only StaticFiles UNC SSRF.
          #   RegEngine production runs Linux containers; revisit once FastAPI
          #   supports the Starlette 1.x fixed line.
          # - CVE-2026-48817 / starlette: HTTPEndpoint non-standard method
          #   dispatch. RegEngine does not register Starlette HTTPEndpoint
          #   subclasses; revisit once FastAPI supports the fixed line.
          # - CVE-2026-54282 and CVE-2026-54283 / starlette: request URL/form
          #   parser hardening fixed in Starlette 1.x. FastAPI 0.136 still
          #   resolves Starlette 0.52.x, so keep this explicit until the
          #   framework dependency allows 1.x.
          pip_audit_ignores=(
            --ignore-vuln PYSEC-2025-183
            --ignore-vuln PYSEC-2024-278
            --ignore-vuln PYSEC-2026-161
            --ignore-vuln CVE-2026-48818
            --ignore-vuln CVE-2026-48817
            --ignore-vuln CVE-2026-54282
            --ignore-vuln CVE-2026-54283
          )
          # Audit the lockfiles installed by the root and factory-local apps.
          # The factory-local bootstrap uses its lock with --require-hashes.
          python_files=$( { find . -name requirements.txt -not -path "./.venv/*" -not -path "./frontend/*"; [ -f requirements.lock ] && echo ./requirements.lock; [ -f packages/factory-local/requirements.lock ] && echo ./packages/factory-local/requirements.lock; } | sort)
          if [ -n "$python_files" ]; then
            printf '%s\n' "$python_files" > pip-audit-targets.txt
            {
              printf '{\n  "audits": [\n'
              first=1
              while IFS= read -r req_file; do
                [ -n "$req_file" ] || continue
                echo "Auditing $req_file" >&2
                pip_audit_args=()
                if [ "$req_file" = "./packages/factory-local/requirements.lock" ]; then
                  # This fully pinned lock targets Python 3.12; the audit job uses 3.11.
                  pip_audit_args=(--no-deps --disable-pip)
                fi
                audit_json=$(mktemp)
                pip-audit -r "$req_file" --format json --output "$audit_json" "${pip_audit_args[@]}" "${pip_audit_ignores[@]}" || true
                pip-audit -r "$req_file" "${pip_audit_args[@]}" "${pip_audit_ignores[@]}" >&2
                if [ $first -eq 0 ]; then
                  printf ',\n'
                fi
                printf '    {\n      "file": "%s",\n      "results": ' "$req_file"
                cat "$audit_json"
                printf '\n    }'
                first=0
                rm -f "$audit_json"
              done < pip-audit-targets.txt
              printf '\n  ]\n}\n'
            } > pip-audit-results.json
          elif [ -f pyproject.toml ]; then
            pip-audit --format json --output pip-audit-results.json "${pip_audit_ignores[@]}" || true
            pip-audit "${pip_audit_ignores[@]}"
          else
            echo "No Python deps detected."
            echo '{"info": "no python project"}' > pip-audit-results.json
          fi

      # Keep .trivyignore in lockstep with the pip-audit --ignore-vuln set so
      # the container scan can't hard-fail on accepted-risk Starlette CVEs the
      # team already documented in the pip-audit gate (#2528). This runs in the
      # `deps` job rather than `container-scan` so it gates PRs too.
      - name: Verify .trivyignore mirrors the pip-audit ignore set
        run: python scripts/check_trivyignore_sync.py

      - name: Upload dependency audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dependency-audit
          path: |
            npm-audit-results.json
            pip-audit-results.json
            pip-audit-targets.txt
          retention-days: 90

  # ──────────────────────────────────────────────
  # 4. Tenant Isolation Tests
  # ──────────────────────────────────────────────
  tenant-isolation:
    name: Tenant Isolation & Auth Tests
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.tenant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret — throwaway CI-service password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # The in-process app dials Redis (idempotency / rate-limit
        # middleware) on request paths these tests exercise; without it
        # they 500. Local runs lean on the dev-stack Redis the same way.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # Install from the root requirements.lock (pip-compile output; #1139).
          # Falls back silently if the file isn't present so tenant-isolation
          # tests still run on branches predating this migration. If the file
          # IS present, hash-verified install must succeed — fail loud on
          # hash mismatch or missing dep instead of silently swallowing.
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          fi
          pip install pytest httpx pytest-json-report pytest-asyncio requests sqlalchemy "psycopg[binary]"

      - name: Create scratch database (dedicated migration + runtime roles)
        env:
          PGPASSWORD: postgres # pragma: allowlist secret — disposable CI service
        run: | # pragma: allowlist secret
          # Database name must NOT be regengine/regengine_admin: the #2646
          # guard (tests/migrations/rls_db.py) refuses loopback URLs with
          # those names even under CI=true, and the whole job would skip.
          # The provider credential creates roles and the database only. The
          # full Alembic chain then runs as the exact NOCREATEROLE,
          # NOBYPASSRLS schema owner used by production migration jobs.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres <<'EOSQL'
          CREATE ROLE regengine LOGIN PASSWORD 'runtime-test-password'
              NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE regengine_sysadmin LOGIN PASSWORD 'admin-runtime-test-password'
              NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE regengine_migrator_ci LOGIN PASSWORD 'migration-test-password'
              NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE DATABASE live_suite OWNER regengine_migrator_ci;
          GRANT CONNECT ON DATABASE live_suite TO regengine, regengine_sysadmin;
          EOSQL
          # get_tenant_context() is referenced by baseline RLS policies but
          # created by NO migration — production Supabase carries it from
          # pre-baseline state. Seed it exactly as scripts/init-postgres.sh
          # does for local databases, or `alembic upgrade head` fails. Create
          # it as the migration owner so no provider-owned function is hidden
          # in an otherwise least-privilege rehearsal.
          PGPASSWORD=migration-test-password psql -v ON_ERROR_STOP=1 \
            -h localhost -U regengine_migrator_ci -d live_suite <<'EOSQL'
          CREATE OR REPLACE FUNCTION get_tenant_context()
          RETURNS UUID AS $fn$
          DECLARE
              tid TEXT;
          BEGIN
              tid := NULLIF(current_setting('app.tenant_id', TRUE), '');
              IF tid IS NULL THEN
                  RAISE EXCEPTION 'app.tenant_id not set - tenant context required for RLS';
              END IF;
              RETURN tid::UUID;
          END;
          $fn$ LANGUAGE plpgsql STABLE;
          EOSQL

      - name: Run fresh and managed migration-runner paths
        env:
          MIGRATIONS_DATABASE_URL: postgresql://regengine_migrator_ci:migration-test-password@localhost:5432/live_suite  # pragma: allowlist secret
          REGENGINE_MIGRATIONS_ROLE: regengine_migrator_ci
          DATABASE_URL: postgresql://regengine:runtime-test-password@localhost:5432/live_suite  # pragma: allowlist secret
          ADMIN_DATABASE_URL: postgresql://regengine_sysadmin:admin-runtime-test-password@localhost:5432/live_suite  # pragma: allowlist secret
          MIGRATION_LOCK_TIMEOUT_S: "10"
        run: |
          repo_root="$(pwd)"
          export PYTHONPATH="${repo_root}:${repo_root}/services:${PYTHONPATH}"
          # First invocation proves the full chain as the dedicated
          # NOCREATEROLE migration owner. The second proves the managed-head
          # path and convergent v111 repair.
          bash scripts/run-migrations.sh
          bash scripts/run-migrations.sh

      - name: Run tenant isolation tests
        run: |
          bash scripts/security/tenant_isolation_test.sh --source
        env:
          # All connections target this job's disposable service container.
          # Provider privileges are only for explicit fixture setup; requests
          # and direct-role assertions use the restricted runtime identities.
          MIGRATIONS_DATABASE_URL: postgresql://regengine_migrator_ci:migration-test-password@localhost:5432/live_suite # pragma: allowlist secret
          REGENGINE_MIGRATIONS_ROLE: regengine_migrator_ci
          REGENGINE_ENFORCE_MIGRATION_ROLE: "1"
          DATABASE_URL: postgresql://regengine:runtime-test-password@localhost:5432/live_suite # pragma: allowlist secret
          ADMIN_DATABASE_URL: postgresql://regengine_sysadmin:admin-runtime-test-password@localhost:5432/live_suite # pragma: allowlist secret
          ROLE_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/live_suite # pragma: allowlist secret
          REMEDIATION_TEST_APP_DSN: postgresql://regengine:runtime-test-password@localhost:5432/live_suite # pragma: allowlist secret
          REGENGINE_REQUIRE_DB: "1"
          REGENGINE_REQUIRE_RLS_ENFORCEMENT: "1"
          REDIS_URL: redis://localhost:6379/0

      - name: Upload isolation test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: tenant-isolation-results
          path: artifacts/tenant-isolation/
          retention-days: 90

  # ──────────────────────────────────────────────
  # 5. DAST (OWASP ZAP baseline)
  # ──────────────────────────────────────────────
  # Issue #2814: the scan step used to `exit 0` when ZAP_TARGET was unset, which
  # renders as a green check indistinguishable from a real passing scan. The
  # `secrets` context is not available in a job-level `if:`, so this preflight
  # job exposes "is it configured" as an output and the real job keys off that —
  # GitHub then renders DAST as genuinely *skipped* when unconfigured.
  dast-preflight:
    name: DAST preflight (ZAP_TARGET configured?)
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check ZAP_TARGET
        id: check
        env:
          ZAP_TARGET: ${{ secrets.ZAP_TARGET }}
        run: |
          if [ -n "${ZAP_TARGET:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZAP_TARGET is not configured — the DAST job will be SKIPPED, not passed."
          fi

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: dast-preflight
    if: needs.dast-preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: ZAP baseline scan
        run: bash scripts/security/zap_baseline.sh
        env:
          ZAP_TARGET: ${{ secrets.ZAP_TARGET }}

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: zap-reports
          path: artifacts/zap/
          retention-days: 90

  # ──────────────────────────────────────────────
  # 6. security.txt Expiry Check
  # ──────────────────────────────────────────────
  security-txt-expiry:
    name: security.txt Expiry Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Check security.txt expiration
        run: |
          EXPIRES=$(grep -i "^Expires:" frontend/public/.well-known/security.txt | awk '{print $2}')
          if [ -z "$EXPIRES" ]; then
            echo "WARNING: No Expires field in security.txt"
            exit 1
          fi
          EXPIRES_EPOCH=$(date -d "$EXPIRES" +%s 2>/dev/null || date -jf "%Y-%m-%dT%H:%M:%SZ" "$EXPIRES" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRES_EPOCH - NOW_EPOCH) / 86400 ))
          echo "security.txt expires in $DAYS_LEFT days ($EXPIRES)"
          if [ "$DAYS_LEFT" -lt 30 ]; then
            echo "CRITICAL: security.txt expires in less than 30 days. Update immediately."
            exit 1
          elif [ "$DAYS_LEFT" -lt 90 ]; then
            echo "WARNING: security.txt expires in less than 90 days. Plan rotation."
          fi

  # ──────────────────────────────────────────────
  # 6b. SBOM Generation (Anchore syft) — #1169
  # ──────────────────────────────────────────────
  sbom:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [secrets, sast, deps]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write  # required for cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign SBOM artifact (keyless via Sigstore)
        # This workflow generates an SPDX artifact for review; it does not push
        # a container image to a registry. Sign the SBOM blob directly so the
        # signature remains verifiable without requiring Docker Hub auth.
        run: |
          cosign sign-blob --yes \
            --bundle sbom.spdx.sigstore.json \
            sbom.spdx.json

      - name: Upload SBOM signature bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom-signature
          path: |
            sbom.spdx.sigstore.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # 7. Container Scan (Trivy) — consolidated monolith image
  # ──────────────────────────────────────────────
  # Scans the single image Railway actually deploys (repo-root Dockerfile).
  # The per-service images under services/<svc>/ aren't deployed and were
  # dropping fail-open on the ecosystem's Trivy DB churn. See #1429.
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR trigger removed (#2032): building the monolith image on every PR is
    # the largest single Actions minute consumer in this workflow. Keep on
    # push-to-main, scheduled weekly, and on-demand via workflow_dispatch.
    if: github.event_name != 'pull_request'
    needs: [secrets, sast, deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build image
        run: docker build -t regengine:ci -f Dockerfile .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          image-ref: "regengine:ci"
          format: "json"
          output: "trivy.json"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: trivy
          path: trivy.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # 8. Audit Chain Integrity (ISO 27001 12.7.1)
  # ──────────────────────────────────────────────
  # Issue #2814: the in-job "validate secrets" step reported success when the
  # audit secrets were absent, so an unconfigured run was a green check rather
  # than a skip. `secrets` cannot be read from a job-level `if:`, so the check
  # is hoisted into a preflight job whose output gates the real one — scheduled
  # runs skip with a warning when unconfigured; requested runs fail. PR/push
  # runs do not make authenticated calls to a deployed environment.
  audit-integrity-preflight:
    name: Audit chain preflight (secrets configured?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check audit chain secrets
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUDIT_API_BASE: ${{ secrets.AUDIT_API_BASE }}
          AUDIT_TOKEN: ${{ secrets.AUDIT_VERIFY_TOKEN }}
        run: |
          if [ -n "${AUDIT_API_BASE:-}" ] && [ -n "${AUDIT_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::warning::Audit chain check skipped because AUDIT_API_BASE / AUDIT_VERIFY_TOKEN are not configured."
              exit 0
            else
              echo "::error::AUDIT_API_BASE / AUDIT_VERIFY_TOKEN are required for the requested audit chain check."
              exit 1
            fi
          fi

  audit-integrity:
    name: Audit Chain Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: audit-integrity-preflight
    if: needs.audit-integrity-preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Run audit chain check
        env:
          AUDIT_API_BASE: ${{ secrets.AUDIT_API_BASE }}
          AUDIT_TOKEN: ${{ secrets.AUDIT_VERIFY_TOKEN }}
        run: |
          chmod +x scripts/security/verify_audit_chain.sh
          bash scripts/security/verify_audit_chain.sh
