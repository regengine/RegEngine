name: security

# Six jobs here emit branch-protection required contexts (Privileged Workflow
# Tool Pinning, Secrets Scan (gitleaks), Secrets Audit (detect-secrets),
# Browser Storage PII Guard, SAST (Semgrep), Dependency Audit). A required
# context MUST be able to post on every PR, so the `pull_request:` trigger
# below is deliberately UNFILTERED — see docs/runbooks/BRANCH_PROTECTION.md and
# scripts/check_workflow_inventory.py, which fails CI if a filter reappears.
#
# It previously carried `paths-ignore: ['**/*.md', 'docs/**', ...]`, which made
# every docs-only PR structurally unmergeable: six required checks never
# posted, so the PR sat in "Expected — waiting for status" forever and could
# only land via admin override. Scanning docs is also correct on its own
# merits — secrets get pasted into markdown runbooks, and gitleaks /
# detect-secrets are exactly the gates that catch it.
#
# The `push:` trigger keeps its filter: main-branch runs are not gating merges.
on:
  pull_request:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 06:00 UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────
  # 0. Privileged Workflow Tool Pinning
  # ──────────────────────────────────────────────
  workflow-tool-pinning:
    name: Privileged Workflow Tool Pinning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Reject mutable action refs and privileged tool installs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Cover EVERY workflow, not just deploy.yml/security.yml. Scoping the
          # gate to two files is what let sentinel.yml drift to a mutable ref
          # unnoticed (#2562 fixed that instance; this closes the class). Any
          # new or edited workflow is now held to the SHA-pin / install-pin
          # policy automatically.
          workflow_dir = Path(".github/workflows")
          files = sorted(workflow_dir.glob("*.yml")) + sorted(workflow_dir.glob("*.yaml"))
          action_ref = re.compile("uses:" + r"\s*([^@\s#]+)@([^\s#]+)")
          pinned_sha = re.compile(r"^[0-9a-f]{40}$")
          install_patterns = [
              re.compile(r"npm\s+install\s+-g\s+@railway/cli(?!@)"),
              re.compile(r"pip\s+install(?:\s+[^\n#]*)?\s+semgrep(?!==)"),
              re.compile(r"pip\s+install(?:\s+[^\n#]*)?\s+pip-audit(?!==)"),
              re.compile(r"python\s+-m\s+pip\s+install(?:\s+[^\n#]*)?\s+semgrep(?!==)"),
              re.compile(r"python\s+-m\s+pip\s+install(?:\s+[^\n#]*)?\s+pip-audit(?!==)"),
          ]

          failures = []
          for path in files:
              for lineno, line in enumerate(path.read_text().splitlines(), start=1):
                  match = action_ref.search(line)
                  if match and not pinned_sha.match(match.group(2)):
                      failures.append(f"{path}:{lineno}: action ref is not pinned to a 40-char SHA: {match.group(0)}")

                  for pattern in install_patterns:
                      if pattern.search(line):
                          failures.append(f"{path}:{lineno}: privileged tool install is not version-pinned: {line.strip()}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print("Privileged workflow tooling is pinned")
          PY

  # ──────────────────────────────────────────────
  # 1. Secrets Scan (gitleaks)
  # ──────────────────────────────────────────────
  secrets:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: v8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  # pragma: allowlist secret
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose

  # ──────────────────────────────────────────────
  # 1b. Secrets Audit (detect-secrets) — #1173
  # ──────────────────────────────────────────────
  # Complements gitleaks (#1). gitleaks is a broad regex scanner with an
  # allowlist; detect-secrets is the same scanner we run in pre-commit and
  # produces a "new vs baseline" diff against `.secrets.baseline`. Running
  # it here enforces the tighter-signal tool in CI instead of trusting that
  # every contributor has `pre-commit install` wired up locally.
  detect-secrets:
    name: Secrets Audit (detect-secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        # Pin matches .pre-commit-config.yaml (rev v1.5.0) so CI enforces
        # the same rules developers see locally.
        run: pip install detect-secrets==1.5.0

      - name: Scan for new secrets (fail on findings not in baseline)
        # The pre-commit hook uses the same baseline/exclude list; mirror it
        # here so pre-commit and CI agree on which files are in scope.
        # `detect-secrets-hook` is the CLI the pre-commit hook invokes — it
        # exits non-zero when it finds a potential secret that isn't already
        # captured in `.secrets.baseline`.
        run: |
          # shellcheck disable=SC2046
          detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-files '.*\.lock$' \
            --exclude-files '.*package-lock\.json$' \
            --exclude-files '\.secrets\.baseline$' \
            $(git ls-files)

      - name: Baseline report (informational)
        # Prints the current baseline contents as a JSON report so reviewers
        # can see what's been accepted as a known false positive. Purely
        # informational — does not gate the build.
        run: detect-secrets audit --report .secrets.baseline || true

  # ──────────────────────────────────────────────
  # 1c. Browser Storage PII Guard
  # ──────────────────────────────────────────────
  browser-storage-pii:
    name: Browser Storage PII Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Block sensitive browser persistence
        run: python3 scripts/security/scan_browser_storage_pii.py frontend/src

  # ──────────────────────────────────────────────
  # 2. SAST (Semgrep — CLI, not deprecated action)
  # ──────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Keep full history available for Semgrep and other security checks
          # that may need repository context.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.161.0

      - name: Semgrep OWASP hard gate (fail on any finding)
        # Original behavior: --error with no severity filter. Do not add
        # --severity ERROR here; that would silently relax the OWASP gate.
        run: |
          semgrep \
            --config p/owasp-top-ten \
            --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text \
            --exclude-rule python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
            --json --output semgrep-owasp-results.json \
            --error .
          # --error causes semgrep to exit non-zero if any OWASP findings are
          # found. This preserves the previous blocking behavior while removing
          # the separate artifact-only OWASP/security-audit scan.
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # Gate: ERROR-level findings fail CI. See issue #1157.
      # p/security-audit findings were previously uploaded as an artifact only
      # (silently ignored on PRs). This step gates the build on ERROR severity
      # findings from that ruleset. WARNING-level findings are informational
      # and do not block CI, keeping the gate signal-to-noise ratio manageable.
      - name: Semgrep security-audit gate (fail on ERROR severity -- #1157)
        run: |
          semgrep --config=p/security-audit \
            --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text \
            --exclude-rule python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
            --severity ERROR \
            --json --output semgrep-security-audit-results.json \
            --error .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Semgrep EPIC-A tenant-trust gate
        run: |
          # No grandfathered tenant-trust findings. Tenant authority must come
          # from authenticated principal state; see services/shared/tenant_context.py.
          semgrep --config=.semgrep/tenant-trust.yaml \
            --error \
            --json --output semgrep-tenant-trust.json \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload EPIC-A Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: semgrep-tenant-trust
          path: semgrep-tenant-trust.json
          retention-days: 90

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: semgrep-results
          path: |
            semgrep-owasp-results.json
            semgrep-security-audit-results.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # 3. Dependency Audit (pip-audit / npm audit)
  # ──────────────────────────────────────────────
  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      # ---- Node (frontend/) ----
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm audit --omit=dev --audit-level=high --json > ../npm-audit-results.json || true
            npm audit --omit=dev --audit-level=high
            cd ..
          else
            echo "No Node project detected."
            echo '{"info": "no node project"}' > npm-audit-results.json
          fi

      # ---- Python (if present) ----
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.0
          # Temporary documented ignores:
          # - PYSEC-2025-183 / PyJWT: no fixed version is published; RegEngine
          #   signs HS256 session JWTs with generated high-entropy AUTH_SECRET_KEY.
          # - PYSEC-2024-278 / langchain-community: pip-audit flags current
          #   0.4.1 even though advisory metadata says fixed in 0.0.27.
          # - PYSEC-2026-161 / starlette: Host header path poisoning (BadHost).
          #   Fix is starlette 1.0.1, blocked because prometheus-fastapi-
          #   instrumentator 7.1.0 (latest) pins starlette<1.0.0. Mitigated at
          #   the app layer: every FastAPI service validates the Host header via
          #   TrustedHostMiddleware (shared add_trusted_host / add_security),
          #   rejecting the forged Host headers this advisory relies on. Revisit
          #   when prometheus-fastapi-instrumentator supports starlette 1.x.
          # - CVE-2026-48818 / starlette: Windows-only StaticFiles UNC SSRF.
          #   RegEngine production runs Linux containers; revisit once FastAPI
          #   supports the Starlette 1.x fixed line.
          # - CVE-2026-48817 / starlette: HTTPEndpoint non-standard method
          #   dispatch. RegEngine does not register Starlette HTTPEndpoint
          #   subclasses; revisit once FastAPI supports the fixed line.
          # - CVE-2026-54282 and CVE-2026-54283 / starlette: request URL/form
          #   parser hardening fixed in Starlette 1.x. FastAPI 0.136 still
          #   resolves Starlette 0.52.x, so keep this explicit until the
          #   framework dependency allows 1.x.
          pip_audit_ignores=(
            --ignore-vuln PYSEC-2025-183
            --ignore-vuln PYSEC-2024-278
            --ignore-vuln PYSEC-2026-161
            --ignore-vuln CVE-2026-48818
            --ignore-vuln CVE-2026-48817
            --ignore-vuln CVE-2026-54282
            --ignore-vuln CVE-2026-54283
          )
          # Include root requirements.lock (pip-compile output, #1139) alongside
          # any per-service requirements*.txt files still present.
          python_files=$( { find . -name requirements.txt -not -path "./.venv/*" -not -path "./frontend/*"; [ -f requirements.lock ] && echo ./requirements.lock; } | sort)
          if [ -n "$python_files" ]; then
            printf '%s\n' "$python_files" > pip-audit-targets.txt
            {
              printf '{\n  "audits": [\n'
              first=1
              while IFS= read -r req_file; do
                [ -n "$req_file" ] || continue
                echo "Auditing $req_file" >&2
                audit_json=$(mktemp)
                pip-audit -r "$req_file" --format json --output "$audit_json" "${pip_audit_ignores[@]}" || true
                pip-audit -r "$req_file" "${pip_audit_ignores[@]}" >&2
                if [ $first -eq 0 ]; then
                  printf ',\n'
                fi
                printf '    {\n      "file": "%s",\n      "results": ' "$req_file"
                cat "$audit_json"
                printf '\n    }'
                first=0
                rm -f "$audit_json"
              done < pip-audit-targets.txt
              printf '\n  ]\n}\n'
            } > pip-audit-results.json
          elif [ -f pyproject.toml ]; then
            pip-audit --format json --output pip-audit-results.json "${pip_audit_ignores[@]}" || true
            pip-audit "${pip_audit_ignores[@]}"
          else
            echo "No Python deps detected."
            echo '{"info": "no python project"}' > pip-audit-results.json
          fi

      # Keep .trivyignore in lockstep with the pip-audit --ignore-vuln set so
      # the container scan can't hard-fail on accepted-risk Starlette CVEs the
      # team already documented in the pip-audit gate (#2528). This runs in the
      # `deps` job rather than `container-scan` so it gates PRs too.
      - name: Verify .trivyignore mirrors the pip-audit ignore set
        run: python scripts/check_trivyignore_sync.py

      - name: Upload dependency audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dependency-audit
          path: |
            npm-audit-results.json
            pip-audit-results.json
            pip-audit-targets.txt
          retention-days: 90

  # ──────────────────────────────────────────────
  # 4. Tenant Isolation Tests
  # ──────────────────────────────────────────────
  tenant-isolation:
    name: Tenant Isolation & Auth Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret — throwaway CI-service password
          POSTGRES_DB: postgres
        ports:
          # Host port 5433 matches the tests' default URLs
          # (postgresql://…@localhost:5433/regengine_admin).
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # The in-process app dials Redis (idempotency / rate-limit
        # middleware) on request paths these tests exercise; without it
        # they 500. Local runs lean on the dev-stack Redis the same way.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # Install from the root requirements.lock (pip-compile output; #1139).
          # Falls back silently if the file isn't present so tenant-isolation
          # tests still run on branches predating this migration. If the file
          # IS present, hash-verified install must succeed — fail loud on
          # hash mismatch or missing dep instead of silently swallowing.
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          fi
          pip install pytest httpx pytest-json-report pytest-asyncio requests sqlalchemy psycopg2-binary

      - name: Prepare security test database (roles + pre-baseline function)
        env:
          PGPASSWORD: postgres # pragma: allowlist secret
        run: |
          # Mirror backend-ci's remediation-db recipe: `regengine` owns the
          # database and applies the migration chain, so table ownership and
          # RLS policies match prod. get_tenant_context() is referenced by
          # baseline RLS policies but created by NO migration — seed the v097
          # fail-hard body or `alembic upgrade head` fails.
          psql -h localhost -p 5433 -U postgres -c "CREATE ROLE regengine LOGIN SUPERUSER PASSWORD 'regengine';"  # pragma: allowlist secret — throwaway CI-service password
          psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE regengine_admin OWNER regengine;"
          psql -h localhost -p 5433 -U postgres -d regengine_admin <<'EOSQL'
          CREATE OR REPLACE FUNCTION get_tenant_context()
          RETURNS UUID AS $fn$
          DECLARE
              tid TEXT;
          BEGIN
              tid := NULLIF(current_setting('app.tenant_id', TRUE), '');
              IF tid IS NULL THEN
                  RAISE EXCEPTION 'app.tenant_id not set - tenant context required for RLS';
              END IF;
              RETURN tid::UUID;
          END;
          $fn$ LANGUAGE plpgsql STABLE;
          EOSQL

      - name: Migrate security test database to alembic head
        env:
          DATABASE_URL: postgresql://regengine:regengine@localhost:5433/regengine_admin # pragma: allowlist secret
        run: |
          repo_root="$(pwd)"
          export PYTHONPATH="${repo_root}:${repo_root}/services:${PYTHONPATH}"
          alembic upgrade head

      - name: Run tenant isolation tests
        run: |
          bash scripts/security/tenant_isolation_test.sh
        env:
          # The in-process app and direct-DB RLS tests (#2593 killed the
          # skip theater) need a real migrated Postgres; the secrets-based
          # URLs remain for the legacy live-API test path.
          DATABASE_URL: postgresql://regengine:regengine@localhost:5433/regengine_admin # pragma: allowlist secret
          ADMIN_DATABASE_URL: postgresql://regengine:regengine@localhost:5433/regengine_admin # pragma: allowlist secret
          TEST_DB_URL: postgresql://regengine:regengine@localhost:5433/regengine_admin # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_API_BASE: ${{ secrets.TEST_API_BASE }}

      - name: Upload isolation test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: tenant-isolation-results
          path: artifacts/tenant-isolation/
          retention-days: 90

  # ──────────────────────────────────────────────
  # 5. DAST (OWASP ZAP baseline)
  # ──────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: ZAP baseline scan
        run: |
          if [ -z "${ZAP_TARGET:-}" ]; then
            echo "SKIP: ZAP_TARGET not configured. Set it in GitHub Secrets to enable DAST."
            exit 0
          fi
          bash scripts/security/zap_baseline.sh
        env:
          ZAP_TARGET: ${{ secrets.ZAP_TARGET }}

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: zap-reports
          path: artifacts/zap/
          retention-days: 90

  # ──────────────────────────────────────────────
  # 6. security.txt Expiry Check
  # ──────────────────────────────────────────────
  security-txt-expiry:
    name: security.txt Expiry Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Check security.txt expiration
        run: |
          EXPIRES=$(grep -i "^Expires:" frontend/public/.well-known/security.txt | awk '{print $2}')
          if [ -z "$EXPIRES" ]; then
            echo "WARNING: No Expires field in security.txt"
            exit 1
          fi
          EXPIRES_EPOCH=$(date -d "$EXPIRES" +%s 2>/dev/null || date -jf "%Y-%m-%dT%H:%M:%SZ" "$EXPIRES" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRES_EPOCH - NOW_EPOCH) / 86400 ))
          echo "security.txt expires in $DAYS_LEFT days ($EXPIRES)"
          if [ "$DAYS_LEFT" -lt 30 ]; then
            echo "CRITICAL: security.txt expires in less than 30 days. Update immediately."
            exit 1
          elif [ "$DAYS_LEFT" -lt 90 ]; then
            echo "WARNING: security.txt expires in less than 90 days. Plan rotation."
          fi

  # ──────────────────────────────────────────────
  # 6b. SBOM Generation (Anchore syft) — #1169
  # ──────────────────────────────────────────────
  sbom:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [secrets, sast, deps]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write  # required for cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign SBOM artifact (keyless via Sigstore)
        # This workflow generates an SPDX artifact for review; it does not push
        # a container image to a registry. Sign the SBOM blob directly so the
        # signature remains verifiable without requiring Docker Hub auth.
        run: |
          cosign sign-blob --yes \
            --bundle sbom.spdx.sigstore.json \
            sbom.spdx.json

      - name: Upload SBOM signature bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-signature
          path: |
            sbom.spdx.sigstore.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # 7. Container Scan (Trivy) — consolidated monolith image
  # ──────────────────────────────────────────────
  # Scans the single image Railway actually deploys (repo-root Dockerfile).
  # The per-service images under services/<svc>/ aren't deployed and were
  # dropping fail-open on the ecosystem's Trivy DB churn. See #1429.
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR trigger removed (#2032): building the monolith image on every PR is
    # the largest single Actions minute consumer in this workflow. Keep on
    # push-to-main, scheduled weekly, and on-demand via workflow_dispatch.
    if: github.event_name != 'pull_request'
    needs: [secrets, sast, deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Build image
        run: docker build -t regengine:ci -f Dockerfile .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          image-ref: "regengine:ci"
          format: "json"
          output: "trivy.json"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: trivy
          path: trivy.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # 8. Audit Chain Integrity (ISO 27001 12.7.1)
  # ──────────────────────────────────────────────
  audit-integrity:
    name: Audit Chain Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Validate audit chain secrets
        id: validate_audit
        env:
          AUDIT_API_BASE: ${{ secrets.AUDIT_API_BASE }}
          AUDIT_TOKEN: ${{ secrets.AUDIT_VERIFY_TOKEN }}
        run: |
          if [ -z "$AUDIT_API_BASE" ] || [ -z "$AUDIT_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping audit chain check (missing AUDIT_API_BASE or AUDIT_VERIFY_TOKEN)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run audit chain check
        if: steps.validate_audit.outputs.ready == 'true'
        env:
          AUDIT_API_BASE: ${{ secrets.AUDIT_API_BASE }}
          AUDIT_TOKEN: ${{ secrets.AUDIT_VERIFY_TOKEN }}
        run: |
          chmod +x scripts/security/verify_audit_chain.sh
          bash scripts/security/verify_audit_chain.sh

      - name: Audit chain check skipped
        if: steps.validate_audit.outputs.ready != 'true'
        run: |
          echo "Audit chain check skipped due to missing secrets"
