name: Copy gate

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/copy-lint/**'
      - '.github/workflows/copy-gate.yml'
      - 'scripts/copy-lint/baseline.json'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/copy-lint/**'
      - '.github/workflows/copy-gate.yml'
      - 'scripts/copy-lint/baseline.json'

permissions:
  contents: read

jobs:
  gate:
    name: Copy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '20'
      - run: node --test scripts/copy-lint/check-copy.test.mjs
      - run: node scripts/copy-lint/check-copy.mjs . --gate --github
