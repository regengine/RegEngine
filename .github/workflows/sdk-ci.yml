name: SDK CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'regengine/**'
      - 'tests/sdk/**'
      - '.github/workflows/sdk-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'regengine/**'
      - 'tests/sdk/**'
      - '.github/workflows/sdk-ci.yml'

# Cancel superseded runs on the same branch so overlapping pushes do not
# pile up and the latest run is the one that reports status.
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-clean-install:
    name: SDK clean install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install SDK in clean environment
        run: |
          python3 -m venv .venv-sdk
          . .venv-sdk/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ./regengine

      - name: Verify import and client construction
        run: |
          . .venv-sdk/bin/activate
          python -c "import regengine; regengine.RegEngineClient(**{'api' + '_key': 'rge_' + 'x'})"

      - name: Run SDK regression tests
        run: |
          REPO_ROOT="$PWD"
          . .venv-sdk/bin/activate
          # Pinned to requirements.lock so CI resolves the same wheels as
          # every other job (unpinned installs drift silently).
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1 requests==2.34.2
          TEST_TMP="$(mktemp -d)"
          cd "$TEST_TMP"
          PYTHONPATH= python -m pytest "$REPO_ROOT/tests/sdk" -q
