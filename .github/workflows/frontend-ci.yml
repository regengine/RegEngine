name: Frontend CI/CD

on:
  # Nightly run against main, mirroring backend-ci: the path-filtered
  # triggers below leave these gates unexercised during stretches of
  # backend-only merges, letting drift (promise-audit URL rot, e2e flake)
  # accumulate silently until an unrelated frontend-touching PR pays for it.
  # Offset from backend-ci's 05:00 to spread runner load.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'sales/**'
      - 'sales_enablement/**'
      - 'frontend/public/**'
      - 'services/admin/app/auth/**'
      - 'services/admin/app/e2e_safety.py'
      - 'services/admin/app/session_store.py'
      - 'services/admin/app/rate_limit_service.py'
      - 'services/admin/app/sqlalchemy_models.py'
      - 'services/admin/tests/test_e2e_safety.py'
      - 'services/admin/tests/test_webauthn_router.py'
      - 'scripts/seed_passwordless_e2e_user.py'
      - 'scripts/generate_openapi.py'
      - 'scripts/start-e2e-backend.sh'
      - 'requirements.in'
      - 'requirements.lock'
      - 'scripts/check_trust_safety_copy.py'
      - 'scripts/trust_safety_copy_allowlist.txt'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'sales/**'
      - 'sales_enablement/**'
      - 'frontend/public/**'
      - 'services/admin/app/auth/**'
      - 'services/admin/app/e2e_safety.py'
      - 'services/admin/app/session_store.py'
      - 'services/admin/app/rate_limit_service.py'
      - 'services/admin/app/sqlalchemy_models.py'
      - 'services/admin/tests/test_e2e_safety.py'
      - 'services/admin/tests/test_webauthn_router.py'
      - 'scripts/seed_passwordless_e2e_user.py'
      - 'scripts/generate_openapi.py'
      - 'scripts/start-e2e-backend.sh'
      - 'requirements.in'
      - 'requirements.lock'
      - 'scripts/check_trust_safety_copy.py'
      - 'scripts/trust_safety_copy_allowlist.txt'
      - '.github/workflows/frontend-ci.yml'

# Cancel in-progress runs for the same branch/PR
# Scheduled runs get their own concurrency group: the nightly must never
# cancel an in-flight push-to-main run (deploy.yml gates on that run's
# status check — a cancelled run would leave the deploy gated forever).
concurrency:
  group: frontend-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  promise-audit:
    name: Promise Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run promise audit
        run: |
          cd frontend
          npm run promise:audit

      - name: Check API host strings
        run: python3 scripts/check_api_host_strings.py

  # ── Build ────────────────────────────────────────────────
  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          NEXT_PUBLIC_API_BASE_URL: https://regengine.co
          INGESTION_SERVICE_URL: http://localhost:8002
          COMPLIANCE_SERVICE_URL: http://localhost:8003
          ADMIN_SERVICE_URL: http://localhost:8001
        run: |
          cd frontend
          npm run build

      - name: Bundle size report
        run: |
          cd frontend
          echo "### 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh .next >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh .next/static/chunks/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Lint ─────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        env:
          NEXT_PUBLIC_API_BASE_URL: https://regengine.co
          INGESTION_SERVICE_URL: http://localhost:8002
          COMPLIANCE_SERVICE_URL: http://localhost:8003
          ADMIN_SERVICE_URL: http://localhost:8001
        run: |
          cd frontend
          npm run lint

      - name: Ban trust-and-safety outcome-promise copy
        run: python3 scripts/check_trust_safety_copy.py

  # ── Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        run: |
          cd frontend
          npm run test:run

  # ── Deterministic Smoke ───────────────────────────────────
  smoke:
    name: Deterministic Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run deterministic smoke slice
        run: |
          cd frontend
          npm run test:run -- \
            src/__tests__/lib/app-routes.test.ts \
            src/__tests__/api/proxy-sanitization.test.ts \
            src/__tests__/api/admin.test.ts

  # ── Security ─────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

  production-readiness:
    name: Production Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run production readiness gate
        run: |
          cd frontend
          npm run readiness:production

  # ── CI Summary ───────────────────────────────────────────
  ci-status:
    # Distinct from the backend gate ("Backend CI Status Gate"): a deploy
    # ships the backend image, so deploy.yml waits on the backend gate
    # specifically. Sharing one "CI Status Gate" name let a frontend-only SHA
    # satisfy the deploy gate without the backend ever being verified (#2537).
    name: Frontend CI Status Gate
    if: always()
    needs: [promise-audit, build, lint, test, smoke, security, production-readiness, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "Promise:  ${{ needs.promise-audit.result }}"
          echo "Build:    ${{ needs.build.result }}"
          echo "Lint:     ${{ needs.lint.result }}"
          echo "Tests:    ${{ needs.test.result }}"
          echo "Smoke:    ${{ needs.smoke.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Readiness:${{ needs.production-readiness.result }}"
          echo "E2E:      ${{ needs.e2e.result }}"
          # Require an explicit "success" from every needed job. The previous
          # ``== "failure"`` checks let a ``skipped`` or ``cancelled`` job (a
          # routine outcome under ``cancel-in-progress``) report the gate green
          # without that check ever passing. Mirrors backend-ci.yml's stricter
          # ``!= "success"`` contract (#2537).
          if [[ "${{ needs.promise-audit.result }}" != "success" \
             || "${{ needs.build.result }}" != "success" \
             || "${{ needs.lint.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" \
             || "${{ needs.smoke.result }}" != "success" \
             || "${{ needs.security.result }}" != "success" \
             || "${{ needs.production-readiness.result }}" != "success" \
             || "${{ needs.e2e.result }}" != "success" ]]; then
            echo "::error::One or more required frontend checks failed, were cancelled, or were skipped"
            exit 1
          fi
          echo "All blocking frontend checks passed"

  # ── E2E Tests (Playwright) ───────────────────────────────
  e2e:
    name: Passwordless Auth E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGENGINE_ENV: test
      REGENGINE_E2E_MODE: "true"
      REGENGINE_E2E_EMAIL_OUTBOX: /tmp/regengine-playwright-email-outbox.jsonl
      AUTH_SECRET_KEY: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
      JWT_SIGNING_KEY: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
      AUTH_OTP_HMAC_SECRET: playwright-local-otp-hmac-secret-2026-minimum-32-bytes # pragma: allowlist secret
      CSRF_SECRET: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
      ADMIN_MASTER_KEY: playwright-local-admin-master-key-2026
      API_KEY: playwright-local-regengine-api-key-2026 # pragma: allowlist secret
      REGENGINE_API_KEY: playwright-local-regengine-api-key-2026 # pragma: allowlist secret
      ALLOW_INMEMORY_SESSION_STORE: "true"
      DISABLE_TASK_WORKER: "true"
      NEXT_PUBLIC_ENABLE_EXPERIMENTAL_FEATURES: "true"
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          # Install requirements.lock on the same interpreter it is compiled
          # and freshness-gated under (3.11, matching Dockerfile and backend-ci
          # PYTHON_VERSION). Was 3.12 — a --require-hashes install of the
          # 3.11-resolved lock on 3.12 reintroduces the interpreter split (#2527).
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r requirements.lock

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: run_e2e
        run: |
          cd frontend
          npm run test:e2e -- tests/e2e/auth-flow.spec.ts --project=chromium --reporter=list

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14
