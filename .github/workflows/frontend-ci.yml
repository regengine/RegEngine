name: Frontend CI/CD

on:
  # Nightly run against main, mirroring backend-ci: the path-filtered
  # triggers below leave these gates unexercised during stretches of
  # backend-only merges, letting drift (promise-audit URL rot, e2e flake)
  # accumulate silently until an unrelated frontend-touching PR pays for it.
  # Offset from backend-ci's 05:00 to spread runner load.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'sales/**'
      - 'sales_enablement/**'
      - 'frontend/public/**'
      - 'services/admin/app/auth/**'
      - 'services/admin/app/e2e_safety.py'
      - 'services/admin/app/session_store.py'
      - 'services/admin/app/rate_limit_service.py'
      - 'services/admin/app/sqlalchemy_models.py'
      - 'services/admin/tests/test_e2e_safety.py'
      - 'services/admin/tests/test_webauthn_router.py'
      - 'scripts/seed_passwordless_e2e_user.py'
      - 'scripts/generate_openapi.py'
      - 'scripts/start-e2e-backend.sh'
      - 'requirements.in'
      - 'requirements.lock'
      - 'scripts/check_trust_safety_copy.py'
      - 'scripts/trust_safety_copy_allowlist.txt'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'sales/**'
      - 'sales_enablement/**'
      - 'frontend/public/**'
      - 'services/admin/app/auth/**'
      - 'services/admin/app/e2e_safety.py'
      - 'services/admin/app/session_store.py'
      - 'services/admin/app/rate_limit_service.py'
      - 'services/admin/app/sqlalchemy_models.py'
      - 'services/admin/tests/test_e2e_safety.py'
      - 'services/admin/tests/test_webauthn_router.py'
      - 'scripts/seed_passwordless_e2e_user.py'
      - 'scripts/generate_openapi.py'
      - 'scripts/start-e2e-backend.sh'
      - 'requirements.in'
      - 'requirements.lock'
      - 'scripts/check_trust_safety_copy.py'
      - 'scripts/trust_safety_copy_allowlist.txt'
      - '.github/workflows/frontend-ci.yml'

# Supersede older PR runs only. Give push, schedule, and manual runs distinct
# groups so main checks finish even when another run starts.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Issue #2875: no job in this workflow uses the GITHUB_TOKEN — no gh CLI, no
# github-script, no check-run or PR-comment action — so checks:write and
# pull-requests:write were unused write scope on every run.
permissions:
  contents: read

jobs:
  promise-audit:
    name: Promise Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run promise audit
        run: |
          cd frontend
          npm run promise:audit

      - name: Check API host strings
        run: python3 scripts/check_api_host_strings.py

  # ── Build ────────────────────────────────────────────────
  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          NEXT_PUBLIC_API_BASE_URL: https://regengine.co
          INGESTION_SERVICE_URL: http://localhost:8002
          COMPLIANCE_SERVICE_URL: http://localhost:8003
          ADMIN_SERVICE_URL: http://localhost:8001
        run: |
          cd frontend
          npm run build

      - name: Bundle size report
        run: |
          cd frontend
          {
            echo "### 📦 Bundle Size Report"
            echo '```'
            du -sh .next
            echo ""
            du -sh .next/static/chunks/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Lint ─────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        env:
          NEXT_PUBLIC_API_BASE_URL: https://regengine.co
          INGESTION_SERVICE_URL: http://localhost:8002
          COMPLIANCE_SERVICE_URL: http://localhost:8003
          ADMIN_SERVICE_URL: http://localhost:8001
        run: |
          cd frontend
          npm run lint

      - name: Ban trust-and-safety outcome-promise copy
        run: python3 scripts/check_trust_safety_copy.py

  # ── Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest (with coverage thresholds enforced)
        # Issue #2845: frontend/vitest.config.mts declares 20% coverage
        # thresholds, but no workflow ever passed --coverage, so they were
        # never enforced. test:coverage == `vitest run --coverage`, which
        # fails the run when a threshold is not met.
        run: |
          cd frontend
          npm run test:coverage

  # ── Deterministic Smoke ───────────────────────────────────
  smoke:
    name: Deterministic Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run deterministic smoke slice
        run: |
          cd frontend
          npm run test:run -- \
            src/__tests__/lib/app-routes.test.ts \
            src/__tests__/api/proxy-sanitization.test.ts \
            src/__tests__/api/admin.test.ts

  # ── Security ─────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      - name: Verify blocking Playwright security gate
        run: |
          cd frontend
          npm run security-gate:audit

  production-readiness:
    name: Production Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run production readiness gate
        run: |
          cd frontend
          npm run readiness:production

  # ── CI Summary ───────────────────────────────────────────
  ci-status:
    # Distinct from the backend gate ("Backend CI Status Gate"): a deploy
    # ships the backend image, so deploy.yml waits on the backend gate
    # specifically. Sharing one "CI Status Gate" name let a frontend-only SHA
    # satisfy the deploy gate without the backend ever being verified (#2537).
    name: Frontend CI Status Gate
    # Run when a needed job failed so this gate still posts failure (#2537:
    # cancelled or skipped dependencies must not look green). Skip only when
    # the workflow itself was cancelled by a newer push. In that case the
    # replacement run owns the gate; this run must not fail the SHA for
    # jobs that were aborted mid-flight. `!cancelled()` does not relax the
    # script below: every dependency still has to be success.
    if: always() && !cancelled()
    needs: [promise-audit, build, lint, test, smoke, security, production-readiness, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check results
        run: |
          echo "Promise:  ${{ needs.promise-audit.result }}"
          echo "Build:    ${{ needs.build.result }}"
          echo "Lint:     ${{ needs.lint.result }}"
          echo "Tests:    ${{ needs.test.result }}"
          echo "Smoke:    ${{ needs.smoke.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Readiness:${{ needs.production-readiness.result }}"
          echo "E2E:      ${{ needs.e2e.result }}"
          # Require an explicit "success" from every needed job. The previous
          # ``== "failure"`` checks let a ``skipped`` or ``cancelled`` job (a
          # routine outcome under ``cancel-in-progress``) report the gate green
          # without that check ever passing. Mirrors backend-ci.yml's stricter
          # ``!= "success"`` contract (#2537).
          if [[ "${{ needs.promise-audit.result }}" != "success" \
             || "${{ needs.build.result }}" != "success" \
             || "${{ needs.lint.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" \
             || "${{ needs.smoke.result }}" != "success" \
             || "${{ needs.security.result }}" != "success" \
             || "${{ needs.production-readiness.result }}" != "success" \
             || "${{ needs.e2e.result }}" != "success" ]]; then
            echo "::error::One or more required frontend checks failed, were cancelled, or were skipped"
            exit 1
          fi
          echo "All blocking frontend checks passed"

  # ── E2E Tests (Playwright) ───────────────────────────────
  e2e:
    name: Passwordless Auth E2E (Chromium)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playwright_shared
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/playwright_shared # pragma: allowlist secret
      # Admin API-key store requires NOSUPERUSER/NOBYPASSRLS regengine_sysadmin
      # (provisioned by scripts/setup_e2e_postgres.py). Fake CI-only password.
      ADMIN_DATABASE_URL: postgresql://regengine_sysadmin:ci-e2e-only-sysadmin-not-a-real-secret@localhost:5432/playwright_shared # pragma: allowlist secret — CI-only fake password for E2E NOSUPERUSER role
      PGOPTIONS: "-c timezone=UTC -c search_path=public,fsma,extensions"
      REGENGINE_ENV: test
      REGENGINE_E2E_MODE: "true"
      # Raise product-mutation slowapi budget for authenticated-core-journeys
      # (55 creates). Production default stays 30/minute when this is unset.
      REGENGINE_E2E_RELAX_PRODUCT_MUTATION_LIMIT: "true"
      REGENGINE_E2E_EMAIL_OUTBOX: /tmp/regengine-playwright-email-outbox.jsonl
      AUTH_SECRET_KEY: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
      JWT_SIGNING_KEY: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
      AUTH_OTP_HMAC_SECRET: playwright-local-otp-hmac-secret-2026-minimum-32-bytes # pragma: allowlist secret
      AUDIT_INTEGRITY_KEY: playwright-local-audit-integrity-key-2026-minimum-32-bytes # pragma: allowlist secret
      CSRF_SECRET: playwright-local-jwt-signing-key-2026 # pragma: allowlist secret
      ALLOW_INMEMORY_SESSION_STORE: "true"
      DISABLE_TASK_WORKER: "true"
      NEXT_PUBLIC_ENABLE_EXPERIMENTAL_FEATURES: "true"
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          # authenticated-core-journeys uses the built-in node:sqlite module.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Install requirements.lock on the same interpreter it is compiled
          # and freshness-gated under (3.11, matching Dockerfile and backend-ci
          # PYTHON_VERSION). Was 3.12 — a --require-hashes install of the
          # 3.11-resolved lock on 3.12 reintroduces the interpreter split (#2527).
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r requirements.lock

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # Split from a single `npx playwright install --with-deps chromium`.
      # On 2026-08-19 that one step stalled twice in a row for 28+ minutes
      # (runs 32231852566 attempts 1 and 2) until the job's 30m bound killed
      # it — with no way to tell whether the apt half (--with-deps) or the
      # browser-download half was hanging, because both live in one opaque
      # step. Healthy runtime for the whole thing is ~25s. The split makes
      # the next stall name its culprit, the cache removes the download for
      # every run after one green pass at a given Playwright version, and
      # the bounded retry converts a stalled download from a 30m job loss
      # into a killed-and-reattempted connection.
      - name: Resolve Playwright version for cache key
        id: pw-version
        run: |
          cd frontend
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright system deps (apt, best-effort)
        timeout-minutes: 6
        run: |
          cd frontend
          # Run 32235477691 proved the apt half is what stalls (6m12s to the
          # bound; the CDN download never ran) — mirror flakiness, not code.
          # ubuntu-latest images ship browsers and their shared libraries, so
          # a stalled install-deps degrades to a LOUD warning instead of a
          # job loss: if a library truly is missing, the browser launch in
          # "Run E2E tests" fails with an explicit error naming the .so.
          for attempt in 1 2; do
            if timeout 150 npx playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::install-deps attempt ${attempt} failed or stalled past 150s"
          done
          echo "::warning::proceeding without install-deps; relying on the runner image's preinstalled browser libraries"

      - name: Install Playwright Chromium (bounded, retried)
        timeout-minutes: 14
        run: |
          cd frontend
          # `npx playwright install` no-ops in seconds on a cache hit. On a
          # miss, a stalled CDN connection gets killed at 6m and retried
          # once on a fresh connection rather than eating the job bound.
          for attempt in 1 2; do
            if timeout 6m npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install chromium attempt ${attempt} failed or stalled past 6m"
          done
          exit 1

      - name: Prepare isolated PostgreSQL E2E fixture
        run: python scripts/setup_e2e_postgres.py

      - name: Run E2E tests
        id: run_e2e
        run: |
          cd frontend
          # Passwordless OTP specs against the same local stack as auth-flow
          # (#2878). rbac-gates / tenant-isolation / security-audit-fixes /
          # invite_flow still drive the removed password login UI and would
          # fail this gate; inflow-lab / sandbox / snapshot
          # specs need extra services or demo data.
          npm run test:e2e -- \
            tests/e2e/auth-flow.spec.ts \
            tests/e2e/security-release-gate.spec.ts \
            tests/e2e/login-dashboard.spec.ts \
            tests/e2e/authenticated-core-journeys.spec.ts \
            --project=chromium --reporter=list

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14
