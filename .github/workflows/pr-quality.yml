name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ── PR Size Check ───────────────────────────────────────
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.pull_request.number }} --json additions --jq '.additions')
          DELETIONS=$(gh pr view ${{ github.event.pull_request.number }} --json deletions --jq '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))
          FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files | length')

          echo "### 📊 PR Size" >> $GITHUB_STEP_SUMMARY
          echo "- **Lines changed:** +$ADDITIONS / -$DELETIONS ($TOTAL total)" >> $GITHUB_STEP_SUMMARY
          echo "- **Files changed:** $FILES" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -gt 1000 ]; then
            echo "::warning::Large PR detected ($TOTAL lines). Consider splitting into smaller PRs."
            echo "- ⚠️ **Large PR** — consider splitting" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Size is manageable" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Conventional Commits ────────────────────────────────
  commit-lint:
    name: Commit Message Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "### 📝 Commit Messages" >> $GITHUB_STEP_SUMMARY
          # --no-merges: merge commits ("Merge branch 'main' into …") are not
          # conventional-commit shaped, and a branch-updated PR must not fail
          # this gate because of them.
          COMMITS=$(git log --no-merges --format="%s" origin/main..HEAD)
          VALID=true
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:"; then
              echo "- ✅ \`$msg\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ \`$msg\` — not conventional" >> $GITHUB_STEP_SUMMARY
              VALID=false
            fi
          done <<< "$COMMITS"

          if [ "$VALID" = false ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> 💡 Use [Conventional Commits](https://www.conventionalcommits.org/) format: \`type(scope): description\`" >> $GITHUB_STEP_SUMMARY
            # CONTRIBUTING.md:47 states conventional commits are required. This
            # step previously computed VALID and discarded it, so the check
            # could never fail despite continue-on-error: false.
            echo "::error::One or more commit messages are not Conventional Commits (see CONTRIBUTING.md)."
            exit 1
          fi
        continue-on-error: false

  # ── Copy Lint: Ban A-F Grade / Verdict UIs in /tools ────
  copy-lint-tools-grade-verdicts:
    name: Copy Lint — ban A-F grade/verdict UIs in /tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Grep for banned grade/verdict copy in frontend/src/app/tools
        run: |
          set -o pipefail
          SCOPE="frontend/src/app/tools"
          if [ ! -d "$SCOPE" ]; then
            echo "Scope directory $SCOPE missing; skipping."
            exit 0
          fi
          PATTERN='Compliance Score|Compliance Grade|Get Your.*Compliance Report|Grade your ability'
          echo "### 🚫 Banned grade/verdict copy in $SCOPE" >> "$GITHUB_STEP_SUMMARY"
          HITS=$(grep -rnE "$PATTERN" "$SCOPE" --include='*.tsx' --include='*.ts' || true)
          if [ -n "$HITS" ]; then
            echo "Banned phrases found in $SCOPE:"
            echo "$HITS"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$HITS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Self-check tools must not present A-F grades or pass/fail verdicts. See issue #2314." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ No banned grade/verdict phrases found" >> "$GITHUB_STEP_SUMMARY"

  # ── Label PR ────────────────────────────────────────────
  label:
    name: Auto-Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Label by files changed
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
