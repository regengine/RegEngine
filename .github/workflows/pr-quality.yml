name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ── PR Size Check ───────────────────────────────────────
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.pull_request.number }} --json additions --jq '.additions')
          DELETIONS=$(gh pr view ${{ github.event.pull_request.number }} --json deletions --jq '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))
          FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files | length')

          echo "### 📊 PR Size" >> $GITHUB_STEP_SUMMARY
          echo "- **Lines changed:** +$ADDITIONS / -$DELETIONS ($TOTAL total)" >> $GITHUB_STEP_SUMMARY
          echo "- **Files changed:** $FILES" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -gt 1000 ]; then
            echo "::warning::Large PR detected ($TOTAL lines). Consider splitting into smaller PRs."
            echo "- ⚠️ **Large PR** — consider splitting" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Size is manageable" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Conventional Commits ────────────────────────────────
  commit-lint:
    name: Commit Message Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "### 📝 Commit Messages" >> $GITHUB_STEP_SUMMARY
          COMMITS=$(git log --format="%s" origin/main..HEAD)
          VALID=true
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:"; then
              echo "- ✅ \`$msg\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ \`$msg\` — not conventional" >> $GITHUB_STEP_SUMMARY
              VALID=false
            fi
          done <<< "$COMMITS"

          if [ "$VALID" = false ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> 💡 Use [Conventional Commits](https://www.conventionalcommits.org/) format: \`type(scope): description\`" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: false

  # ── Trust-and-Safety Copy Gate ──────────────────────────
  # Bans outcome-promise phrases (FDA-ready, FDA-compliant, 100% FDA compliance,
  # FDA-certified) repo-wide on every PR — not just when frontend paths change —
  # so drift cannot return via marketing copy, docs, or component changes that
  # bypass the frontend-ci path filter. See issue #2313 and PR #2305 for
  # canonical replacements (e.g. "§1.1455(c)-formatted",
  # "supports your FSMA 204 program", "production compliance records").
  trust-safety-copy:
    name: Trust & Safety Copy Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Ban FDA outcome-promise phrases
        run: |
          # Site-wide grep gate (frontend/src). Allowlists the negative-assertion
          # test that pins these phrases as absent from UI copy.
          # See PR #2305 for canonical replacements.
          if grep -rEn -i "FDA-ready|FDA-compliant|100%[[:space:]]+FDA[[:space:]]+compliance|FDA[ -]?certified" \
              frontend/src \
              --include="*.ts" --include="*.tsx" --include="*.md" --include="*.mdx" \
              | grep -v "__tests__/components/sandbox-diagnosis.test.ts"; then
            echo ""
            echo "::error::Banned trust-and-safety outcome-promise phrase detected."
            echo "Operators are responsible for compliance; RegEngine output does not"
            echo "satisfy regulator inspection on its own. See PR #2305 for canonical"
            echo "replacements (e.g. '§1.1455(c)-formatted', 'supports your FSMA 204"
            echo "program', 'production compliance records')."
            exit 1
          fi
          echo "Trust-and-safety copy gate passed."

      - name: Run check_trust_safety_copy.py (frontend/src deep scan)
        run: python3 scripts/check_trust_safety_copy.py

  # ── Label PR ────────────────────────────────────────────
  label:
    name: Auto-Label PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Label by files changed
        uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213  # v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
