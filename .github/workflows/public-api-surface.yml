name: Public API Surface Probe

# Outside-in check that the documented public API surface actually answers
# from the internet the way the docs promise. Probes production; runs on a
# schedule (not as a PR gate) because it tests the deployed site, not the PR.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *' # Nightly 06:30 UTC

permissions:
  contents: read

concurrency:
  group: public-api-surface
  cancel-in-progress: true

jobs:
  probe:
    name: Probe public API surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'

      - name: Probe documented public endpoints from outside
        run: node scripts/check_public_api_surface.mjs
