name: Supply Chain Gate

# Pattern 6 (unpinned supply chain): every third-party artifact that enters
# the build must be pinned to an exact version or digest and verified.
# The gate script scans workflows, Dockerfiles, infra manifests and scripts;
# actionlint keeps the workflow files themselves valid.
#
# "Pinned supply chain" is a required context (see workflow_inventory.txt and
# docs/runbooks/BRANCH_PROTECTION.md), so the `pull_request:` trigger below is
# deliberately UNFILTERED — required contexts MUST be able to post on every PR,
# otherwise PRs that miss a path filter are structurally unmergeable.
#
# The `push:` trigger keeps its filter: main-branch runs are not gating merges.
on:
  pull_request:
    paths:
      - 'requirements*'
      - '**/requirements*'
      - '**/package*.json'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/poetry.lock'
      - '**/Pipfile.lock'
      - 'Dockerfile*'
      - '**/Dockerfile*'
      - '**/*.Dockerfile'
      - '**/compose*.yml'
      - '**/compose*.yaml'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
      # The pinning script also inspects shell installs and infra images.
      - '**/*.sh'
      - 'infra/**'
      - 'scripts/ci/check_supply_chain.py'
      - 'scripts/ci/supply_chain_baseline.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'scripts/**'
      - 'infra/**'
      - 'requirements.in'
      - 'requirements.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

concurrency:
  group: supply-chain-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pinned-supply-chain:
    name: Pinned supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Supply-chain pinning gate
        run: |
          python3 scripts/ci/check_supply_chain.py --root .

      - name: Install actionlint
        run: |
          # Exact version, not a floating tag. Go module downloads are
          # verified against the checksum database, so this is both
          # pinned and verified. The version is inline so the pinning
          # gate can see it; do not move it back into an env var.
          go install "github.com/rhysd/actionlint/cmd/actionlint@v1.7.12"
          "$(go env GOPATH)/bin/actionlint" --version

      - name: Lint workflows with actionlint
        run: |
          # The ignored shellcheck codes are pre-existing info and style
          # suggestions across older workflows (unquoted variables, redirect
          # style). They are recorded here so the gate stays green while
          # still failing on any new syntax error or any other finding.
          "$(go env GOPATH)/bin/actionlint" \
            -ignore '(SC1007|SC2086|SC2126|SC2129)' \
            .github/workflows/*.yml
