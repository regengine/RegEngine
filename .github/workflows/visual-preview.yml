# Report-only visual regression + page monitoring for Vercel Preview deploys.
#
# Non-required, never blocks merges (continue-on-error). GET-only page visits
# plus blank-submit validation screenshots (VISUAL_ALLOW_FORM_SUBMIT=1: clicks
# submit on EMPTY login/signup forms, fills nothing, creates nothing).
#
# NOTE — Vercel protection bypass: if preview deploys sit behind Vercel
# Deployment Protection (SSO/password), these checks will screenshot the
# auth wall instead of the app. The config sends an
# x-vercel-protection-bypass header ONLY when the
# VERCEL_AUTOMATION_BYPASS_SECRET env var is set at runtime. This workflow
# deliberately does NOT set it and references NO secret; wiring one up is
# an optional follow-up for Christopher to approve — see
# frontend/tests/visual/README.md ("Vercel protection").
name: Visual Preview Report

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Preview URL to check (e.g. https://regengine-git-branch.vercel.app)
        required: false
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  visual-report:
    name: visual-report (non-required)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment != 'Production')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run visual suite
        env:
          VISUAL_BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          VISUAL_ALLOW_FORM_SUBMIT: '1'
        run: npx playwright test --config=playwright.visual.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: visual-report-preview
          path: |
            frontend/playwright-visual-report
            frontend/test-results-visual
