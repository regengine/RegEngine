name: Legacy Code Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "kernel/**"
      - "services/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/agents/**"
      - ".github/workflows/agent-sweep.yml"
      - ".github/workflows/legacy-code-scan.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "kernel/**"
      - "services/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/agents/**"
      - ".github/workflows/agent-sweep.yml"
      - ".github/workflows/legacy-code-scan.yml"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

concurrency:
  group: legacy-code-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  legacy-patterns:
    name: Legacy Pattern Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate supported agent helper specs
        run: python3 scripts/summon_agent.py --list

      - name: Block known legacy files, imports, and scheduled agent sweeps
        run: python3 scripts/check_legacy_dead_code.py

  frontend-unused-files:
    name: Frontend Unused File Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate Knip report
        run: |
          cd frontend
          npx --yes knip@6.7.0 --reporter json > ../knip-report.json || true

      - name: Fail on whole unused frontend files
        run: python3 scripts/check_legacy_dead_code.py --skip-patterns --knip-json knip-report.json
