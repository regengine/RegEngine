name: Test Suite Health Check

on:
  pull_request:
    paths:
      - 'services/**'
      - 'shared/**'
      - 'kernel/**'
      - 'tests/**'
      # regengine/** so a strictly SDK-only PR still runs the route-contract
      # test with the backend dependency tree present (#2952); sdk-ci's clean
      # venv importorskips it.
      - 'regengine/**'
      - 'pyproject.toml'
      - 'requirements.in'
      - 'requirements.lock'
      - '.github/workflows/test-suite-check.yml'
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'kernel/**'
      - 'tests/**'
      - 'regengine/**'
      - 'pyproject.toml'
      - 'requirements.in'
      - 'requirements.lock'
      - '.github/workflows/test-suite-check.yml'

concurrency:
  group: test-suite-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # ── Full-suite collection guard (#1435) ─────────────────
  # Runs ``pytest --collect-only`` across the whole repo. Any collection
  # ERROR fails the build — this is the single check that prevents another
  # round of "9 test files silently fail to import". The root conftest.py
  # handles the multi-service ``app/`` path switching; per-service
  # pythonpath entries are no longer required.
  full-suite-collection:
    name: Full suite collects without errors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          # Install the full runtime requirements so test modules that
          # import real libraries (httpx, fastapi, sqlalchemy, pydantic[email],
          # etc.) can be collected. Without this step, collection
          # breaks on the first third-party import.
          # --require-hashes enforces the pip-compile lockfile (#1139).
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          fi

      - name: Collect whole suite and fail on any error
        run: |
          # --continue-on-collection-errors: pytest otherwise aborts at the
          # first ERROR and the summary line is never printed.
          # Clear inherited -q; exactly one -q emits nodeids and the summary.
          set +e
          # ``-q`` is passed EXPLICITLY, not inherited from pyproject addopts.
          # The root-representation grep below is path-anchored ("^tests/"),
          # which only holds while collection prints nodeids; stock pytest
          # --collect-only prints an indented <Module> tree with no anchored
          # lines, and every root would then read as missing and fail the job
          # on every run. Flagged by review on #2990 — refuted today only
          # because addopts happens to carry -q, so pin it here instead of
          # depending on that.
          OUTPUT=$(python3 -m pytest -o addopts= --import-mode=importlib --asyncio-mode=auto --collect-only -q --continue-on-collection-errors 2>&1)
          STATUS=$?
          set -e
          echo "--- pytest output (tail) ---"
          echo "$OUTPUT" | tail -30
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::pytest collection failed (exit $STATUS)"
            exit "$STATUS"
          fi
          SUMMARY=$(echo "$OUTPUT" | grep -E '[0-9]+ tests? collected' | tail -1)
          COUNT=$(echo "$SUMMARY" | grep -oE '[0-9]+ tests? collected' | grep -oE '[0-9]+' || echo "0")
          ERRORS=$(echo "$SUMMARY" | grep -oE '[0-9]+ errors?' | grep -oE '[0-9]+' || echo "0")
          echo ""
          echo "Collected $COUNT tests ($ERRORS collection errors)"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS test files failed to collect. Fix the imports — see ERROR lines above. Re-run locally with:  python3 -m pytest --collect-only"
            echo "--- ERROR list ---"
            echo "$OUTPUT" | grep "^ERROR " || true
            exit 1
          fi
          # Issue #2843: the floor was 1500 while the suite actually collects
          # ~9349, so the gate could not detect an entire directory dropping
          # out. The floor leaves ~10% headroom below the current count.
          # RE-RATCHET THIS as the suite grows — a floor left far below the
          # real count is the same silent no-op this replaced.
          # Issue #2923: adding services/shared/tests to pyproject testpaths
          # brought 588 previously-invisible tests into this collection
          # (9463 -> 10051 measured locally), so the floor moves with it.
          COLLECTION_FLOOR=9000
          if [ "$COUNT" -lt "$COLLECTION_FLOOR" ]; then
            echo "::error::Collected tests fell below floor of $COLLECTION_FLOOR (got $COUNT). Did a whole directory get skipped?"
            exit 1
          fi

          # A single global floor cannot detect one directory dropping out:
          # services/shared/tests is 580 of the 10081 tests, so losing all of
          # it lands at 9501 — still above any floor with usable headroom.
          # That is exactly the blind spot #2923 was filed about, so assert
          # directory *representation* directly instead of inferring it from a
          # total. Add a root here whenever ``testpaths`` gains one.
          MISSING_ROOTS=""
          for root in tests regengine/tests services/admin/tests \
                      services/compliance/tests services/graph/tests \
                      services/ingestion/tests services/nlp/tests \
                      services/scheduler/tests services/shared/tests; do
            if ! echo "$OUTPUT" | grep -q "^${root}/"; then
              MISSING_ROOTS="$MISSING_ROOTS $root"
            fi
          done
          if [ -n "$MISSING_ROOTS" ]; then
            echo "::error::Collection produced no tests from:$MISSING_ROOTS. A whole directory dropped out of pyproject testpaths."
            exit 1
          fi
          echo "✓ $COUNT tests collected, 0 collection errors, all testpaths roots represented"

  # ── Repo-root execution shard ─────────────────────────────
  # Collection-only checks prove importability, but they do not catch broken
  # assertions. Run the offline repo-root slice so this workflow has a
  # behavioral gate outside the per-service ``tests/`` directories (#2823).
  # Live Postgres/Redis/Neo4j suites stay in backend-ci ``repo-root-suite``
  # and ``live-db-suite`` — this job has no service containers.
  repo-root-fast-shard:
    name: Repo-root fast shard executes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          fi

      - name: Run offline repo-root tests
        run: |
          python3 -m pytest \
            tests/sdk \
            tests/swarm \
            tests/scripts \
            tests/test_monolith_route_parity.py \
            tests/test_server_import_smoke.py \
            tests/shared \
            tests/unit \
            tests/invariants \
            tests/test_shared \
            tests/security \
            --ignore-glob='tests/shared/test_*_live.py' \
            --ignore-glob='tests/invariants/test_*_live.py' \
            --ignore=tests/invariants/test_dual_write_parity.py \
            --ignore=tests/invariants/test_fda_export_v1_golden.py \
            --ignore=tests/invariants/test_chain_verify_golden.py \
            --ignore=tests/invariants/test_backfill_canonical.py \
            --ignore=tests/security/test_tenant_isolation_phase1.py \
            --ignore=tests/security/test_account_erasure_identity_isolation_pg.py \
            --ignore=tests/security/test_security_audit_fixes.py \
            --ignore=tests/security/test_auth_coverage.py \
            --ignore=tests/shared/test_visibility_timeout_2918.py \
            --ignore=tests/shared/test_secret_validation.py \
            -q --no-cov

  # ── Per-service collection checks ───────────────────────
  test-environment-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # #2923: `shared` was absent, leaving services/shared/tests out of the
        # per-service collection check as well as the repo-root one.
        service: [admin, compliance, graph, ingestion, nlp, scheduler, shared]

    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'



      - name: Install Dependencies
        run: |
          # Install from the root requirements.lock — the single source of
          # truth for runtime deps (pip-compile output; see #1139).
          # Per-service requirements.txt files are DEPRECATED stubs (#1429)
          # and will be removed when docker-compose is retired.
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          fi

      - name: Setup Shared Module Bridge
        run: |
          # The graph service Dockerfile copies root shared/ into /app/shared/,
          # but locally the graph has its own shared/ dir. Copy missing files
          # from root shared/ into the service's shared/ to match Docker behavior.
          SERVICE_SHARED="services/${{ matrix.service }}/shared"
          if [ -d "$SERVICE_SHARED" ] && [ -d "shared" ]; then
            # Copy files from root shared/ that don't exist in service shared/
            for f in shared/*.py; do
              fname=$(basename "$f")
              if [ ! -f "$SERVICE_SHARED/$fname" ]; then
                cp "$f" "$SERVICE_SHARED/$fname"
                echo "  Copied $fname to $SERVICE_SHARED/"
              fi
            done
            echo "✓ Shared module bridge configured"
          fi

      - name: Check Test Collection
        run: |
          cd services/${{ matrix.service }}
          # Collect tests without running them
          python3 -m pytest --collect-only tests/ || {
            echo "ERROR: Test collection failed for ${{ matrix.service }}"
            echo "This usually means:"
            echo "  - Missing dependencies"
            echo "  - Import errors"
            echo "  - Missing environment variables"
            exit 1
          }
          echo "✓ Test collection passed"

      # services/shared is not a FastAPI service: it has no ``app/`` package
      # (backend-ci special-cases its coverage target for the same reason) and
      # no per-service conftest.py — its tests resolve against the repo-root
      # conftest. Exempted by name, loudly, rather than by leaving `shared`
      # out of the matrix the way #2923 found it. Drop the exemption if
      # services/shared/conftest.py is ever added.
      - name: Verify conftest.py Exists
        # services/shared is a library package, not a service: it has no
        # app/ dir for the root conftest's sys.path switching to target and
        # ships no conftest.py of its own. Its collection check above still
        # runs (#2923); only this service-shaped assertion is skipped.
        if: matrix.service != 'shared'
        run: |
            cd services/${{ matrix.service }}
            if [ ! -f "conftest.py" ]; then
              echo "ERROR: Missing conftest.py in ${{ matrix.service }}"
              exit 1
            fi
            echo "✓ conftest.py exists"

      - name: Run Smoke Tests
        run: |
          cd services/${{ matrix.service }}
          # Run only smoke tests. Missing smoke files are reported, but real
          # smoke failures are no longer swallowed.
          shopt -s nullglob
          smoke_tests=(tests/test_smoke*.py)
          if [ ${#smoke_tests[@]} -eq 0 ]; then
            echo "::notice::No smoke tests found for ${{ matrix.service }}"
            exit 0
          fi
          python3 -m pytest "${smoke_tests[@]}" -v
