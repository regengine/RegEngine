name: Inflow Lab Contract CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inflow_lab_ref:
        description: Inflow Lab git ref to test. Defaults to INFLOW_LAB_REF.
        required: false
        type: string

concurrency:
  group: inflow-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  INFLOW_LAB_REPOSITORY: regengine/inflow-lab
  # Verified Inflow Lab guardrail candidate; update this pin when simulator
  # contract fixtures intentionally change.
  INFLOW_LAB_REF: 0361cdd6d64bab1f3e51fb17b0e567dbe9a4647e  # pragma: allowlist secret
  CONTRACT_TENANT_ID: 11111111-1111-1111-1111-111111111111
  CONTRACT_API_KEY: ci-inflow-contract-key  # pragma: allowlist secret
  CONTRACT_HMAC_SECRET: ci-inflow-contract-hmac-secret  # pragma: allowlist secret

permissions:
  contents: read

jobs:
  changes:
    name: Contract Change Detection
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      inflow_lab_ref: ${{ steps.refs.outputs.inflow_lab_ref }}

    steps:
      - name: Checkout RegEngine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          fetch-depth: 0

      - name: Resolve Inflow Lab ref
        id: refs
        env:
          REQUESTED_REF: ${{ inputs.inflow_lab_ref }}
        run: |
          inflow_ref="${REQUESTED_REF:-$INFLOW_LAB_REF}"
          echo "inflow_lab_ref=${inflow_ref}" >> "$GITHUB_OUTPUT"
          echo "Using Inflow Lab ref: ${inflow_ref}"

      - name: Detect contract-impacting changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch always runs the signed contract test."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "$head" > /tmp/changed-files.txt
          else
            git diff --name-only "$base" "$head" > /tmp/changed-files.txt
          fi

          should_run=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/inflow-contract-ci.yml|\
              alembic/*|\
              requirements.in|\
              requirements.lock|\
              services/ingestion/app/authz.py|\
              services/ingestion/app/config.py|\
              services/ingestion/app/tenant_validation.py|\
              services/ingestion/app/webhook_compat.py|\
              services/ingestion/app/webhook_models.py|\
              services/ingestion/app/webhook_router_v2.py|\
              services/ingestion/main.py|\
              services/shared/auth.py|\
              services/shared/canonical_event.py|\
              services/shared/canonical_persistence/*|\
              services/shared/cte_persistence/*|\
              services/shared/idempotency.py)
                should_run=true
                echo "Contract-impacting change: $file"
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          if [ "$should_run" != "true" ]; then
            echo "No contract-impacting changes detected; heavy contract test will be skipped."
          fi

  contract:
    name: Simulator live ingest contract
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: regengine_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout RegEngine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          path: regengine

      - name: Checkout pinned Inflow Lab simulator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          repository: ${{ env.INFLOW_LAB_REPOSITORY }}
          ref: ${{ needs.changes.outputs.inflow_lab_ref }}
          path: inflow-lab

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: inflow-contract-python-${{ hashFiles('regengine/requirements.lock', 'inflow-lab/uv.lock', 'inflow-lab/pyproject.toml') }}
          restore-keys: |
            inflow-contract-python-
            pip-

      - name: Install RegEngine dependencies
        working-directory: regengine
        run: |
          pip install --require-hashes -r requirements.lock
          pip install uvicorn

      - name: Install Inflow Lab dependencies
        working-directory: inflow-lab
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --no-dev

      - name: Prepare RegEngine database roles
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          psql -h localhost -U postgres -d regengine_contract -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN CREATE ROLE regengine LOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;" \
            -c "DO \$\$ BEGIN CREATE ROLE regengine_sysadmin LOGIN INHERIT; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;" \
            -c "GRANT regengine TO regengine_sysadmin;" \
            -c "CREATE OR REPLACE FUNCTION get_tenant_context() RETURNS UUID AS \$\$ DECLARE tid TEXT; BEGIN tid := NULLIF(current_setting('app.tenant_id', TRUE), ''); IF tid IS NULL THEN RAISE EXCEPTION 'app.tenant_id not set - tenant context required for RLS'; END IF; RETURN tid::UUID; END; \$\$ LANGUAGE plpgsql;"

      - name: Apply RegEngine migrations
        working-directory: regengine
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
        run: alembic upgrade head

      - name: Start local RegEngine ingestion service
        working-directory: regengine
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
          COMPLIANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          REGENGINE_ENV: test
          API_KEY: ${{ env.CONTRACT_API_KEY }}
          AUTH_TEST_BYPASS_TOKEN: ${{ env.CONTRACT_API_KEY }}
          AUTH_TEST_BYPASS_TENANT_ID: ${{ env.CONTRACT_TENANT_ID }}
          SUBSCRIPTION_GATE_FAIL_OPEN: 'true'
          WEBHOOK_HMAC_SECRET: ${{ env.CONTRACT_HMAC_SECRET }}
          JWT_SECRET: test-secret-key-for-ci  # pragma: allowlist secret
          SUPABASE_URL: http://localhost:54321
          SUPABASE_KEY: test-key-for-ci
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          PYTHONPATH="$(pwd):$(pwd)/services:${PYTHONPATH}"
          export PYTHONPATH
          python -m uvicorn services.ingestion.main:app --host 127.0.0.1 --port 8002 > /tmp/regengine-ingestion.log 2>&1 &
          echo $! > /tmp/regengine-ingestion.pid
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/regengine-ingestion.pid)" 2>/dev/null; then
              cat /tmp/regengine-ingestion.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/regengine-ingestion.log
          exit 1

      - name: Start local Inflow Lab simulator
        working-directory: inflow-lab
        env:
          REGENGINE_DATA_DIR: /tmp/inflow-lab-data
          REGENGINE_CORS_ORIGINS: http://127.0.0.1:8010
          REGENGINE_WEBHOOK_HMAC_SECRET: ${{ env.CONTRACT_HMAC_SECRET }}
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          uv run --frozen --no-dev python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/inflow-lab.log 2>&1 &
          echo $! > /tmp/inflow-lab.pid
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8010/api/healthz >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/inflow-lab.pid)" 2>/dev/null; then
              cat /tmp/inflow-lab.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/inflow-lab.log
          exit 1

      - name: Run one-batch signed live ingest contract
        working-directory: inflow-lab
        env:
          REGENGINE_REMOTE_BASE_URL: http://127.0.0.1:8010
          REGENGINE_REMOTE_USERNAME: unused
          REGENGINE_REMOTE_PASSWORD: unused  # pragma: allowlist secret
          REGENGINE_REMOTE_TENANT: inflow-contract
          REGENGINE_LIVE_ENDPOINT: http://localhost:8002/api/v1/webhooks/ingest
          REGENGINE_LIVE_API_KEY: ${{ env.CONTRACT_API_KEY }}
          REGENGINE_LIVE_TENANT_ID: ${{ env.CONTRACT_TENANT_ID }}
          REGENGINE_WEBHOOK_HMAC_SECRET: ${{ env.CONTRACT_HMAC_SECRET }}
        run: uv run --frozen --no-dev python scripts/live_trial.py --confirm-live

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "== Inflow Lab stored events =="
          curl -fsS -H "X-RegEngine-Tenant: inflow-contract" "http://127.0.0.1:8010/api/events?limit=5" || true
          echo
          echo "== RegEngine ingestion log =="
          cat /tmp/regengine-ingestion.log || true
          echo "== Inflow Lab log =="
          cat /tmp/inflow-lab.log || true

      - name: Stop local services
        if: always()
        run: |
          if [ -f /tmp/inflow-lab.pid ]; then kill "$(cat /tmp/inflow-lab.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/regengine-ingestion.pid ]; then kill "$(cat /tmp/regengine-ingestion.pid)" 2>/dev/null || true; fi

  contract-status-gate:
    name: Contract Status Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - contract
    if: always()

    steps:
      - name: Require contract decision
        run: |
          echo "Change detection result: ${{ needs.changes.result }}"
          echo "Contract test requested: ${{ needs.changes.outputs.should_run }}"
          echo "Contract test result: ${{ needs.contract.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Contract change detection did not complete successfully."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.should_run }}" = "true" ] && [ "${{ needs.contract.result }}" != "success" ]; then
            echo "::error::Contract-impacting changes require the signed Inflow Lab ingest contract test to pass."
            exit 1
          fi

          echo "Contract status gate satisfied."
