name: Inflow Lab Contract CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inflow_lab_ref:
        description: Inflow Lab git ref to test. Defaults to INFLOW_LAB_REF.
        required: false
        type: string

concurrency:
  group: inflow-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  INFLOW_LAB_REPOSITORY: regengine/inflow-lab
  # Verified Inflow Lab guardrail candidate; update this pin when simulator
  # contract fixtures intentionally change. This ref must advertise
  # contract_version via /api/healthz (inflow-lab main @ #73 or later) for
  # the cross-repo contract-version assertion below.
  # Advanced from 4651e1a (#235): that commit was 74+ behind inflow-lab main
  # and every file in the contract surface -- regengine_client, controller,
  # contract, cte_rules, mock_service, schemas/*, scripts/live_trial.py --
  # had changed since, so this job was exercising a simulator that no longer
  # resembled the deployed one. Both sides still advertise
  # INFLOW_CONTRACT_VERSION "1"; this is staleness, not a wire-contract bump.
  # Advanced again from d6bbe98: that ref carried a regression in
  # scripts/live_trial.py -- the script this job runs -- where the cleanup
  # `finally` closed its own HTTP client before the stop/revert calls that
  # use it, so the run died on "Cannot send a request, as the client has
  # been closed" and, worse, never disarmed live delivery. inflow-lab#236
  # fixes that; this ref is the first main commit that carries the fix.
  INFLOW_LAB_REF: 2a752aa2b33b65b2a3e679460c4bd2f90fd9cbc4  # pragma: allowlist secret
  CONTRACT_TENANT_ID: 11111111-1111-1111-1111-111111111111
  CONTRACT_API_KEY: ci-inflow-contract-key  # pragma: allowlist secret
  CONTRACT_HMAC_SECRET: ci-inflow-contract-hmac-secret  # pragma: allowlist secret

permissions:
  contents: read

jobs:
  changes:
    name: Contract Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      inflow_lab_ref: ${{ steps.refs.outputs.inflow_lab_ref }}

    steps:
      - name: Checkout RegEngine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Resolve Inflow Lab ref
        id: refs
        env:
          REQUESTED_REF: ${{ inputs.inflow_lab_ref }}
        run: |
          inflow_ref="${REQUESTED_REF:-$INFLOW_LAB_REF}"
          echo "inflow_lab_ref=${inflow_ref}" >> "$GITHUB_OUTPUT"
          echo "Using Inflow Lab ref: ${inflow_ref}"

      - name: Detect contract-impacting changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch always runs the signed contract test."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "$head" > /tmp/changed-files.txt
          else
            git diff --name-only "$base" "$head" > /tmp/changed-files.txt
          fi

          should_run=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/inflow-contract-ci.yml|\
              alembic/*|\
              requirements.in|\
              requirements.lock|\
              services/ingestion/app/authz.py|\
              services/ingestion/app/config.py|\
              services/ingestion/app/tenant_validation.py|\
              services/ingestion/app/webhook_compat.py|\
              services/ingestion/app/webhook_models.py|\
              services/ingestion/app/webhook_router_v2/*|\
              services/ingestion/main.py|\
              services/shared/auth.py|\
              services/shared/canonical_event.py|\
              services/shared/canonical_persistence/*|\
              services/shared/cte_persistence/*|\
              services/shared/funnel_events.py|\
              services/shared/idempotency.py)
                should_run=true
                echo "Contract-impacting change: $file"
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          if [ "$should_run" != "true" ]; then
            echo "No contract-impacting changes detected; heavy contract test will be skipped."
          fi

  contract:
    name: Simulator live ingest contract
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: regengine_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout RegEngine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          path: regengine

      - name: Checkout pinned Inflow Lab simulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          repository: ${{ env.INFLOW_LAB_REPOSITORY }}
          ref: ${{ needs.changes.outputs.inflow_lab_ref }}
          path: inflow-lab

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: inflow-contract-python-${{ hashFiles('regengine/requirements.lock', 'inflow-lab/uv.lock', 'inflow-lab/pyproject.toml') }}
          restore-keys: |
            inflow-contract-python-
            pip-

      - name: Install RegEngine dependencies
        working-directory: regengine
        run: |
          pip install --require-hashes -r requirements.lock
          pip install uvicorn

      - name: Install Inflow Lab dependencies
        working-directory: inflow-lab
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --no-dev

      - name: Prepare RegEngine database roles
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          # Same attribute set as backend-ci.yml and scripts/init-postgres.sh.
          # The roles carry no credential of their own because every step in
          # this job connects as postgres. No
          # `GRANT regengine TO regengine_sysadmin`: migration v111
          # (alembic/versions/20260803_b71d9e4c2a60_v111_runtime_role_grants.py)
          # raises "runtime roles must have no incoming or outgoing memberships"
          # when either role has any membership, and applies the production
          # grants itself, so a test-only grant makes `alembic upgrade head`
          # exit 1.
          psql -h localhost -U postgres -d regengine_contract -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN CREATE ROLE regengine LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;" \
            -c "DO \$\$ BEGIN CREATE ROLE regengine_sysadmin LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;" \
            -c "CREATE OR REPLACE FUNCTION get_tenant_context() RETURNS UUID AS \$\$ DECLARE tid TEXT; BEGIN tid := NULLIF(current_setting('app.tenant_id', TRUE), ''); IF tid IS NULL THEN RAISE EXCEPTION 'app.tenant_id not set - tenant context required for RLS'; END IF; RETURN tid::UUID; END; \$\$ LANGUAGE plpgsql;"

      - name: Apply RegEngine migrations
        working-directory: regengine
        env:
          MIGRATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
        run: alembic upgrade head

      - name: Start local RegEngine ingestion service
        working-directory: regengine
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
          COMPLIANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regengine_contract  # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          REGENGINE_ENV: test
          API_KEY: ${{ env.CONTRACT_API_KEY }}
          AUTH_TEST_BYPASS_TOKEN: ${{ env.CONTRACT_API_KEY }}
          AUTH_TEST_BYPASS_TENANT_ID: ${{ env.CONTRACT_TENANT_ID }}
          SUBSCRIPTION_GATE_FAIL_OPEN: 'true'
          WEBHOOK_HMAC_SECRET: ${{ env.CONTRACT_HMAC_SECRET }}
          JWT_SECRET: test-secret-key-for-ci  # pragma: allowlist secret
          SUPABASE_URL: http://localhost:54321
          SUPABASE_KEY: test-key-for-ci
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          PYTHONPATH="$(pwd):$(pwd)/services:${PYTHONPATH}"
          export PYTHONPATH
          python -m uvicorn services.ingestion.main:app --host 127.0.0.1 --port 8002 > /tmp/regengine-ingestion.log 2>&1 &
          echo $! > /tmp/regengine-ingestion.pid
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/regengine-ingestion.pid)" 2>/dev/null; then
              cat /tmp/regengine-ingestion.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/regengine-ingestion.log
          exit 1

      - name: Start local Inflow Lab simulator
        working-directory: inflow-lab
        env:
          REGENGINE_DATA_DIR: /tmp/inflow-lab-data
          REGENGINE_CORS_ORIGINS: http://127.0.0.1:8010
          REGENGINE_WEBHOOK_HMAC_SECRET: ${{ env.CONTRACT_HMAC_SECRET }}
          # The simulator now guards its own egress (inflow-lab #87/#207): it
          # refuses a delivery endpoint resolving to loopback, and refuses
          # cleartext outright. REGENGINE_LIVE_ENDPOINT below is
          # http://localhost:8002 -- both of those, deliberately, because this
          # job runs both services on the runner. Without this the live trial
          # fails before a single request leaves the process: verified by
          # running the simulator this way with and without it (zero requests
          # reach the ingestion service vs delivery succeeding).
          #
          # This is exactly the local-development case the hatch exists for,
          # and it is scoped to this one step, so nothing else in the workflow
          # -- and no deployed instance -- inherits it.
          REGENGINE_ALLOW_PRIVATE_ENDPOINTS: '1'
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          uv run --frozen --no-dev python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/inflow-lab.log 2>&1 &
          echo $! > /tmp/inflow-lab.pid
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8010/api/healthz >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/inflow-lab.pid)" 2>/dev/null; then
              cat /tmp/inflow-lab.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/inflow-lab.log
          exit 1

      - name: Assert contract versions match across repos
        run: |
          # Download to files first (no curl-into-interpreter piping).
          curl -fsS -o /tmp/regengine-health.json http://127.0.0.1:8002/health
          curl -fsS -o /tmp/inflow-healthz.json http://127.0.0.1:8010/api/healthz
          regengine_version=$(python3 -c "import json; print(json.load(open('/tmp/regengine-health.json')).get('inflow_contract_version',''))")
          inflow_version=$(python3 -c "import json; print(json.load(open('/tmp/inflow-healthz.json')).get('contract_version',''))")
          echo "RegEngine advertises inflow_contract_version=${regengine_version}"
          echo "Inflow Lab advertises contract_version=${inflow_version}"
          if [ -z "${regengine_version}" ] || [ -z "${inflow_version}" ]; then
            echo "::error::One side does not advertise a contract version (RegEngine webhook_models.INFLOW_CONTRACT_VERSION / inflow-lab app/contract.py)."
            exit 1
          fi
          if [ "${regengine_version}" != "${inflow_version}" ]; then
            echo "::error::Contract version skew: RegEngine v${regengine_version} vs Inflow Lab v${inflow_version}. Bump both repos together and update INFLOW_LAB_REF."
            exit 1
          fi

      - name: Run one-batch signed live ingest contract
        working-directory: inflow-lab
        env:
          REGENGINE_REMOTE_BASE_URL: http://127.0.0.1:8010
          REGENGINE_REMOTE_USERNAME: unused
          REGENGINE_REMOTE_PASSWORD: unused  # pragma: allowlist secret
          REGENGINE_REMOTE_TENANT: inflow-contract
          REGENGINE_LIVE_ENDPOINT: http://localhost:8002/api/v1/webhooks/ingest
          REGENGINE_LIVE_API_KEY: ${{ env.CONTRACT_API_KEY }}
          REGENGINE_LIVE_TENANT_ID: ${{ env.CONTRACT_TENANT_ID }}
          REGENGINE_WEBHOOK_HMAC_SECRET: ${{ env.CONTRACT_HMAC_SECRET }}
        run: uv run --frozen --no-dev python scripts/live_trial.py --confirm-live

      - name: Verify ingested evidence actually persisted
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          # The live trial only proves RegEngine returned 200 "accepted".
          # That once passed while a poisoned ingest transaction silently
          # rolled back every evidence row (failed funnel_events insert
          # aborted the shared session; see emit_funnel_event savepoint
          # fix). The contract is only honored when the accepted events
          # are durable — assert the evidence rows and hash chain exist.
          for table in fsma.cte_events fsma.cte_kdes fsma.hash_chain fsma.traceability_events; do
            count=$(psql -h localhost -U postgres -d regengine_contract -tA \
              -c "SELECT COUNT(*) FROM ${table} WHERE tenant_id = '${CONTRACT_TENANT_ID}';")
            echo "${table}: ${count} row(s)"
            if [ "${count}" -lt 1 ]; then
              echo "::error::${table} has no rows for the contract tenant — RegEngine acknowledged the ingest but persisted nothing."
              exit 1
            fi
          done

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "== Inflow Lab stored events =="
          curl -fsS -H "X-RegEngine-Tenant: inflow-contract" "http://127.0.0.1:8010/api/events?limit=5" || true
          echo
          echo "== RegEngine ingestion log =="
          cat /tmp/regengine-ingestion.log || true
          echo "== Inflow Lab log =="
          cat /tmp/inflow-lab.log || true

      - name: Stop local services
        if: always()
        run: |
          if [ -f /tmp/inflow-lab.pid ]; then kill "$(cat /tmp/inflow-lab.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/regengine-ingestion.pid ]; then kill "$(cat /tmp/regengine-ingestion.pid)" 2>/dev/null || true; fi

  contract-status-gate:
    name: Contract Status Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - contract
    if: always()

    steps:
      - name: Require contract decision
        run: |
          echo "Change detection result: ${{ needs.changes.result }}"
          echo "Contract test requested: ${{ needs.changes.outputs.should_run }}"
          echo "Contract test result: ${{ needs.contract.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Contract change detection did not complete successfully."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.should_run }}" = "true" ] && [ "${{ needs.contract.result }}" != "success" ]; then
            echo "::error::Contract-impacting changes require the signed Inflow Lab ingest contract test to pass."
            exit 1
          fi

          echo "Contract status gate satisfied."
