name: Head SHA Check Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ['PR Gate']
    types: [completed]

concurrency:
  group: head-sha-check-guard-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: write
  pull-requests: read

jobs:
  head-sha-check-guard:
    name: "Head SHA Check Guard"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Head SHA Checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const REQUIRED_CHECKS = [
              'CI Status Gate',
              'PR Gate: Backend',
              'PR Gate: Frontend',
              'PR Gate: Workflow Contract',
            ];

            const targetUrl = `${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Prevent self-trigger loops
            if (context.eventName === 'workflow_run' && context.payload.workflow_run?.name === 'Head SHA Check Guard') {
              core.info('Skipping run triggered by own workflow_run completion.');
              return;
            }

            // Resolve evaluated SHA from event payload
            const evaluatedSha =
              context.payload.pull_request?.head?.sha ||
              context.payload.workflow_run?.head_sha ||
              context.payload.check_suite?.head_sha ||
              context.sha;

            if (!evaluatedSha) {
              core.setFailed('Could not determine head SHA to evaluate.');
              return;
            }

            core.info(`Evaluating checks for head SHA: ${evaluatedSha} (event: ${context.eventName})`);

            // Resolve the PR(s) from the event's head_sha
            let targetPrs = [];
            if (context.eventName === 'pull_request' && context.payload.pull_request) {
              targetPrs = [{
                number: context.payload.pull_request.number,
                headSha: context.payload.pull_request.head?.sha,
              }];
            } else {
              try {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: evaluatedSha,
                });
                const openPrs = prs.filter((p) => p.state === 'open');
                for (const p of openPrs) {
                  targetPrs.push({
                    number: p.number,
                    headSha: p.head?.sha,
                  });
                }
              } catch (err) {
                core.warning(`Error finding PR associated with commit ${evaluatedSha}: ${err.message}`);
              }

              if (targetPrs.length === 0) {
                const payloadPrs = context.payload.workflow_run?.pull_requests ||
                                   context.payload.check_suite?.pull_requests || [];
                for (const p of payloadPrs) {
                  targetPrs.push({
                    number: p.number,
                    headSha: p.head?.sha,
                  });
                }
              }
            }

            if (targetPrs.length === 0) {
              core.info(`No open pull request associated with commit ${evaluatedSha}. Guard skipped.`);
              if (process.env.GITHUB_STEP_SUMMARY) {
                const skipSummary = [
                  '### Head SHA Check Guard Summary',
                  '',
                  `No open pull request associated with commit \`${evaluatedSha}\`. Guard skipped.`,
                  '',
                ].join('\n');
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, skipSummary, 'utf8');
              }
              return;
            }

            // Fetch latest PR state to check if head moved
            let matchedPr = null;
            for (const p of targetPrs) {
              try {
                const { data: prData } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: p.number,
                });
                if (prData.state === 'open') {
                  if (prData.head?.sha === evaluatedSha) {
                    matchedPr = prData;
                    break;
                  } else if (!matchedPr) {
                    matchedPr = prData;
                  }
                }
              } catch (err) {
                core.warning(`Failed to fetch PR #${p.number}: ${err.message}`);
              }
            }

            if (!matchedPr) {
              core.info(`No open pull request found for commit ${evaluatedSha}. Guard skipped.`);
              return;
            }

            const prNumber = matchedPr.number;
            const prHeadSha = matchedPr.head?.sha;

            if (!prHeadSha) {
              core.setFailed(`PR #${prNumber} has no head SHA.`);
              return;
            }

            // (c) If the PR head SHA differs from the SHA being evaluated,
            // set failure on the evaluated SHA ('head moved') and do not switch to the new commit.
            if (prHeadSha !== evaluatedSha) {
              core.info(`PR #${prNumber} head SHA (${prHeadSha}) differs from evaluated SHA (${evaluatedSha}).`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: evaluatedSha,
                state: 'failure',
                context: 'Head SHA Check Guard / status',
                description: 'Head moved',
                target_url: targetUrl,
              });
              core.setFailed(`Head moved: PR #${prNumber} head is ${prHeadSha}, evaluated commit was ${evaluatedSha}`);
              return;
            }

            core.info(`Guarding PR #${prNumber} at head SHA: ${evaluatedSha}`);

            async function evaluateChecks(sha) {
              const checkRuns = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                }
              );

              let commitStatuses = [];
              try {
                const statusRes = await github.rest.repos.getCombinedStatusForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                });
                commitStatuses = statusRes.data.statuses || [];
              } catch (statusErr) {
                core.warning(`Error fetching commit statuses for ${sha}: ${statusErr.message}`);
              }

              const results = {};
              for (const name of REQUIRED_CHECKS) {
                const matchingRuns = checkRuns.filter(
                  (cr) => cr.name === name && cr.head_sha === sha
                );
                matchingRuns.sort((a, b) => {
                  const timeA = new Date(a.completed_at || a.started_at || 0).getTime();
                  const timeB = new Date(b.completed_at || b.started_at || 0).getTime();
                  if (timeA !== timeB) return timeB - timeA;
                  return b.id - a.id;
                });
                const latestRun = matchingRuns[0];

                const matchingStatuses = commitStatuses.filter(
                  (cs) => cs.context === name
                );
                matchingStatuses.sort((a, b) => {
                  const timeA = new Date(a.updated_at || a.created_at || 0).getTime();
                  const timeB = new Date(b.updated_at || b.created_at || 0).getTime();
                  if (timeA !== timeB) return timeB - timeA;
                  return b.id - a.id;
                });
                const latestStatus = matchingStatuses[0];

                if (latestRun) {
                  if (latestRun.status === 'completed') {
                    const isSuccess = latestRun.conclusion === 'success';
                    results[name] = {
                      name,
                      type: 'Check Run',
                      headSha: latestRun.head_sha,
                      status: latestRun.status,
                      conclusion: latestRun.conclusion,
                      passed: isSuccess,
                      pending: false,
                    };
                  } else {
                    results[name] = {
                      name,
                      type: 'Check Run',
                      headSha: latestRun.head_sha,
                      status: latestRun.status,
                      conclusion: latestRun.conclusion || 'pending',
                      passed: false,
                      pending: true,
                    };
                  }
                } else if (latestStatus) {
                  if (latestStatus.state === 'success') {
                    results[name] = {
                      name,
                      type: 'Commit Status',
                      headSha: sha,
                      status: 'completed',
                      conclusion: 'success',
                      passed: true,
                      pending: false,
                    };
                  } else if (latestStatus.state === 'pending') {
                    results[name] = {
                      name,
                      type: 'Commit Status',
                      headSha: sha,
                      status: 'pending',
                      conclusion: 'pending',
                      passed: false,
                      pending: true,
                    };
                  } else {
                    results[name] = {
                      name,
                      type: 'Commit Status',
                      headSha: sha,
                      status: 'completed',
                      conclusion: latestStatus.state,
                      passed: false,
                      pending: false,
                    };
                  }
                } else {
                  results[name] = {
                    name,
                    type: 'Not Found',
                    headSha: 'none',
                    status: 'pending',
                    conclusion: 'not reported',
                    passed: false,
                    pending: true,
                  };
                }
              }

              const allPassed = REQUIRED_CHECKS.every((name) => results[name]?.passed);
              const anyFailed = REQUIRED_CHECKS.some((name) => !results[name]?.passed && !results[name]?.pending);
              const hasPending = REQUIRED_CHECKS.some((name) => results[name]?.pending);

              return { results, allPassed, anyFailed, hasPending };
            }

            const startTime = Date.now();
            let evalResult = await evaluateChecks(evaluatedSha);

            // Single evaluation per run with no long polling (at most one short re-read)
            if (evalResult.hasPending && !evalResult.anyFailed) {
              core.info('Required checks are pending on initial evaluation. Waiting 10s for a short re-read...');
              await new Promise((resolve) => setTimeout(resolve, 10000));

              // Re-verify that PR head did not move during the wait
              const { data: latestPrAfterWait } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              if (latestPrAfterWait.head?.sha !== evaluatedSha) {
                core.info(`PR head moved during wait. Evaluated: ${evaluatedSha}, Current: ${latestPrAfterWait.head?.sha}`);
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: evaluatedSha,
                  state: 'failure',
                  context: 'Head SHA Check Guard / status',
                  description: 'Head moved',
                  target_url: targetUrl,
                });
                core.setFailed(`Head moved: PR #${prNumber} head is ${latestPrAfterWait.head?.sha}, evaluated commit was ${evaluatedSha}`);
                return;
              }

              evalResult = await evaluateChecks(evaluatedSha);
            }

            function writeStepSummary({ headSha, results, allPassed, hasPending, anyFailed, durationSeconds }) {
              if (!process.env.GITHUB_STEP_SUMMARY) return;

              const rows = [];
              rows.push('### Head SHA Check Guard Summary');
              rows.push('');
              rows.push(`- Pull Request: #${prNumber}`);
              rows.push(`- Current PR Head SHA: \`${headSha}\``);
              rows.push(`- Elapsed Time: ${durationSeconds}s`);
              const overallResult = allPassed ? 'PASSED' : (hasPending ? 'PENDING' : 'FAILED');
              rows.push(`- Overall Result: **${overallResult}**`);
              rows.push('');
              rows.push('| Required Check | Type | Head SHA | Status | Conclusion | Result |');
              rows.push('| :--- | :--- | :--- | :--- | :--- | :--- |');

              for (const name of REQUIRED_CHECKS) {
                const r = results[name] || {
                  type: 'Missing',
                  headSha: 'none',
                  status: 'missing',
                  conclusion: 'not reported',
                  passed: false,
                  pending: true,
                };
                const shortSha = r.headSha && r.headSha !== 'none' ? `\`${r.headSha.substring(0, 7)}\`` : 'none';
                const resultText = r.passed ? 'PASSED' : (r.pending ? 'PENDING' : 'FAILED');
                rows.push(`| ${name} | ${r.type} | ${shortSha} | ${r.status} | ${r.conclusion} | ${resultText} |`);
              }

              rows.push('');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join('\n'), 'utf8');
            }

            const durationSeconds = Math.round((Date.now() - startTime) / 1000);
            writeStepSummary({
              headSha: evaluatedSha,
              results: evalResult.results,
              allPassed: evalResult.allPassed,
              hasPending: evalResult.hasPending,
              anyFailed: evalResult.anyFailed,
              durationSeconds,
            });

            if (evalResult.allPassed) {
              core.info(`All required checks have passed on head SHA ${evaluatedSha}.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: evaluatedSha,
                state: 'success',
                context: 'Head SHA Check Guard / status',
                description: 'All required checks passed on head SHA',
                target_url: targetUrl,
              });
              return;
            }

            if (evalResult.anyFailed) {
              const failedList = REQUIRED_CHECKS.filter(
                (name) => !evalResult.results[name]?.passed && !evalResult.results[name]?.pending
              ).map((name) => `${name} (${evalResult.results[name]?.conclusion})`).join(', ');

              core.info(`One or more required checks failed on head SHA ${evaluatedSha}: ${failedList}`);
              const statusDesc = `Checks failed: ${failedList}`.substring(0, 140);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: evaluatedSha,
                state: 'failure',
                context: 'Head SHA Check Guard / status',
                description: statusDesc,
                target_url: targetUrl,
              });
              core.setFailed(`Head SHA Check Guard failed on head SHA ${evaluatedSha}. Failed checks: ${failedList}`);
              return;
            }

            if (evalResult.hasPending) {
              const pendingNames = REQUIRED_CHECKS.filter(
                (name) => evalResult.results[name]?.pending
              ).join(', ');

              core.info(`Required checks still pending on head SHA ${evaluatedSha}: ${pendingNames}. Reporting pending and exiting 0.`);
              const statusDesc = `Checks pending: ${pendingNames}`.substring(0, 140);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: evaluatedSha,
                state: 'pending',
                context: 'Head SHA Check Guard / status',
                description: statusDesc,
                target_url: targetUrl,
              });
              return;
            }
