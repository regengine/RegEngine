# PR merge gate — always-on shim so branch protection can require CI.
#
# WHY THIS EXISTS
# backend-ci.yml and frontend-ci.yml are path-filtered on `pull_request`, so a
# frontend-only PR never produces "Backend CI Status Gate" and a backend-only
# PR never produces "Frontend CI Status Gate". Making those job names required
# contexts directly would leave cross-area PRs waiting forever on a check that
# will never post. This workflow is NOT path-filtered: it always runs on every
# PR to main and posts two checks — "PR Gate: Backend" and "PR Gate: Frontend" —
# which are the names branch protection requires.
#
# For each area the gate either:
#   * passes vacuously when that area's paths were not touched (the real
#     workflow legitimately did not run), or
#   * waits for and mirrors that area's real gate when the paths were touched.
#
# The per-area path lists below MUST mirror the `pull_request: paths:` blocks in
# backend-ci.yml and frontend-ci.yml. If they drift, the failure is biased safe:
# over-detection makes this gate wait for a real gate that never appears and
# time out (a spurious block, recoverable by an admin), while the dangerous
# direction — passing an area whose real gate actually failed — only happens on
# under-detection, so keep these lists a faithful copy. deploy.yml continues to
# wait on "Backend CI Status Gate" directly and is unaffected by this shim.
#
# ---------------------------------------------------------------------------
# REQUIRED CONTEXT — DO NOT RENAME THE `CI Status Gate` JOB
# ---------------------------------------------------------------------------
# `main` branch protection requires the context "CI Status Gate" (exact
# string). The aggregate job at the bottom of this file is the ONLY job in the
# repository that emits it — the per-area jobs are named "PR Gate: Backend" /
# "PR Gate: Frontend" and are NOT required contexts.
#
# Before this file gained that aggregate job, "CI Status Gate" was required but
# emitted by nothing (the real gates are "Backend CI Status Gate" and
# "Frontend CI Status Gate"), so every PR waited forever on a check that could
# never post and merges proceeded via admin override.
#
# Renaming this job, deleting this workflow, or adding a path filter to its
# `pull_request:` trigger re-breaks branch protection for EVERY PR.
# scripts/check_workflow_inventory.py fails CI if you do; the full contract is
# in docs/runbooks/BRANCH_PROTECTION.md.

name: PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  backend:
    name: "PR Gate: Backend"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - name: Detect backend-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess

          # Mirror of backend-ci.yml `pull_request: paths:` — keep in sync.
          PATHS = [
              "alembic/**", "server/**", "services/**", "shared/**", "kernel/**",
              "plugins/fsma/**", "Dockerfile", "railway.toml", "requirements.in",
              "requirements.lock", "scripts/**", "tests/**", "sample_data/**",
              "demo_exports/**", ".github/workflows/backend-ci.yml",
              ".github/workflows/deploy.yml",
          ]
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          # Three-dot (merge-base..head) = only THIS PR's changes. Two-dot
          # would also include everything that landed on the base branch after
          # this PR diverged, so once main advances the gate over-detects and
          # waits for a real gate that never runs (spurious red).
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}"],
              check=True, capture_output=True, text=True,
          ).stdout.split()

          def matches(f):
              for p in PATHS:
                  if p.endswith("/**"):
                      if f.startswith(p[:-2]):
                          return True
                  elif f == p:
                      return True
              return False

          hit = any(matches(f) for f in changed)
          print(f"changed={'true' if hit else 'false'}")
          PY
      - name: Wait for Backend CI Status Gate
        if: steps.detect.outputs.changed == 'true'
        uses: lewagon/wait-on-check-action@1d57e2c51a58d812d2765e036a028b6bdb5a6154  # v1.8.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: "Backend CI Status Gate"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: "PR Gate: Backend"
          wait-interval: 30
          allowed-conclusions: success
          # The action's DEFAULT is 60s, which is how long it waits for the
          # target check to EXIST before giving up with "The requested check
          # was never run against this ref". "Backend CI Status Gate" is the
          # final aggregate job of backend-ci.yml — it is not created until
          # every other backend job finishes (~8 min on a green run), so the
          # 60s default guaranteed a false red on every PR that actually
          # touched backend paths. Wait up to 30 min for it to appear; the
          # job's own timeout-minutes: 45 remains the hard bound.
          checks-discovery-timeout: 1800
      - name: No backend-relevant changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No backend-relevant paths changed; Backend CI legitimately did not run. Gate vacuously green."

  frontend:
    name: "PR Gate: Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - name: Detect frontend-relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess

          # Mirror of frontend-ci.yml `pull_request: paths:` — keep in sync.
          PATHS = [
              "frontend/**", "docs/**", "sales/**", "sales_enablement/**",
              "frontend/public/**", "services/admin/app/auth/**",
              "services/admin/app/e2e_safety.py",
              "services/admin/app/session_store.py",
              "services/admin/app/rate_limit_service.py",
              "services/admin/app/sqlalchemy_models.py",
              "services/admin/tests/test_e2e_safety.py",
              "services/admin/tests/test_webauthn_router.py",
              "scripts/seed_passwordless_e2e_user.py",
              "scripts/generate_openapi.py", "scripts/start-e2e-backend.sh",
              "requirements.in", "requirements.lock",
              "scripts/check_trust_safety_copy.py",
              "scripts/trust_safety_copy_allowlist.txt",
              ".github/workflows/frontend-ci.yml",
          ]
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          # Three-dot (merge-base..head) = only THIS PR's changes. Two-dot
          # would also include everything that landed on the base branch after
          # this PR diverged, so once main advances the gate over-detects and
          # waits for a real gate that never runs (spurious red).
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}"],
              check=True, capture_output=True, text=True,
          ).stdout.split()

          def matches(f):
              for p in PATHS:
                  if p.endswith("/**"):
                      if f.startswith(p[:-2]):
                          return True
                  elif f == p:
                      return True
              return False

          hit = any(matches(f) for f in changed)
          print(f"changed={'true' if hit else 'false'}")
          PY
      - name: Wait for Frontend CI Status Gate
        if: steps.detect.outputs.changed == 'true'
        uses: lewagon/wait-on-check-action@1d57e2c51a58d812d2765e036a028b6bdb5a6154  # v1.8.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: "Frontend CI Status Gate"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: "PR Gate: Frontend"
          wait-interval: 30
          allowed-conclusions: success
          # See the backend job above — the 60s default discovery window is
          # shorter than the time it takes the real gate job to be created.
          checks-discovery-timeout: 1800
      - name: No frontend-relevant changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No frontend-relevant paths changed; Frontend CI legitimately did not run. Gate vacuously green."

  # Workflow / branch-protection contract guard. Lives here rather than in
  # backend-ci.yml because that workflow is path-filtered: renaming a workflow
  # this guard is meant to catch (say qa-health.yml) touches none of its paths,
  # so the guard would not run on exactly the PR that breaks the contract.
  # pr-gate.yml is unfiltered by construction.
  workflow-contract:
    name: "PR Gate: Workflow Contract"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --disable-pip-version-check "pyyaml==6.0.2"
      - name: Check workflow inventory and required contexts
        run: python3 scripts/check_workflow_inventory.py

  # The single required context. Aggregates the per-area jobs so branch
  # protection has one always-posted check to require, on every PR, whatever
  # paths it touches. `needs` + an explicit result check (not just implicit
  # success) so a cancelled or skipped dependency fails closed rather than
  # reporting green.
  ci-status-gate:
    name: "CI Status Gate"
    runs-on: ubuntu-latest
    needs: [backend, frontend, workflow-contract]
    if: always()
    steps:
      - name: Verify all area gates passed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CONTRACT: ${{ needs.workflow-contract.result }}
        run: |
          echo "PR Gate: Backend           = $BACKEND"
          echo "PR Gate: Frontend          = $FRONTEND"
          echo "PR Gate: Workflow Contract = $CONTRACT"
          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ] || [ "$CONTRACT" != "success" ]; then
            echo "::error::CI Status Gate failed — backend=$BACKEND frontend=$FRONTEND contract=$CONTRACT"
            exit 1
          fi
          echo "All area gates green."
