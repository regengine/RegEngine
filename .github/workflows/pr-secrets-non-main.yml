name: Non-main PR Secrets

# pr-gate.yml scans every PR to main. Keep the same scans on PRs targeting
# other branches, including docs-only PRs skipped by security.yml.
on:
  pull_request:

concurrency:
  group: pr-secrets-non-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Non-main PR Secret Scan
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: v8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  # pragma: allowlist secret
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan PR commits with gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --log-opts="${BASE_SHA}..HEAD"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0
      - name: Scan for new secrets against baseline
        run: |
          set +e
          # shellcheck disable=SC2046
          detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-files '.*\.lock$' \
            --exclude-files '.*package-lock\.json$' \
            --exclude-files '\.secrets\.baseline$' \
            $(git ls-files)
          hook_status=$?
          set -e
          case "$hook_status" in
            0) exit 0 ;;
            3) python3 scripts/check_secrets_baseline_drift.py ;;
            *) exit "$hook_status" ;;
          esac
