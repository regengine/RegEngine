name: Engine Review Pass

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]

concurrency:
  group: engine-review-pass-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  issues: read
  statuses: write
  contents: read

jobs:
  engine-review-pass:
    name: Engine Review Pass
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify engine review pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName === 'issue_comment' && !context.payload.issue?.pull_request) {
              core.info('Issue comment is not on a pull request. Skipping.');
              return;
            }

            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            if (!prNumber) {
              core.setFailed('Could not determine pull request number from event payload.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function setCommitStatus(sha, state, description) {
              try {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha,
                  state,
                  context: 'Engine Review Pass',
                  description: description.slice(0, 140),
                  target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
                });
                core.info(`Created commit status '${state}' on ${sha}: ${description}`);
              } catch (err) {
                core.warning(`Failed to create commit status on ${sha}: ${err.message}`);
              }
            }

            let headSha;

            try {
              core.info(`Fetching pull request #${prNumber}...`);
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });

              headSha = pr.head.sha;
              const prBody = (pr.body || '').replace(/\r\n/g, '\n');
              core.info(`Head SHA: ${headSha}`);

              const { data: commitData } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: headSha,
              });

              const committerDateStr = commitData.commit?.committer?.date;
              if (!committerDateStr) {
                const msg = `Unable to determine committer date for head commit ${headSha}`;
                await setCommitStatus(headSha, 'failure', msg);
                core.setFailed(msg);
                return;
              }

              const headCommitDate = new Date(committerDateStr);
              const headCommitTime = headCommitDate.getTime();
              core.info(`Head commit date (committer): ${headCommitDate.toISOString()} (${headCommitTime})`);

              const authorEngineRegex = /^Author-Engine:\s*(\S+)\s*$/m;
              const authorEngineMatch = prBody.match(authorEngineRegex);

              if (!authorEngineMatch) {
                const msg = 'Missing Author-Engine line in PR body matching /^Author-Engine:\\s*(\\S+)\\s*$/m';
                await setCommitStatus(headSha, 'failure', msg);
                core.setFailed(msg);
                return;
              }

              const authorEngine = authorEngineMatch[1].trim();
              core.info(`Author-Engine: ${authorEngine}`);

              core.info('Collecting reviews, issue comments, and review comments...');
              const [reviews, issueComments, reviewComments] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                }),
              ]);

              core.info(`Total items retrieved: ${reviews.length} reviews, ${issueComments.length} issue comments, ${reviewComments.length} review comments.`);

              const candidateItems = [];
              const staleItems = [];
              let candidateReviewsCount = 0;
              let candidateIssueCommentsCount = 0;
              let candidateReviewCommentsCount = 0;

              for (const r of reviews) {
                if (r.state === 'DISMISSED') continue;
                const dateStr = r.updated_at || r.submitted_at || r.created_at;
                if (!dateStr || !r.body) continue;
                const time = new Date(dateStr).getTime();
                const item = {
                  type: 'pull_request_review',
                  id: r.id,
                  user: r.user?.login || 'unknown',
                  date: dateStr,
                  time,
                  body: r.body.replace(/\r\n/g, '\n'),
                };
                if (time > headCommitTime) {
                  candidateItems.push(item);
                  candidateReviewsCount++;
                } else {
                  staleItems.push(item);
                }
              }

              for (const c of issueComments) {
                const dateStr = c.updated_at || c.created_at;
                if (!dateStr || !c.body) continue;
                const time = new Date(dateStr).getTime();
                const item = {
                  type: 'issue_comment',
                  id: c.id,
                  user: c.user?.login || 'unknown',
                  date: dateStr,
                  time,
                  body: c.body.replace(/\r\n/g, '\n'),
                };
                if (time > headCommitTime) {
                  candidateItems.push(item);
                  candidateIssueCommentsCount++;
                } else {
                  staleItems.push(item);
                }
              }

              for (const rc of reviewComments) {
                const dateStr = rc.updated_at || rc.created_at;
                if (!dateStr || !rc.body) continue;
                const time = new Date(dateStr).getTime();
                const item = {
                  type: 'pull_request_review_comment',
                  id: rc.id,
                  user: rc.user?.login || 'unknown',
                  date: dateStr,
                  time,
                  body: rc.body.replace(/\r\n/g, '\n'),
                };
                if (time > headCommitTime) {
                  candidateItems.push(item);
                  candidateReviewCommentsCount++;
                } else {
                  staleItems.push(item);
                }
              }

              core.info(`Eligible items created/updated after head commit date: ${candidateItems.length}`);

              const passRegex = /^Review: PASS by (\S+) at ([0-9a-f]{7,40})\s*$/;
              const headShaLower = headSha.toLowerCase();
              const authorEngineLower = authorEngine.toLowerCase();

              let passingReview = null;
              const evaluatedMatches = [];
              const otherReviewLines = [];

              for (const item of candidateItems) {
                const lines = item.body.split('\n');
                for (const line of lines) {
                  const match = line.match(passRegex);
                  if (match) {
                    const reviewerEngine = match[1];
                    const reviewerSha = match[2];
                    const reviewerShaLower = reviewerSha.toLowerCase();
                    const engineDiffers = reviewerEngine.toLowerCase() !== authorEngineLower;
                    const shaMatches = reviewerSha.length >= 7 && headShaLower.startsWith(reviewerShaLower);

                    if (engineDiffers && shaMatches) {
                      passingReview = {
                        engine: reviewerEngine,
                        sha: reviewerSha,
                        item,
                        line,
                      };
                      break;
                    } else {
                      const reasons = [];
                      if (!engineDiffers) {
                        reasons.push(`engine '${reviewerEngine}' matches Author-Engine '${authorEngine}' (must differ, case-insensitive)`);
                      }
                      if (!shaMatches) {
                        reasons.push(`sha '${reviewerSha}' is not a prefix of current head sha '${headSha}'`);
                      }
                      evaluatedMatches.push({
                        line,
                        itemType: item.type,
                        user: item.user,
                        date: item.date,
                        reasons: reasons.join('; '),
                      });
                    }
                  } else if (/^Review:\s*/i.test(line)) {
                    otherReviewLines.push({
                      line,
                      itemType: item.type,
                      user: item.user,
                      date: item.date,
                    });
                  }
                }
                if (passingReview) {
                  break;
                }
              }

              if (passingReview) {
                const successMsg = `Review: PASS by ${passingReview.engine} at ${passingReview.sha}`;
                core.info(`Engine review passed! Found passing review in ${passingReview.item.type} by ${passingReview.item.user}:`);
                core.info(`  ${passingReview.line}`);
                await setCommitStatus(headSha, 'success', successMsg);
                return;
              }

              const staleReviewLines = [];
              for (const item of staleItems) {
                const lines = item.body.split('\n');
                for (const line of lines) {
                  if (passRegex.test(line)) {
                    staleReviewLines.push({
                      line,
                      itemType: item.type,
                      user: item.user,
                      date: item.date,
                    });
                  }
                }
              }

              const failureLines = [
                'Engine Review Pass: FAILED',
                `Author-Engine: ${authorEngine}`,
                `Current head SHA: ${headSha}`,
                `Head commit date: ${headCommitDate.toISOString()}`,
                `Eligible items considered (created/updated after head commit date): ${candidateItems.length} (${candidateReviewsCount} reviews, ${candidateIssueCommentsCount} issue comments, ${candidateReviewCommentsCount} review comments)`,
              ];

              if (evaluatedMatches.length > 0) {
                failureLines.push('');
                failureLines.push('Candidate Review: PASS lines evaluated but rejected:');
                for (const m of evaluatedMatches) {
                  failureLines.push(`  - [${m.itemType} by ${m.user} on ${m.date}] "${m.line}": ${m.reasons}`);
                }
              }

              if (otherReviewLines.length > 0) {
                failureLines.push('');
                failureLines.push('Other Review: lines found after head commit date:');
                for (const r of otherReviewLines) {
                  failureLines.push(`  - [${r.itemType} by ${r.user} on ${r.date}] "${r.line}"`);
                }
              }

              if (staleReviewLines.length > 0) {
                failureLines.push('');
                failureLines.push('Stale Review: PASS lines found before head commit date (ignored):');
                for (const s of staleReviewLines) {
                  failureLines.push(`  - [${s.itemType} by ${s.user} on ${s.date}] "${s.line}" (before head commit)`);
                }
              }

              if (evaluatedMatches.length === 0 && otherReviewLines.length === 0 && staleReviewLines.length === 0) {
                failureLines.push('');
                failureLines.push('No Review lines found in PR reviews or comments.');
              }

              const detailedMsg = failureLines.join('\n');
              const statusDesc = evaluatedMatches.length > 0
                ? 'Review: PASS rejected (engine or SHA mismatch)'
                : 'No passing review found for current head SHA';

              await setCommitStatus(headSha, 'failure', statusDesc);
              core.setFailed(detailedMsg);

            } catch (err) {
              core.error(`Unexpected error: ${err.message}`);
              if (headSha) {
                await setCommitStatus(headSha, 'failure', `Error: ${err.message}`.slice(0, 140));
              }
              core.setFailed(err.message);
            }
