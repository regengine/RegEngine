name: Demo Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'RegEngine web URL to smoke test'
        required: true
        default: 'https://regengine.co'
      tenant_id:
        description: 'Tenant UUID to scope the smoke to (defaults to the DEMO_SMOKE_TENANT_ID secret)'
        required: false
        default: ''
      commit_mode:
        description: 'Commit gate mode to verify'
        required: true
        default: 'preflight'
        type: choice
        options:
          - simulation
          - preflight
          - staging
          - production_evidence
      allow_production_evidence:
        description: 'Allow production_evidence mode. Keep false for routine demo smoke.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: demo-smoke-${{ github.event.inputs.base_url }}
  cancel-in-progress: false

jobs:
  demo-smoke:
    name: Inflow Workbench demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify demo credentials are configured
        env:
          DEMO_SMOKE_API_KEY: ${{ secrets.DEMO_SMOKE_API_KEY }}
          DEMO_SMOKE_TENANT_ID: ${{ inputs.tenant_id || secrets.DEMO_SMOKE_TENANT_ID }}
        run: |
          # The passwordless demo smoke runs in api-key mode against live
          # targets: it needs a pre-provisioned inflow-scoped API key plus the
          # tenant to scope the workbench loop to.
          # Email-OTP login is local-only (the OTP outbox is forbidden in
          # production), so no email/password secrets are involved.
          test -n "$DEMO_SMOKE_API_KEY" || { echo "Missing pre-provisioned DEMO_SMOKE_API_KEY secret"; exit 1; }
          test -n "$DEMO_SMOKE_TENANT_ID" || { echo "Missing tenant_id input or DEMO_SMOKE_TENANT_ID secret"; exit 1; }

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run demo smoke
        env:
          DEMO_SMOKE_BASE_URL: ${{ inputs.base_url }}
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          DEMO_SMOKE_API_KEY: ${{ secrets.DEMO_SMOKE_API_KEY }}
          DEMO_SMOKE_TENANT_ID: ${{ inputs.tenant_id || secrets.DEMO_SMOKE_TENANT_ID }}
          DEMO_SMOKE_COMMIT_MODE: ${{ inputs.commit_mode }}
          DEMO_SMOKE_ALLOW_PRODUCTION_EVIDENCE: ${{ inputs.allow_production_evidence }}
        run: |
          cd frontend
          npm run test:demo-smoke

      - name: Upload demo smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: demo-smoke-results
          path: |
            frontend/playwright-report/demo-smoke
            frontend/test-results
          if-no-files-found: ignore
