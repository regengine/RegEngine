# Re-runs a "PR Gate: Frontend" job that gave up while Frontend CI/CD was
# still queued. pr-gate.yml polls for "Frontend CI Status Gate" for at most
# 12 minutes; when the runner queue is backed up the gate may not exist yet.
# Once Frontend CI/CD finishes for the same head SHA, this workflow recovers
# the failed PR Gate: Frontend job so the gate mirrors the real result.
# This also covers a gate that timed out just after Frontend CI completed.
#
# IMPORTANT: we first wait for the parent PR Gate run to finish, then re-run
# its FAILED JOBS (not a single job) via reRunWorkflowFailedJobs so that both
# "PR Gate: Frontend" and the dependent "CI Status Gate" recover together. A
# single-job re-run would leave CI Status Gate red, and re-running while the
# PR Gate run is still queued/running returns 403 "already running" -- that
# already-running race is exactly what this workflow fixes, so a 403 is
# treated as "still running" and we keep waiting.
# Skips SHAs that are no longer the PR head and stops after run attempt 3.
#
# Runs on the default branch (workflow_run) and never checks out PR code.
name: PR Gate Frontend Rerun

on:
  workflow_run:
    workflows: ["Frontend CI/CD"]
    types: [completed]

permissions: {}

concurrency:
  group: pr-gate-frontend-rerun-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  rerun:
    name: "Re-run PR Gate: Frontend"
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: "Re-run a failed PR Gate: Frontend job for this head SHA"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.HEAD_SHA;
            // Skip stale SHAs: only re-run when this SHA is still the PR head,
            // so an old run can never cancel the current head's gate.
            let prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              const assoc = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: sha,
              });
              prs = assoc.data.filter(p => p.state === 'open');
            }
            let isCurrentHead = false;
            for (const p of prs) {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: p.number });
              if (pr.data.state === 'open' && pr.data.head.sha === sha) {
                isCurrentHead = true;
                break;
              }
            }
            if (!isCurrentHead) {
              core.info(`${sha} is not the current head of an open PR; skipping re-run.`);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: sha, event: 'pull_request', per_page: 50,
            });
            const gateRuns = runs.data.workflow_runs
              .filter(r => r.name === 'PR Gate')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (gateRuns.length === 0) {
              core.info(`No PR Gate run for ${sha}; nothing to re-run.`);
              return;
            }
            const latest = gateRuns[0];
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: latest.id, filter: 'latest', per_page: 100,
            });
            const job = jobs.data.jobs.find(j => j.name === 'PR Gate: Frontend');
            if (!job) {
              core.info(`PR Gate run ${latest.id} has no PR Gate: Frontend job.`);
              return;
            }
            if (job.status !== 'completed' || !['failure', 'timed_out', 'cancelled'].includes(job.conclusion)) {
              core.info(`PR Gate: Frontend is ${job.status}/${job.conclusion}; no re-run needed.`);
              return;
            }
            // Cap re-runs so a persistently failing gate can't loop.
            if ((latest.run_attempt || 1) >= 3) {
              core.info(`PR Gate run ${latest.id} is already on attempt ${latest.run_attempt}; not re-running again.`);
              return;
            }
            const sleep = (ms) => new Promise(res => setTimeout(res, ms));
            // Wait for the parent PR Gate run to finish before re-running. The
            // run that contains the failed Frontend job also still has queued/
            // running jobs (e.g. CI Status Gate); re-running now yields 403
            // "already running". Poll getWorkflowRun until it's completed.
            const WAIT_DEADLINE_MS = 90 * 60 * 1000; // 90 minutes
            const waitStart = Date.now();
            let runCompleted = false;
            while (Date.now() - waitStart < WAIT_DEADLINE_MS) {
              const cur = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: latest.id,
              });
              if (cur.data.status === 'completed') {
                core.info(`PR Gate run ${latest.id} is completed (${cur.data.conclusion}).`);
                runCompleted = true;
                break;
              }
              const waitedMin = Math.round((Date.now() - waitStart) / 60000);
              core.info(`PR Gate run ${latest.id} is ${cur.data.status}; waited ${waitedMin}m, polling again.`);
              await sleep(45000); // 45s between polls (30-60s range)
            }
            if (!runCompleted) {
              core.setFailed(`PR Gate run ${latest.id} did not complete within 90 minutes; not re-running.`);
              return;
            }

            // Re-check that the Frontend job is still a failure after the wait;
            // it may have recovered on its own while we waited.
            const jobs2 = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: latest.id, filter: 'latest', per_page: 100,
            });
            const job2 = jobs2.data.jobs.find(j => j.name === 'PR Gate: Frontend');
            if (!job2) {
              core.info(`PR Gate run ${latest.id} no longer has a PR Gate: Frontend job.`);
              return;
            }
            if (job2.status !== 'completed' || !['failure', 'timed_out', 'cancelled'].includes(job2.conclusion)) {
              core.info(`PR Gate: Frontend recovered (${job2.status}/${job2.conclusion}); no re-run needed.`);
              return;
            }

            // Re-run failed jobs (not a single job) so the dependent
            // CI Status Gate recovers too. If the run is somehow still
            // running, GitHub returns 403 "already running" -- treat that as
            // still-running and keep polling until the deadline.
            core.info(`Re-running failed jobs for PR Gate run ${latest.id} (${sha}).`);
            while (Date.now() - waitStart < WAIT_DEADLINE_MS) {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner, repo, run_id: latest.id,
                });
                core.info(`Re-ran failed jobs for PR Gate run ${latest.id}.`);
                return;
              } catch (err) {
                const alreadyRunning = err.status === 403 &&
                  /already running/i.test(err.message || '');
                if (!alreadyRunning) {
                  throw err;
                }
                const waitedMin = Math.round((Date.now() - waitStart) / 60000);
                core.info(`PR Gate run ${latest.id} still running (403); waited ${waitedMin}m, retrying.`);
                await sleep(45000);
              }
            }
            core.setFailed(`PR Gate run ${latest.id} stayed "already running" past 90 minutes; not re-running.`);
