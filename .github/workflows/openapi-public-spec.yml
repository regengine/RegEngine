name: Public OpenAPI Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/lib/public-openapi.ts'
      - 'frontend/src/app/openapi.json/**'
      - 'frontend/src/app/api/openapi.json/**'
      - 'frontend/src/app/docs/**'
      - 'frontend/src/__tests__/lib/public-openapi.test.ts'
      - 'frontend/package-lock.json'
      - '.github/workflows/openapi-public-spec.yml'
  push:
    branches: [main, develop]
    paths:
      - 'frontend/src/lib/public-openapi.ts'
      - 'frontend/src/app/openapi.json/**'
      - 'frontend/src/app/api/openapi.json/**'
      - 'frontend/src/app/docs/**'
      - 'frontend/src/__tests__/lib/public-openapi.test.ts'
      - 'frontend/package-lock.json'
      - '.github/workflows/openapi-public-spec.yml'

permissions:
  contents: read

concurrency:
  group: openapi-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-check:
    name: Public contract check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify both public OpenAPI URLs
        working-directory: frontend
        run: npm test -- --run src/__tests__/lib/public-openapi.test.ts
