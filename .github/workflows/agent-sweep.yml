name: Agent Sweep - Manual Audits

on:
  workflow_dispatch:
    inputs:
      sweep_type:
        description: 'Sweep type to run'
        required: true
        default: 'full-audit'
        type: choice
        options:
          - security
          - ui-drift
          - infra-health
          - full-audit

permissions:
  contents: read
  issues: write

jobs:
  # ── Bot-Security: Manual Security Sweep ──────────────────
  security-sweep:
    name: 🔒 Bot-Security Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event.inputs.sweep_type == 'security' ||
      github.event.inputs.sweep_type == 'full-audit'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Scan for hardcoded secrets
        run: |
          echo "## 🔒 Bot-Security Sweep Results" > security-report.md
          echo "" >> security-report.md
          echo "### Secrets Scan" >> security-report.md

          # Issue #2925: this step used to append the WHOLE matching line —
          # credential value included — to security-report.md, which is
          # uploaded as an artifact and pasted verbatim into the body of a
          # GitHub issue readable by everyone with repo read. A secret scanner
          # that republishes the secret it finds, somewhere a history rewrite
          # cannot scrub. Everything below emits location + matched KEY NAME
          # only; the value never leaves the runner's protected logs.

          # Check for common secret patterns
          RAW=$(grep -rn --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
            -E "(password\s*=\s*['\"][^'\"]+['\"]|api_key\s*=\s*['\"][^'\"]+['\"]|secret\s*=\s*['\"][^'\"]+['\"])" \
            services/ shared/ frontend/src/ 2>/dev/null | grep -v "test" | grep -v "__pycache__" || true)

          # Redact before anything is written to a publishable file. Keeps
          # `path:line: <key> = <redacted>`; drops the literal entirely.
          FINDINGS=$(echo "$RAW" | sed -E "s/(=[[:space:]]*)['\"][^'\"]*['\"]/\1<redacted>/g")

          if [ -n "$RAW" ]; then
            echo "⚠️ Potential hardcoded secrets found (values redacted — see the run's protected logs, never this report):" >> security-report.md
            echo '```' >> security-report.md
            echo "$FINDINGS" >> security-report.md
            echo '```' >> security-report.md
          else
            echo "✅ No hardcoded secrets detected." >> security-report.md
          fi

      - name: Check for print statements (should use logger)
        run: |
          echo "" >> security-report.md
          echo "### Print Statement Audit" >> security-report.md

          # Issue #2925: this matched 109 lines, ALL of them inside
          # services/*/scripts/ — operator CLI tools (bootstrap_auth,
          # verify_audit_pack, build_hierarchy) whose stdout IS the user
          # interface. Zero were in a request path. So the ⚠️ was permanent
          # noise and, together with the tenant-isolation step below, fired
          # the issue-creation path on every dispatch. Excluding scripts/
          # leaves the check able to catch what it is actually for: a print()
          # reaching a served code path instead of structlog.
          PRINTS=$(grep -rn --include="*.py" "^\s*print(" services/ shared/ 2>/dev/null \
            | grep -v "test" | grep -v "__pycache__" | grep -vE "/scripts?/" || true)

          if [ -n "$PRINTS" ]; then
            echo "⚠️ Found print() statements (should use structlog):" >> security-report.md
            echo '```' >> security-report.md
            echo "$PRINTS" | head -20 >> security-report.md
            echo '```' >> security-report.md
          else
            echo "✅ No print() statements found in production code." >> security-report.md
          fi

      - name: Check tenant isolation
        run: |
          echo "" >> security-report.md
          echo "### Tenant Isolation Check" >> security-report.md

          # Issue #2925: this used to grep for "execute\|raw_sql\|text(" and
          # emit a ⚠️ for every hit. Run verbatim against the tree that is
          # 1327 lines — every `db.execute(text("SELECT 1"))` health probe,
          # every advisory lock, every parameterised query whose tenant
          # predicate simply sits on the next line. So the ⚠️ marker was
          # unconditionally present and the `gh issue create` step below fired
          # on EVERY dispatch with a body of pure noise. Worse, that made the
          # (then unredacted) secrets section publish on every run too.
          #
          # A line-oriented grep cannot decide tenant scoping, and pretending
          # otherwise is what produced the noise. Tenant isolation is enforced
          # by Postgres RLS since the #2461 cutover and is gated for real by
          # tests/migrations/test_rls_coverage.py, tests/test_e2e_tenant_isolation.py
          # and services/shared/tests/test_rls_enforcement_live.py, all of which
          # run against a live database in backend-ci. This step now reports a
          # count for orientation and raises no finding of its own.
          RAW_SQL_COUNT=$(grep -rn --include="*.py" -E "\.execute\(|text\(" services/ 2>/dev/null \
            | grep -v "__pycache__" | grep -vE "/tests?/|test_" | wc -l | tr -d ' ')

          echo "ℹ️ $RAW_SQL_COUNT raw-SQL call sites in services/ (informational)." >> security-report.md
          echo "" >> security-report.md
          echo "Tenant scoping is enforced by Postgres RLS (#2461), not by the shape of these call sites." >> security-report.md
          echo "The blocking gates are \`tests/migrations/test_rls_coverage.py\`, \`tests/test_e2e_tenant_isolation.py\`" >> security-report.md
          echo "and \`services/shared/tests/test_rls_enforcement_live.py\` in backend-ci — check those, not this count." >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: security-sweep-report
          path: security-report.md
          # #2925: 90 days was a long retention window for a file built out of
          # candidate-credential text. Values are redacted at the source now,
          # but keep the window short as defence in depth — the report is a
          # triage aid, not a record.
          retention-days: 7

      - name: Create issue if findings
        run: |
          if grep -q "⚠️" security-report.md; then
            BODY=$(cat security-report.md)
            gh issue create \
              --title "🔒 [Bot-Security] Manual Sweep - Findings $(date +%Y-%m-%d)" \
              --body "$BODY" \
              --label "agent-task,security,agent:security"
          else
            echo "✅ No findings — no issue created."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Bot-UI: Manual UI Drift Check ────────────────────────
  ui-drift-check:
    name: 🎨 Bot-UI Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event.inputs.sweep_type == 'ui-drift' ||
      github.event.inputs.sweep_type == 'full-audit'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Scan for inline styles
        run: |
          echo "## 🎨 Bot-UI Drift Check Results" > ui-report.md
          echo "" >> ui-report.md

          # Check for inline style={{}} in React components
          INLINE=$(grep -rn --include="*.tsx" --include="*.jsx" "style={{" frontend/src/ 2>/dev/null \
            | grep -v "node_modules" || true)

          echo "### Inline Styles" >> ui-report.md
          if [ -n "$INLINE" ]; then
            echo "⚠️ Inline styles detected (should use Tailwind classes):" >> ui-report.md
            echo '```' >> ui-report.md
            echo "$INLINE" | head -20 >> ui-report.md
            echo '```' >> ui-report.md
          else
            echo "✅ No inline styles found." >> ui-report.md
          fi

      - name: Scan for hardcoded colors
        run: |
          echo "" >> ui-report.md
          echo "### Hardcoded Colors" >> ui-report.md

          COLORS=$(grep -rn --include="*.tsx" --include="*.jsx" --include="*.css" \
            -E "#[0-9a-fA-F]{3,8}|rgb\(|rgba\(" frontend/src/ 2>/dev/null \
            | grep -v "node_modules" | grep -v "globals.css" | grep -v "tailwind" || true)

          if [ -n "$COLORS" ]; then
            echo "⚠️ Hardcoded colors found (should use CSS variables/tokens):" >> ui-report.md
            echo '```' >> ui-report.md
            echo "$COLORS" | head -20 >> ui-report.md
            echo '```' >> ui-report.md
          else
            echo "✅ No hardcoded colors found." >> ui-report.md
          fi

      - name: Upload UI report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ui-drift-report
          path: ui-report.md
          retention-days: 90

      - name: Create issue if findings
        run: |
          if grep -q "⚠️" ui-report.md; then
            BODY=$(cat ui-report.md)
            gh issue create \
              --title "🎨 [Bot-UI] Manual Drift Check - Findings $(date +%Y-%m-%d)" \
              --body "$BODY" \
              --label "agent-task,frontend,agent:ui"
          else
            echo "✅ No drift detected — no issue created."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Bot-Infra: Monthly Infrastructure Health ─────────────
  infra-health:
    name: 🏗️ Bot-Infra Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.sweep_type == 'infra-health' ||
       github.event.inputs.sweep_type == 'full-audit')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Check Dockerfile best practices
        run: |
          echo "## 🏗️ Bot-Infra Health Check Results" > infra-report.md
          echo "" >> infra-report.md
          echo "### Dockerfile Audit" >> infra-report.md

          # Issue #2888: this audit used to glob services/*/Dockerfile. Those
          # files no longer exist (the services were consolidated into the root
          # Dockerfile), and without nullglob an unmatched glob stays LITERAL —
          # so every run emitted a fabricated "⚠️ * : Missing HEALTHCHECK" and
          # tripped the issue-filing step below on every single sweep.
          shopt -s nullglob
          # Patterns containing glob characters expand to nothing when they
          # match no files; plain literals are not subject to nullglob, so the
          # existence guard below still has to filter them.
          CANDIDATES=(Dockerfile frontend/Dockerfile services/*/Dockerfile)
          DOCKERFILES=()
          for df in "${CANDIDATES[@]}"; do
            if [ -f "$df" ]; then
              DOCKERFILES+=("$df")
            fi
          done

          if [ ${#DOCKERFILES[@]} -eq 0 ]; then
            echo "⚠️ No Dockerfiles found at any known path — the audit targets have drifted." >> infra-report.md
          else
            echo "Auditing: ${DOCKERFILES[*]}" >> infra-report.md
            echo "" >> infra-report.md

            # Check for 'latest' tags
            LATEST=$(grep -Hn "FROM.*:latest" "${DOCKERFILES[@]}" || true)

            if [ -n "$LATEST" ]; then
              echo "⚠️ Found ':latest' tags (pin specific versions):" >> infra-report.md
              echo '```' >> infra-report.md
              echo "$LATEST" >> infra-report.md
              echo '```' >> infra-report.md
            else
              echo "✅ All Dockerfile base images use pinned versions." >> infra-report.md
            fi

            # Check for HEALTHCHECK
            echo "" >> infra-report.md
            echo "### Health Check Coverage" >> infra-report.md

            for df in "${DOCKERFILES[@]}"; do
              if grep -q "HEALTHCHECK" "$df"; then
                echo "- ✅ $df: HEALTHCHECK defined" >> infra-report.md
              else
                echo "- ⚠️ $df: Missing HEALTHCHECK" >> infra-report.md
              fi
            done
          fi

      - name: Upload infra report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: infra-health-report
          path: infra-report.md
          retention-days: 90

      - name: Create issue if findings
        run: |
          if grep -q "⚠️" infra-report.md; then
            BODY=$(cat infra-report.md)
            gh issue create \
              --title "🏗️ [Bot-Infra] Health Check — Findings $(date +%Y-%m-%d)" \
              --body "$BODY" \
              --label "agent-task,agent:infra"
          else
            echo "✅ All infra checks passed — no issue created."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
