name: QA Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# Issue #2875: no job in this workflow uses the GITHUB_TOKEN — no gh CLI, no
# github-script, no check-run or PR-comment action — so checks:write and
# pull-requests:write were unused write scope on every run.
permissions:
  contents: read

jobs:
  # ── Stage 1: Fast Gate ─────────────────────────────────
  fast-gate:
    name: Fast Gate (unit + FSMA + tenant)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc

      # Frontend CI owns Vitest and enforces coverage thresholds. These QA
      # checks use only Node built-ins; keep the existing job/check name for
      # consumers without repeating the dependency install and unit suite.

      - name: FSMA 204 compliance checks
        run: node qa/fsma-lite-check.js

      # #2824: renamed. This step is a static text scan of frontend sources --
      # credential hygiene and auth-wiring conventions. It does NOT verify
      # tenant isolation, which is enforced by PostgreSQL RLS policies that a
      # .tsx scan cannot see. Real isolation coverage runs in backend-ci.
      - name: Frontend security scan (credentials, auth patterns)
        run: node qa/frontend-security-scan.js

  # ── Stage 2: System Simulation ─────────────────────────
  system-sim:
    name: System Simulation (flow + bad data + export)
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc

      - name: Full ingestion-to-export flow
        run: node qa/full-flow.js

      - name: Bad data rejection
        run: node qa/bad-data.js

      - name: Export artifact validation
        run: node qa/export-validate.js

  # ── Stage 3: AI Analysis ───────────────────────────────
  # Advisory-only: copy, pricing, and credibility warnings for human
  # follow-up. Its result is intentionally NOT in decision.needs, so a
  # failing analysis never blocks deploy. Only fast-gate and system-sim
  # failures block.
  ai-analysis:
    name: AI Content Analysis
    needs: system-sim
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc

      - name: Run AI analysis
        run: node qa/ai-analysis.js

  # ── Stage 4: Decision Gate ─────────────────────────────
  decision:
    name: Deploy Decision
    # Still runs when a stage failed, so decision.js can block deploy.
    # Skip only when the workflow itself was cancelled (a newer push on the
    # same ref). `cancelled()` is the workflow-cancel signal, not a failed
    # dependency: a timed-out or otherwise cancelled stage still reaches
    # decision.js and blocks. A superseded run must not post BLOCK DEPLOY
    # for a stage that never finished.
    if: always() && !cancelled()
    # ai-analysis is advisory-only and intentionally excluded here, so its
    # failures never block deploy. See the ai-analysis job comment above.
    needs: [fast-gate, system-sim]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc

      - name: Run decision gate
        env:
          FAST_GATE_RESULT: ${{ needs.fast-gate.result }}
          SYSTEM_SIM_RESULT: ${{ needs.system-sim.result }}
        run: node qa/decision.js
