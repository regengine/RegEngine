# GITHUB_TOKEN pushes do not trigger other workflows, so CI on the merged commit needs a later push or re-run.
#
# This workflow updates open, non-draft PR branches within this repository
# whenever changes land on main, using GitHub's REST endpoint to create
# a merge commit (never rebasing or force-pushing).

name: Sync main into PRs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-main-into-prs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-main-into-prs:
    name: Sync main into PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync main into open pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`.toLowerCase();
            const MARKER = '<!-- sync-main-conflict -->';

            core.info(`Fetching open pull requests targeting main for ${owner}/${repo}...`);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            core.info(`Found ${pulls.length} total open pull request(s) targeting main.`);

            const candidatePRs = pulls.filter((pr) => {
              if (pr.draft) {
                core.info(`Skipping PR #${pr.number}: draft PR.`);
                return false;
              }
              if (!pr.base || pr.base.ref !== 'main') {
                core.info(`Skipping PR #${pr.number}: base is '${pr.base ? pr.base.ref : 'unknown'}', not 'main'.`);
                return false;
              }
              if (!pr.head || !pr.head.repo) {
                core.info(`Skipping PR #${pr.number}: head repository is missing or deleted.`);
                return false;
              }
              const headFullName = (pr.head.repo.full_name || '').toLowerCase();
              if (headFullName !== repoFullName) {
                core.info(`Skipping PR #${pr.number}: head repo '${headFullName}' is a fork (not '${repoFullName}').`);
                return false;
              }
              return true;
            });

            core.info(`Identified ${candidatePRs.length} candidate PR(s) to synchronize.`);

            const summary = {
              updated: [],
              upToDate: [],
              conflicts: [],
              errors: [],
            };

            for (const pr of candidatePRs) {
              const prNumber = pr.number;
              const branchName = pr.head.ref;
              const currentHeadSha = pr.head.sha;
              const prTitle = pr.title;

              core.info(`Processing PR #${prNumber} (${branchName})...`);

              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: prNumber,
                  expected_head_sha: currentHeadSha,
                });

                core.info(`PR #${prNumber} (${branchName}): branch successfully updated.`);
                summary.updated.push({ number: prNumber, branch: branchName, title: prTitle });
              } catch (error) {
                const status = error.status;
                const errorData = error.response?.data;
                const errorMessage = errorData?.message || error.message || '';
                const rawError = JSON.stringify(errorData || errorMessage);

                const isAlreadyUpToDate =
                  status === 422 &&
                  (/not behind|no new commits|already up to date/i.test(errorMessage) ||
                   /not behind|no new commits|already up to date/i.test(rawError));

                const isHeadModified =
                  status === 422 &&
                  (/modified|sha/i.test(errorMessage) || /modified|sha/i.test(rawError));

                const isConflict =
                  status === 422 &&
                  !isAlreadyUpToDate &&
                  !isHeadModified;

                if (isAlreadyUpToDate) {
                  core.info(`PR #${prNumber} (${branchName}): already up to date with main.`);
                  summary.upToDate.push({ number: prNumber, branch: branchName, title: prTitle });
                } else if (isConflict) {
                  core.warning(`PR #${prNumber} (${branchName}): merge conflict detected.`);
                  summary.conflicts.push({ number: prNumber, branch: branchName, title: prTitle, message: errorMessage });

                  const commentBody = [
                    MARKER,
                    '### Merge Conflict with main',
                    '',
                    `Branch \`${branchName}\` encountered a merge conflict when attempting to automatically sync with \`main\`.`,
                    '',
                    'Main conflicts with this branch, and a person must resolve it.',
                    '',
                    'Please resolve the conflict manually and push an updated branch:',
                    '```bash',
                    `git checkout ${branchName}`,
                    'git fetch origin main',
                    'git merge origin/main',
                    '# resolve conflicts and commit',
                    `git push origin ${branchName}`,
                    '```',
                    '',
                    `*Last attempted sync: ${new Date().toISOString()}*`,
                  ].join('\n');

                  try {
                    const comments = await github.paginate(github.rest.issues.listComments, {
                      owner,
                      repo,
                      issue_number: prNumber,
                      per_page: 100,
                    });

                    const existingComment = comments.find(
                      (c) => c.body && c.body.includes(MARKER)
                    );

                    if (existingComment) {
                      core.info(`PR #${prNumber}: updating existing conflict marker comment (id: ${existingComment.id}).`);
                      await github.rest.issues.updateComment({
                        owner,
                        repo,
                        comment_id: existingComment.id,
                        body: commentBody,
                      });
                    } else {
                      core.info(`PR #${prNumber}: creating new conflict marker comment.`);
                      await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: prNumber,
                        body: commentBody,
                      });
                    }
                  } catch (commentError) {
                    core.error(`PR #${prNumber}: failed to post or update conflict comment: ${commentError.message}`);
                  }
                } else {
                  core.error(`PR #${prNumber} (${branchName}): failed to update branch (status ${status}): ${errorMessage}`);
                  summary.errors.push({ number: prNumber, branch: branchName, title: prTitle, status, message: errorMessage });
                }
              }
            }

            core.info('');
            core.info('========================================');
            core.info('       Sync Main into PRs Summary       ');
            core.info('========================================');
            core.info(`Total open PRs checked: ${pulls.length}`);
            core.info(`Candidate PRs evaluated: ${candidatePRs.length}`);
            core.info(`Successfully updated: ${summary.updated.length}`);
            core.info(`Already up to date: ${summary.upToDate.length}`);
            core.info(`Merge conflicts: ${summary.conflicts.length}`);
            core.info(`Errors encountered: ${summary.errors.length}`);
            core.info('========================================');

            let summaryMd = '## Sync Main into PRs Summary\n\n';
            summaryMd += '| Metric | Count |\n|---|---|\n';
            summaryMd += `| Total open PRs evaluated | ${pulls.length} |\n`;
            summaryMd += `| Candidates eligible for sync | ${candidatePRs.length} |\n`;
            summaryMd += `| Successfully updated | ${summary.updated.length} |\n`;
            summaryMd += `| Already up to date | ${summary.upToDate.length} |\n`;
            summaryMd += `| Merge conflicts | ${summary.conflicts.length} |\n`;
            summaryMd += `| Errors | ${summary.errors.length} |\n\n`;

            if (summary.updated.length > 0) {
              summaryMd += '### Updated Branches\n\n';
              for (const p of summary.updated) {
                summaryMd += `- PR #${p.number} (\`${p.branch}\`): ${p.title}\n`;
              }
              summaryMd += '\n';
            }

            if (summary.conflicts.length > 0) {
              summaryMd += '### Conflicts Alerted\n\n';
              for (const p of summary.conflicts) {
                summaryMd += `- PR #${p.number} (\`${p.branch}\`): ${p.title}\n`;
              }
              summaryMd += '\n';
            }

            if (summary.errors.length > 0) {
              summaryMd += '### Errors Encountered\n\n';
              for (const p of summary.errors) {
                summaryMd += `- PR #${p.number} (\`${p.branch}\`): ${p.message || p.status}\n`;
              }
              summaryMd += '\n';
            }

            await core.summary.addRaw(summaryMd).write();
