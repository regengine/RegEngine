# Pre-commit hooks for RegEngine
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Lint + format (ruff replaces black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Standard code quality hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Secret detection
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets (new findings only)
        entry: scripts/ci/check_secrets_baseline.sh
        language: python
        additional_dependencies: ["detect-secrets==1.5.0"]
        exclude: |
          (?x)^(
            .*\.lock$|
            .*package-lock\.json$|
            \.secrets\.baseline$
          )$
