title = "RegEngine Gitleaks Config"

# ─── Base Ruleset ─────────────────────────────────────────────────
# Issue #2809: this config previously contained ONLY an [allowlist]
# and no [[rules]] / [extend], which meant gitleaks loaded zero
# detection rules and the required "Secrets Scan (gitleaks)" gate
# could never fail. Inherit the upstream default ruleset.
[extend]
useDefault = true

# ─── Allowlist ────────────────────────────────────────────────────
# Items here are known non-secrets: test fixtures, example configs,
# and demo data.
#
# Issue #1161: Removed blanket path ignores for migrations/, schemas/,
# docs/, and several other broad directories. Those directories can
# contain real credentials (e.g. connection strings in migration
# scripts). Instead we allowlist only specific known-safe patterns
# (example env files, named fixture files, test UUIDs, etc.).

[allowlist]
description = "Known non-secrets: test fixtures, example env files, and specific safe patterns"

# Specific known-safe file patterns only — no directory wildcards for
# migrations, schemas, or docs.
regexes = [
  # Test-marker UUIDs with literal "test" segment — not real identifiers
  '''[0-9a-f]{8}-test-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  # Zero-based fixture UUIDs (test sentinel values like 00000000-0000-...)
  '''[0-9a-f]{8}-0000-0000-0000-[0-9a-f]{12}''',
  # Alembic migration revision IDs: short 12-char hex strings assigned to revision/down_revision
  '''(?i)(revision|down_revision)\s*[=:]\s*(Union\[[^\]]+\],\s*)?["'][0-9a-f]{12}["']''',
  # Inline pragma: allowlist secret markers in test code
  '''pragma:\s+allowlist\s+secret''',
]

# Stop-words to exclude specific known test fixture values from historical
# commit scans. These are synthetic test tokens/secrets with no production use.
stopwords = [
  # Frontend test JWT (HS256 none algorithm, forged tenant_id) from #3085
  "eyJhbGciOiJub25lIn0.eyJ0ZW5hbnRfaWQiOiJmb3JnZWQifQ.",
  # Backend test internal secrets from #3085
  "s3cr3t-internal-2844",
  "test-internal-secret-2841",
  "internal-secret-for-2859",
]

paths = [
  # detect-secrets stores SHA-1 fingerprints and line metadata here, never
  # plaintext credentials. Scanning those hashes creates recursive findings.
  '''^\.secrets\.baseline$''',

  # Example / sample env files (never real credentials)
  '''\.env\.example$''',
  '''\.env\.sample$''',

  # Named test-fixture / diagnostic scripts (specific files, not whole dirs)
  '''db_test\.py$''',
  '''diag_db\.py$''',
  '''verify_phi\.py$''',
  '''login_resp\.json$''',
  '''frontend_logs\.txt$''',
  '''ingest_logs.*\.txt$''',

  # Agent / Claude instruction files (contain example prompts, not secrets)
  '''AGENTS\.md$''',
  '''\.github/copilot-instructions\.md$''',

  # Issue #3085: Test files contain synthetic fixtures. All use
  # non-production API keys, internal secrets, and JWT tokens for local/CI
  # testing. Real credentials are environment variables, not hardcoded.
  '''/tests/''',
  '''/test_''',
  '''__tests__/''',
  '''\.test\.ts$''',
  '''\.test\.py$''',

  # Issue #3085 also added '''^docs/''' and '''^scripts/''' here. Both are
  # removed again, because they are the blanket directory ignores #1161
  # deleted for the reason stated at the top of this file -- and both
  # directories hold exactly the content that reason is about.
  # security.yml's own header says it: "Scanning docs is also correct on its
  # own merits -- secrets get pasted into markdown runbooks, and gitleaks /
  # detect-secrets are exactly the gates that catch it." scripts/ is 113
  # files of operational tooling (backup_postgres.sh,
  # apply_runtime_role_cutover.py, audit_api_key_scopes.py), not fixtures.
  # Measured with gitleaks v8.30.0 on main @ 4eb1006b: a random AWS secret
  # key pasted into a docs runbook and a random key in this repository's own
  # rge_<id>.<secret> format pasted into a script were detected 0 of 3 times
  # with these two lines present and 3 of 3 times without them. Of the 6
  # historical findings they were masking, 5 are reviewed and pinned by
  # fingerprint in .gitleaksignore; the 6th (an unverified admin credential in
  # scripts/stress_test.py) is deliberately left unpinned there, so a new
  # secret in either directory now fails the gate and that one stays visible.
  '''/app/docs/''',
  '''/app/developer''',
  '''ONBOARDING_GUIDE\.md$''',
  '''CANONICAL_MODEL\.md$''',
]

# Historical commits with test fixtures explicitly marked as non-secrets.
# Issue #3085: these commits introduced test fixtures with inline
# `pragma: allowlist secret` markers, validated as synthetic test data.
commits = [
  "85df24ed4332b4822fd057733388b1b420bff75c",  # Frontend API test fixtures (JWT test tokens)
  "2036a16aae28aa3f5183257d8311e80d39c93d34",  # Backend test internal secrets (rate limit, idempotency)
  "df4b45a25b6a8e7966bea6212ccf497fbffcf04c",  # Shared tenant log context test
]
