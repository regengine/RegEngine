title = "RegEngine Gitleaks Config"

# ─── Base Ruleset ─────────────────────────────────────────────────
# Issue #2809: this config previously contained ONLY an [allowlist]
# and no [[rules]] / [extend], which meant gitleaks loaded zero
# detection rules and the required "Secrets Scan (gitleaks)" gate
# could never fail. Inherit the upstream default ruleset.
[extend]
useDefault = true

# ─── Allowlist ────────────────────────────────────────────────────
# Items here are known non-secrets: test fixtures, example configs,
# and demo data.
#
# Issue #1161: Removed blanket path ignores for migrations/, schemas/,
# docs/, and several other broad directories. Those directories can
# contain real credentials (e.g. connection strings in migration
# scripts). Instead we allowlist only specific known-safe patterns
# (example env files, named fixture files, test UUIDs, etc.).

[allowlist]
description = "Known non-secrets: test fixtures, example env files, and specific safe patterns"

# Specific known-safe file patterns only — no directory wildcards for
# migrations, schemas, or docs.
regexes = [
  # Test-marker UUIDs with literal "test" segment — not real identifiers
  '''[0-9a-f]{8}-test-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  # Zero-based fixture UUIDs (test sentinel values like 00000000-0000-...)
  '''[0-9a-f]{8}-0000-0000-0000-[0-9a-f]{12}''',
  # Alembic migration revision IDs: short 12-char hex strings assigned to revision/down_revision
  '''(?i)(revision|down_revision)\s*[=:]\s*(Union\[[^\]]+\],\s*)?["'][0-9a-f]{12}["']''',
  # Inline pragma: allowlist secret markers in test code
  '''pragma:\s+allowlist\s+secret''',
]

paths = [
  # detect-secrets stores SHA-1 fingerprints and line metadata here, never
  # plaintext credentials. Scanning those hashes creates recursive findings.
  '''^\.secrets\.baseline$''',

  # Example / sample env files (never real credentials)
  '''\.env\.example$''',
  '''\.env\.sample$''',

  # Named test-fixture / diagnostic scripts (specific files, not whole dirs)
  '''db_test\.py$''',
  '''diag_db\.py$''',
  '''verify_phi\.py$''',
  '''fix_password\.sql$''',
  '''login_resp\.json$''',
  '''frontend_logs\.txt$''',
  '''ingest_logs.*\.txt$''',

  # Agent / Claude instruction files (contain example prompts, not secrets)
  '''AGENTS\.md$''',
  '''\.github/copilot-instructions\.md$''',

  # Issue #3085: test files with historical synthetic test fixtures
  # marked with inline `pragma: allowlist secret` comments.
  '''frontend/src/__tests__/api/billing-checkout-route\.test\.ts$''',
  '''frontend/src/__tests__/api/ingestion-proxy-auth\.test\.ts$''',
  '''frontend/src/__tests__/api/nlp-ask-proxy\.test\.ts$''',
  '''frontend/src/__tests__/api/proxy-sanitization\.test\.ts$''',
  '''tests/unit/test_tenant_rate_limit_header_spoof_2844\.py$''',
  '''services/ingestion/tests/test_webhook_idempotency\.py$''',
  '''tests/shared/test_tenant_log_context_2859\.py$''',
  '''tests/shared/test_idempotency_middleware_1338\.py$''',
]

# Historical commits with test fixtures explicitly marked as non-secrets.
# Issue #3085: these commits introduced test fixtures with inline
# `pragma: allowlist secret` markers, validated as synthetic test data.
commits = [
  "85df24ed4332b4822fd057733388b1b420bff75c",  # Frontend API test fixtures (JWT test tokens)
  "2036a16aae28aa3f5183257d8311e80d39c93d34",  # Backend test internal secrets (rate limit, idempotency)
  "df4b45a25b6a8e7966bea6212ccf497fbffcf04c",  # Shared tenant log context test
]
