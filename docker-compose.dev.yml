# Minimal dev stack — Postgres + Redis. Run backend services locally.
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Production uses Supabase (Postgres 17). This provides a local Postgres
# for running tests and backend services without a Supabase project.
#
# Redis backs the subscription gate, rate limiting, and idempotency
# caching. Without it every authenticated ingest returns 503 (the gate
# fails closed), so a local end-to-end run — e.g. the inflow-lab customer
# journey — needs it. Seed a tenant's billing status with:
#   redis-cli HSET billing:tenant:<tenant_id> status trialing
#
# Legacy infrastructure is intentionally not part of the default dev stack.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: regengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: regengine
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U regengine" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
