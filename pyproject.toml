[project]
name = "regengine"
version = "0.4.0"
description = "RegEngine: The Regulatory Intelligence Platform"
authors = [{ name = "RegEngine Engineering", email = "admin@regengine.co" }]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.11,<3.13"

# NOTE: Runtime/dev dependencies are NOT declared here. The single source of
# truth is requirements.in (human-edited loose spec) compiled to
# requirements.lock (fully pinned + hashed via pip-tools). Docker and CI install
# exclusively from requirements.lock. This [project] table exists only for
# package metadata and tool configuration ([tool.ruff], [tool.mypy],
# [tool.pytest]); the root package is never built or installed (only the
# separate regengine/ SDK is, via its own setup.py).

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["__pycache__", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
# Import sorting (isort replacement) lives here. The CI per-service "bug gate"
# (see backend-ci.yml) runs ruff with an explicit narrow select
# (E9,F63,F7,F82) and does not depend on this config.
select = ["I"]

[tool.ruff.lint.isort]
# Match the previous isort profile = "black" behavior.
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
# Non-blocking: mypy is available for local use but is not yet a CI gate.
# Tighten incrementally (e.g. disallow_untyped_defs) per-module via overrides.

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --asyncio-mode=auto --import-mode=importlib"
# Only the repo root + services package dir are globally on pythonpath.
# Per-service ``app/`` resolution is handled by the root conftest.py hook
# which switches sys.path to the active service before each test collector
# runs. Listing multiple ``services/<svc>`` here would cause ``app`` to
# permanently resolve against whichever service sorted first.
pythonpath = [".", "services"]
testpaths = [
    "tests",
    "regengine/tests",
    "services/admin/tests",
    "services/compliance/tests",
    "services/graph/tests",
    "services/ingestion/tests",
    "services/nlp/tests",
    "services/scheduler/tests",
]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "integration: tests requiring docker/testcontainers or other live external services. Auto-skipped in services/graph/tests unless ``--run-integration`` is passed; opt in elsewhere via ``pytest -m integration``.",
]

[tool.coverage.run]
# #2891: the coverage denominator must be PRODUCT code only.
#
# The `shared` matrix leg runs `--cov=.` from services/shared, and with no
# omit configuration pytest's own test modules landed in the denominator.
# They are fully executed by definition, so they entered the report at
# ~86% covered and pulled the total up: 5,460 of 16,747 measured statements
# (33%) were test code. The "~44% locally" note the 35% floor was set from
# rested on that inflated basis.
#
# CI passes --cov-config=<repo root>/pyproject.toml because the matrix step
# `cd`s into services/<svc> and coverage.py only looks for a config file in
# the current directory — without the explicit flag this section would be
# silently ignored, which is the same class of defect it exists to fix.
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/__pycache__/*",
]
