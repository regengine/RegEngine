extensions:
  bearertokenauth:
    # Token comes from the environment so no credential is committed.
    # With this extension wired into the receivers below, the collector
    # rejects OTLP data that carries no valid bearer token.
    token: ${env:OTEL_AUTH_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        auth:
          authenticator: bearertokenauth
      http:
        auth:
          authenticator: bearertokenauth

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    policies:
      - name: errors-always-keep
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: probabilistic-default
        type: probabilistic
        probabilistic:
          sampling_percentage: 20
  filter/dlq:
    error_mode: ignore
    logs:
      include:
        match_type: regexp
        record_attributes:
          - key: message
            value: ".*(sent_to_dlq|poison_pill).*"

exporters:
  otlp/jaeger:
    # Endpoint and TLS mode come from the environment so production can
    # point at a TLS Jaeger without editing this file. The default is
    # secure (TLS verified). Local plaintext Jaeger setups must opt in
    # explicitly with JAEGER_OTLP_INSECURE=true.
    endpoint: ${env:JAEGER_OTLP_ENDPOINT:-jaeger:4317}
    tls:
      insecure: ${env:JAEGER_OTLP_INSECURE:-false}
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic
  debug/dlq:
    verbosity: basic
  file/logs:
    # Durable copy of the log pipeline so logs survive collector restarts
    # and are available to later review. The path can be overridden per
    # environment without editing this file.
    path: ${env:OTEL_LOGS_PATH:-/var/log/otel-collector/logs.jsonl}

service:
  extensions: [bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/dlq, batch]
      exporters: [debug, debug/dlq, file/logs]
