receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  probabilistic_sampler:
    sampling_percentage: 20
  filter/dlq:
    error_mode: ignore
    logs:
      include:
        match_type: regexp
        record_attributes:
          - key: message
            value: ".*(sent_to_dlq|poison_pill).*"

exporters:
  otlp/jaeger:
    # Endpoint and TLS mode come from the environment so production can
    # point at a TLS Jaeger without editing this file. The two defaults
    # must stay consistent with each other: the default endpoint is the
    # plaintext Jaeger all-in-one (no TLS listener), so the default TLS
    # mode is off to match. A production deploy must set BOTH knobs
    # together: JAEGER_OTLP_ENDPOINT to a TLS address and
    # JAEGER_OTLP_INSECURE=false. Setting only the endpoint aims
    # plaintext export at a TLS port and the export fails.
    endpoint: ${env:JAEGER_OTLP_ENDPOINT:-jaeger:4317}
    tls:
      insecure: ${env:JAEGER_OTLP_INSECURE:-true}
      # Optional: verify a private-CA Jaeger backend against a custom CA
      # bundle instead of the host root store. Uncomment and set
      # JAEGER_OTLP_CA_FILE when the backend presents a private CA cert.
      # ca_file: ${env:JAEGER_OTLP_CA_FILE}
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic
  debug/dlq:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/dlq, batch]
      exporters: [debug, debug/dlq]
