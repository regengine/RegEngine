apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-service
  labels:
    app: admin
spec:
  podSelector:
    matchLabels:
      app: admin
  policyTypes:
    - Ingress
    - Egress

  # Allow ingress only from the NGINX ingress controller
  ingress:
    - from:
        # The ingress controller runs in its OWN namespace, so this peer needs
        # BOTH selectors inside ONE list element (they AND together). A bare
        # podSelector matches only the policy's own namespace (regengine-prod),
        # which matched zero pods and denied all Ingress traffic (#2959).
        # Splitting these into two list elements would OR them and admit every
        # pod in the ingress-nginx namespace - do not do that.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8400

  # Allow egress to PostgreSQL, Redis, external HTTPS, and internal services
  egress:
    # PostgreSQL
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    # Redis
    - to: []
      ports:
        - protocol: TCP
          port: 6379
    # External HTTPS
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Internal service communication (ingestion, compliance, scheduler)
    - to:
        - podSelector:
            matchLabels:
              app: ingestion
        - podSelector:
            matchLabels:
              app: compliance
        - podSelector:
            matchLabels:
              app: scheduler
      ports:
        - protocol: TCP
          port: 8000
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
