# STATUS: these manifests are validated by .github/workflows/infra-k8s-ci.yml
# (kustomize render + object inventory) but are NOT applied by any pipeline in
# this repo, and nothing here builds the ghcr.io/regengine/* images the
# Deployments reference (#2889). Live production is the Railway monolith plus
# the Vercel frontend. Treat this tree as unexercised config: defects here are
# latent until someone applies it, which is exactly how #2959 - a NetworkPolicy
# that denied all Ingress traffic - survived unnoticed.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - compliance/deployment.yaml
  - compliance/networkpolicy.yaml
  - admin/deployment.yaml
  - admin/networkpolicy.yaml
  - ingestion/deployment.yaml
  - ingestion/networkpolicy.yaml
  - scheduler/deployment.yaml
  - scheduler/networkpolicy.yaml
  - graph/deployment.yaml
  - graph/networkpolicy.yaml
  - nlp/deployment.yaml
  - nlp/networkpolicy.yaml
  - monitoring/alertmanager.yaml
  - ingress.yaml
