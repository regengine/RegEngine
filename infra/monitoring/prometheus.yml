global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'regengine-services'
    metrics_path: '/metrics'
    scrape_timeout: 10s
    # RegEngine services protect /metrics with X-Metrics-Key. Mount the
    # METRICS_API_KEY value as this file in the Prometheus deployment.
    # Requires Prometheus 2.55+ / 3.x custom scrape headers.
    http_headers:
      X-Metrics-Key:
        files:
          - /etc/prometheus/secrets/metrics-api-key
    static_configs:
      - targets:
          - 'admin-service:80'
        labels:
          service: 'admin-service'
      - targets:
          - 'compliance-service:80'
        labels:
          service: 'compliance-service'
      - targets:
          - 'graph-service:80'
        labels:
          service: 'graph-service'
      - targets:
          - 'ingestion-service:80'
        labels:
          service: 'ingestion-service'
      - targets:
          - 'nlp-service:80'
        labels:
          service: 'nlp-service'
      - targets:
          - 'scheduler-service:80'
        labels:
          service: 'scheduler-service'

# NOTE: there is intentionally no kubernetes_sd job here. A previous
# revision scraped cluster nodes via Kubernetes service discovery, but no
# Prometheus, node exporter, or related RBAC exists in this tree, so that
# job could never produce data and failed outside a cluster. Node-level
# alert rules were pruned from alert_rules.yml for the same reason. Restore
# both together when node exporter is actually deployed (see alert_rules.yml).
