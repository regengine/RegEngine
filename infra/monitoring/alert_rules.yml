# Coverage note: every rule below queries metrics from the
# regengine-services scrape job in prometheus.yml (service /metrics).
# Rules needing exporters that do not exist in this tree (Kafka exporter
# metrics kafka_consumergroup_*, node exporter metrics node_*,
# postgres exporter metrics pg_*) were pruned because they could never
# have data and only suggested coverage that was not there. The pruned
# rules live in git history; restore them together with real scrape jobs
# when those exporters are deployed.
groups:
  - name: regengine_critical_alerts
    interval: 30s
    rules:
      # Service Health Alerts
      - alert: ServiceDown
        expr: up{job="regengine-services"} == 0
        for: 1m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "RegEngine service {{ $labels.service }} is down"
          description: "Service {{ $labels.service }} ({{ $labels.instance }}) has been down or unscrapeable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(http_requests_total{job="regengine-services", status=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total{job="regengine-services"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "5xx ratio is {{ $value | humanizePercentage }} on {{ $labels.service }}."

      - alert: HighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, le) (rate(http_request_duration_seconds_bucket{job="regengine-services"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: critical
          component: performance
        annotations:
          summary: "High P99 latency on {{ $labels.service }}"
          description: "P99 latency is {{ $value | humanizeDuration }} on {{ $labels.service }} (threshold: 500ms)."

      # Audit-the-auditor: a dropped data.bulk.export self-log means a
      # privileged audit export (potentially raw PII) returned without
      # its tamper-evidence record. The export endpoint now fails closed
      # (#2522), but any increment here is a compliance-relevant event
      # that must page an operator rather than sit unread on /metrics.
      - alert: AuditExportSelfLogFailed
        expr: increase(admin_audit_log_failures_total{event_type="data.bulk.export"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          component: audit
        annotations:
          summary: "Audit-export self-log failed (audit the auditor)"
          description: "{{ $value }} data.bulk.export audit self-log write(s) failed in the last 5m on {{ $labels.instance }}. A privileged audit export could not persist its 'who exported what' record; investigate audit_logs schema/health immediately."

  - name: regengine_warning_alerts
    interval: 30s
    rules:
      - alert: IncreasedErrorRate
        expr: |
          (
            sum by (service) (rate(http_requests_total{job="regengine-services", status=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total{job="regengine-services"}[5m]))
          ) > 0.01
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Increased error rate on {{ $labels.service }}"
          description: "5xx ratio is {{ $value | humanizePercentage }} on {{ $labels.service }}."

      - alert: ModerateP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, le) (rate(http_request_duration_seconds_bucket{job="regengine-services"}[5m]))
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Elevated P99 latency on {{ $labels.service }}"
          description: "P99 latency is {{ $value | humanizeDuration }} on {{ $labels.service }} (threshold: 200ms)."
