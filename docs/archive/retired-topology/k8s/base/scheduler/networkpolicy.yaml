apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduler-service
  labels:
    app: scheduler
spec:
  podSelector:
    matchLabels:
      app: scheduler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # The ingress controller runs in its OWN namespace, so this peer needs
        # BOTH selectors inside ONE list element (they AND together). A bare
        # podSelector matches only the policy's own namespace (regengine-prod),
        # which matched zero pods and denied all Ingress traffic (#2959).
        # Splitting these into two list elements would OR them and admit every
        # pod in the ingress-nginx namespace - do not do that.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - podSelector:
            matchLabels:
              app: admin
      ports:
        - protocol: TCP
          port: 8600
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    - to: []
      ports:
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9644
    - to:
        - podSelector:
            matchLabels:
              app: ingestion
        - podSelector:
            matchLabels:
              app: compliance
      ports:
        - protocol: TCP
          port: 8000
    - to: []
      ports:
        - protocol: TCP
          port: 443
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
