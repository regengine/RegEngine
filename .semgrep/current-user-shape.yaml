# RE-SEC-001 / RE-SEC-002 regression guard.
#
# In services/admin (and any other FastAPI service that uses
# ``get_current_user``), ``current_user`` is a SQLAlchemy ``UserModel``
# ORM instance, not a dict. Calling ``.get("user_id")`` /
# ``.get("email")`` on it raises AttributeError at runtime. When the
# call site is wrapped in a broad ``except Exception``, the failure
# silently turns into a misleading 500 ("logged and processed
# manually") and security-critical flows like GDPR Article 17 erasure
# silently no-op.
#
# This rule flags ``$X.get(...)`` where ``$X`` is annotated
# ``UserModel`` in the enclosing function signature.
#
# Wire into CI via:
#   semgrep --config .semgrep/current-user-shape.yaml --error .
#
# To grant a legitimate exception, add a ``# nosemgrep: rule-id``
# comment on the same line with rationale.

rules:
  - id: current-user-dict-access-on-usermodel
    message: >-
      `current_user` is a SQLAlchemy UserModel ORM instance, not a dict.
      Use attribute access (`current_user.id`, `current_user.email`)
      instead of `.get(...)`. RE-SEC-001 / RE-SEC-002: dict-style access
      raises AttributeError at runtime and, when paired with a broad
      `except Exception`, silently breaks GDPR Articles 15, 17, and 20.
      Tenant_id should come from
      `TenantContext.get_tenant_context(db)`, not the user object.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: $X.get(...)
      - pattern-inside: |
          def $F(..., $X: UserModel = ..., ...):
              ...
    paths:
      exclude:
        - "**/tests/**"
        - "**/test_*.py"

  - id: current-user-dict-access-on-usermodel-async
    message: >-
      `current_user` is a SQLAlchemy UserModel ORM instance, not a dict.
      Use attribute access (`current_user.id`, `current_user.email`)
      instead of `.get(...)`. RE-SEC-001 / RE-SEC-002.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: $X.get(...)
      - pattern-inside: |
          async def $F(..., $X: UserModel = ..., ...):
              ...
    paths:
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
