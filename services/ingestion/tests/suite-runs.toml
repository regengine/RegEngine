# services/ingestion/tests/suite-runs.toml
#
# Allowlist config for the "Ingestion full suite (xdist signal)" CI gate.
#
# Why this file exists
# --------------------
# The ingestion test directory has two structural problems that prevent a
# clean ``pytest services/ingestion/tests`` run:
#
#   1. Six test files do module-level ``sys.modules[...]`` writes with no
#      teardown. They pass solo but corrupt other tests' import state when
#      run in the same pytest process. ``--dist=loadfile`` already pins
#      each test file to a dedicated worker process so these can't actually
#      poison anything cross-file at runtime — but they remain a footgun
#      worth flagging until the rewrite (Option A) lands.
#
#   2. A handful of files have pre-existing failures unrelated to the
#      cascade — broken mocks targeting names that moved during recent
#      refactors, or env-coupled smoke probes. They fail solo too.
#
# This file lists both buckets so the suite-runs gate produces zero
# failures and gives real signal. Excluded files are not deleted; they
# still pass when run individually and remain on the allowlist for the
# per-service ``test`` matrix in backend-ci.yml.
#
# How to add a file back to the gate
# ----------------------------------
# 1. Run it against the current allowlist:
#       pytest services/ingestion/tests/<your file> --no-cov \
#         $(python3 scripts/render_ingestion_ignores.py)
#    plus the loadfile run:
#       pytest services/ingestion/tests \
#         --dist=loadfile -n auto --no-cov \
#         $(python3 scripts/render_ingestion_ignores.py)
# 2. If both pass, remove the entry from this file.
# 3. If they don't, fix the underlying issue or quarantine the file with
#    a comment here explaining why.
#
# References
# ----------
# - project_test_suite_isolation_2026_04_19.md (root-cause table)
# - PR #2201 (collection-resilience for OTEL drift)
# - PR #2200 (route split that broke the ``app.routes.*`` mock targets)

[ignore]

# ── Module-level sys.modules poisoners ────────────────────────────────
# These rewrite ``sys.modules[...]`` at import time with no teardown. Pass
# solo (and per-file in CI), poison other tests' imports when sharing a
# pytest process. Option A (rewrite to use fixtures) is a separate sprint;
# until then they stay quarantined from the suite-runs gate.
poisoners = [
    "test_sandbox_router_1342.py",            # rewrites shared.database
    "test_routes_health_metrics_1342.py",     # rewrites shared.kafka_consumer_base, app.config
    "test_task_handlers_scraping_1342.py",    # rewrites app.scraper_job, app.routes_scraping
    "test_task_handlers_sources_1342.py",     # rewrites regengine_ingestion(.sources), app.routes
    "test_task_handlers_discovery_1342.py",   # rewrites kernel, kernel.discovery
    "test_task_handlers_regulation_1342.py",  # rewrites app.regulation_loader
]

# ── Pre-existing real failures (not cascade-induced) ──────────────────
# These fail solo too. Listed individually with the underlying reason so
# whoever owns the fix can grep their test file and find the entry.
#
# Both prior entries (``test_routes_regulation_task_queue.py`` and
# ``test_smoke_ingestion.py``) were repointed to ``app.routes_ingest`` in
# the PR that fixes the PR #2200 fallout — they now pass and have been
# removed from this allowlist.
pre_existing_failures = []
